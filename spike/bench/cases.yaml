# SPDX-License-Identifier: GPL-3.0-or-later
# Spike Q1 benchmark: typical calculator inputs, timed through MathEngine (Web Worker).
# This is a timing set, not a golden set. `expect` is given only where the value is provable
# (source: derived) and is checked as an exact string match on Giac's output; everything else
# just records the output for review. Settings: Digits:=12, radians.
cases:
  # arithmetic / numbers
  - { id: arith-frac, cat: arithmetic, input: "1/3+1/6", expect: "1/2", source: derived }
  - { id: arith-dec, cat: arithmetic, input: "1-0.9-0.1" }
  - { id: arith-pow, cat: arithmetic, input: "2^100", expect: "1267650600228229401496703205376", source: derived }
  - { id: arith-fact, cat: arithmetic, input: "50!" }
  - { id: arith-sqrt, cat: arithmetic, input: "sqrt(12)", expect: "2*sqrt(3)", source: derived }
  - { id: arith-evalf, cat: arithmetic, input: "evalf(sqrt(2))" }
  - { id: arith-pi50, cat: arithmetic, input: "evalf(pi,50)" }
  - { id: arith-ifactor, cat: arithmetic, input: "ifactor(123456789)" }
  - { id: arith-gcd, cat: arithmetic, input: "gcd(1071,462)", expect: "21", source: derived }
  - { id: arith-complex, cat: arithmetic, input: "(3+4*i)*(1-2*i)", expect: "11-2*i", source: derived }
  # trig / transcendental
  - { id: trig-exact, cat: trig, input: "sin(pi/6)", expect: "1/2", source: derived }
  - { id: trig-num, cat: trig, input: "evalf(sin(1)+cos(2))" }
  - { id: trig-simplify, cat: trig, input: "simplify(sin(x)^2+cos(x)^2)", expect: "1", source: derived }
  - { id: trig-expand, cat: trig, input: "texpand(sin(2*x))" }
  - { id: trig-atan, cat: trig, input: "atan(1)", expect: "pi/4", source: derived }
  - { id: exp-ln, cat: trig, input: "evalf(exp(1)*ln(10))" }
  # algebra
  - { id: alg-factor, cat: algebra, input: "factor(x^4-1)" }
  - { id: alg-factor2, cat: algebra, input: "factor(x^6-y^6)" }
  - { id: alg-expand, cat: algebra, input: "expand((x+y)^5)" }
  - { id: alg-partfrac, cat: algebra, input: "partfrac(1/(x^2-1))" }
  - { id: alg-normal, cat: algebra, input: "normal((x^2-1)/(x-1))", expect: "x+1", source: derived }
  # solve
  - { id: solve-quad, cat: solve, input: "solve(x^2=2,x)" }
  - { id: solve-cubic, cat: solve, input: "solve(x^3-6*x^2+11*x-6=0,x)" }
  - { id: solve-sys, cat: solve, input: "solve([x+y=3,x-y=1],[x,y])" }
  - { id: solve-trig, cat: solve, input: "solve(sin(x)=1/2,x)" }
  - { id: solve-fsolve, cat: solve, input: "fsolve(x*exp(x)=5,x=1)" }
  - { id: solve-fsolve-sys, cat: solve, input: "fsolve([x^2+y^2=4,x=y],[x,y],[1,1])" }
  - { id: solve-proot, cat: solve, input: "proot([1,0,-2,5])" }
  - { id: solve-csolve, cat: solve, input: "csolve(x^4=1,x)" }
  # calculus
  - { id: int-atan, cat: calculus, input: "int(1/(1+x^2),x)" }
  - { id: int-parts, cat: calculus, input: "int(x*exp(x),x)" }
  - { id: int-def, cat: calculus, input: "int(x^2,x,0,3)", expect: "9", source: derived }
  - { id: int-trig, cat: calculus, input: "int(sin(x)^3,x)" }
  - { id: int-num, cat: calculus, input: "romberg(exp(-x^2),x,0,1)" }
  - { id: diff-chain, cat: calculus, input: "diff(sin(x^2),x)" }
  - { id: diff-2nd, cat: calculus, input: "diff(x^3*ln(x),x,2)" }
  - { id: limit-sinc, cat: calculus, input: "limit(sin(x)/x,x,0)", expect: "1", source: derived }
  - { id: limit-inf, cat: calculus, input: "limit((1+1/n)^n,n,inf)" }
  - { id: series-exp, cat: calculus, input: "series(exp(x),x,0,5)" }
  - { id: sum-sym, cat: calculus, input: "sum(k^2,k,1,n)" }
  - { id: desolve, cat: calculus, input: "desolve(y'=y,y)" }
  # matrices / lists
  - { id: mat-det, cat: matrix, input: "det([[1,2],[3,4]])", expect: "-2", source: derived }
  - { id: mat-inv, cat: matrix, input: "inv([[1,2],[3,4]])" }
  - { id: mat-eig, cat: matrix, input: "eigenvals([[2,1],[1,2]])" }
  - { id: mat-rref, cat: matrix, input: "rref([[1,2,3],[4,5,6],[7,8,10]])" }
  - { id: mat-mul, cat: matrix, input: "[[1,2],[3,4]]*[[5,6],[7,8]]" }
  - { id: mat-det5, cat: matrix, input: "det(hilbert(5))" }
  # statistics / regressions
  - { id: stat-mean, cat: stats, input: "mean([1,2,3,4,10])", expect: "4", source: derived }
  - { id: stat-stddev, cat: stats, input: "stddev([2,4,4,4,5,5,7,9])", expect: "2", source: derived }
  - { id: stat-linreg, cat: stats, input: "linear_regression([1,2,3,4],[2.1,3.9,6.2,7.8])" }
  - { id: stat-expreg, cat: stats, input: "exponential_regression([1,2,3,4],[2.7,7.4,20.1,54.6])" }
  - { id: stat-normal, cat: stats, input: "normald_cdf(0,1,1.96)" }
  # heavier "still calculator-sized" inputs
  - { id: heavy-factor, cat: heavy, input: "factor(x^20-1)" }
  - { id: heavy-int, cat: heavy, input: "int(1/(x^4+1),x)" }
  - { id: heavy-ifactor, cat: heavy, input: "ifactor(2^64+1)" }

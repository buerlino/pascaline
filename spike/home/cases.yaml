# Exact-first Home evaluation (spike step 5, Q3): input → value shown with 12 significant digits.
#
# `expect` is the mathematically correct value rounded to 12 significant digits, half away from
# zero, in our canonical test format (formatDecimal in spike/app/src/home/homeEval.ts: plain for
# 1e-4 ≤ |x| < 1e12, else d.dddE±k; complex as a+b*i). It is NOT a claim about how the G2 displays
# anything; display questions go to spike/G2-CHECKLIST.md.
#   source: oracle  → expect written by spike/home/oracle.py (mpmath at 30 digits, cross-checked at 60;
#                     exact Fraction arithmetic where the expression is rational)
#   source: derived → provable by hand (value given in `note` where not obvious); oracle is a cross-check
# `angle` defaults to rad. One case per line (oracle.py rewrites lines).
cases:
  # --- binary-float traps: exact rationals give the true value -------------------------------
  - { id: "trap-1-0.9-0.1", input: "1-0.9-0.1", oracle: "F(1)-F('0.9')-F('0.1')", expect: "0", source: "derived" }

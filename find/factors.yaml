# SPDX-License-Identifier: GPL-3.0-or-later
# Find: the numbers libqalculate 5.13.1 gave the Find index, checked in so the build needs no qalc build (A21, decisions.md P22).
# Names, titles and symbols' structure still come from the libqalculate tarball's XML (generate.mjs); this file holds only
# the numbers. Run by a developer only: node tools/find-index/refresh-factors.mjs recomputes them from the qalc build
# (engine/qalc/build-wasm.sh) and prints the difference; a change needs a find/units.yaml checks case or the owner's OK.
#
# Rows (the id is the Find id without its kind prefix):
#   prefixes  si    the factor as 1/10^n or 10^n or 2^n
#   units     si    the factor to SI base units (kg, not g), exact "p/q" (or "p/q*pi"); a temperature unit "k+offset"; none = no exact factor
#             dim   the dimension key (kg1m2s-2); "" = a pure number
#             sym   the printed symbol qalc gives (where it is more than the id)
#   constants value, unc (the 2-digit uncertainty, last digits), dim
#   source    "exact definition" (2019 SI, the 1959 yard and pound, NIST SP 811: find/units.yaml checks audit every one),
#             "CODATA 2022" (NIST allascii.txt), or "libqalculate 5.13.1" (qalc's own number)
#   qalc, qalcUnc, note   a row whose value replaces qalc's known data error: what qalc gives, and why (libqalculate#1043-1045)


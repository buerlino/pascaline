# SPDX-License-Identifier: GPL-3.0-or-later
# Find: our unit data (docs/04 3.3), read by tools/find-index/generate.mjs.
#
# units: the common prefixed and compound units an engineer types, as items of their own (qalc's data has prefixes,
#   not prefixed units). Fields:
#     id     the qalc text; the generator checks that it parses back to exactly `parts`
#     parts  "pfx:unit^exp ...", qalc reference names (k:W h = kW·h); pfx is qalc's ASCII prefix symbol (u = µ)
#     names  extra names a user may type; the printed symbol (kΩ, µF) is added from qalc
#     title  default: the prefix and qalc's title (Kilonewton)
#   Left out on purpose: mbar (qalc prints it "millibar", not a symbol; hPa is the same size).
#
# checks: our audit of the numbers in find/factors.yaml against the exact definitions (the international yard and pound of
#   1959, the 2019 SI, NIST SP 811, CODATA 2022). Units: `si`, a product or quotient of decimals in SI base units (kg, not g).
#   Constants: `value` (with `unc` for a measured one; NIST allascii.txt). A row that differs fails the build. Where
#   libqalculate's own number is wrong (docs/backlog.md "Upstream reports"), the row in factors.yaml takes our value and
#   keeps qalc's in `qalc` with the reason in `note`; tools/find-index/refresh-factors.mjs tells when qalc changes.
#
# constants.skipCategories: qalc categories under Physical Constants left out of Find (derived conversion tables).

units:
  # force, pressure
  - { id: kN, parts: "k:N" }
  - { id: MN, parts: "M:N" }
  - { id: kPa, parts: "k:Pa" }
  - { id: MPa, parts: "M:Pa", names: ["N/mm^2", "N/mm²"] }
  - { id: GPa, parts: "G:Pa" }
  - { id: hPa, parts: "h:Pa" }
  # torque, energy, power
  - { id: N*m, parts: "N m", title: "Newton metre", names: ["Nm", "newton metre", "newton meter"] }
  - { id: kN*m, parts: "k:N m", title: "Kilonewton metre", names: ["kNm"] }
  - { id: MJ, parts: "M:J" }
  - { id: Wh, parts: "W h", title: "Watt hour", names: ["watt hour"] }
  - { id: kWh, parts: "k:W h", title: "Kilowatt hour", names: ["kilowatt hour"] }
  - { id: MWh, parts: "M:W h", title: "Megawatt hour", names: ["megawatt hour"] }
  - { id: mW, parts: "m:W" }
  - { id: kW, parts: "k:W" }
  - { id: MW, parts: "M:W" }
  - { id: GW, parts: "G:W" }
  # electrical
  - { id: uA, parts: "u:A" }
  - { id: mA, parts: "m:A" }
  - { id: kA, parts: "k:A" }
  - { id: mV, parts: "m:V" }
  - { id: kV, parts: "k:V" }
  - { id: mohm, parts: "m:ohm" }
  - { id: kohm, parts: "k:ohm", title: "Kiloohm (kΩ)" }
  - { id: Mohm, parts: "M:ohm", title: "Megaohm (MΩ)" }
  - { id: pF, parts: "p:F" }
  - { id: nF, parts: "n:F" }
  - { id: uF, parts: "u:F" }
  - { id: mF, parts: "m:F" }
  - { id: nH, parts: "n:H" }
  - { id: uH, parts: "u:H" }
  - { id: mH, parts: "m:H" }
  - { id: uT, parts: "u:T" }
  - { id: mT, parts: "m:T" }
  - { id: kHz, parts: "k:Hz" }
  - { id: MHz, parts: "M:Hz" }
  - { id: GHz, parts: "G:Hz" }
  # mass, time, amount
  - { id: ug, parts: "u:g" }
  - { id: mg, parts: "m:g" }
  - { id: ns, parts: "n:s" }
  - { id: us, parts: "u:s" }
  - { id: ms, parts: "m:s" }
  - { id: mmol, parts: "m:mol" }
  - { id: kmol, parts: "k:mol" }
  # structural, lumber, charge (spec/units-menu.yaml add_to_find; sizes in checks)
  #   symbol the printed symbol where qalc's own is a product (kip, fbm)
  #   text   the qalc text to evaluate where the id itself does not parse (qalc reads "kip" as k·i·p, "fbm" as femto-bar·m)
  - { id: kip, text: "klbf", symbol: kip, parts: "k:lbf", names: [klbf], title: "Kip (1000 lbf)" }
  - { id: fbm, text: "ft^2*in", symbol: fbm, parts: "ft^2 in", names: ["board foot", "board feet"], title: "Board foot" }
  - { id: Ah, parts: "A h", names: ["ampere hour"], title: "Ampere hour" }
  - { id: mAh, parts: "m:A h", names: ["milliampere hour"], title: "Milliampere hour" }

# defined: units qalc lacks or has with another meaning, with an exact `si` (a product or quotient of decimals) and
#   `dim` (the dimension key; "" = a pure count), `source` (derived or oracle) and `title`; optional `names`, `symbol`.
#   `replace: true` takes the place of qalc's unit of that id. No checks entry: the definition is the size.
# dropNames: names taken off another item (the unit that now owns them).
#
# Why some ids the specs mention are not units of their own (G7): `mmH2O` is qalc's mmWC (name "mmH₂O", the unit
#   pad and menu use `mmWC`); `percent` and `ppm` are qalc constants (variables.xml), not units, so Find does not list
#   them and a unit slot cannot hold them (`%` gets no unit cell).
defined:
  # the cycle unit (G25, decisions.md G15): a revolution counts cycles, a pure number, so rev/s is a frequency like Hz
  # and rpm = 1 rev/min = 1/60 Hz with no 2π. qalc's rpm is π/30 rad/s (the 2π trap); `tr` (turn) stays 2π rad.
  - { id: rev, title: "Revolution (cycle count)", names: [revolution, cycle], si: "1", dim: "", source: derived }
  - { id: rpm, title: "Revolutions per Minute (RPM)", si: "1/60", dim: "s-1", source: derived, replace: true }
  # ton of refrigeration: 12 000 Btu_IT/h (derived: 12000 * 1055.05585262 / 3600 = 3516.852842066666... W)
  - { id: TR, title: "Ton of refrigeration", names: ["ton of refrigeration", "refrigeration ton"], si: "12000*1055.05585262/3600", dim: "kg1m2s-3", source: derived }

dropNames:
  "unit:tr": [rev, revolution, cyc, cycle]

checks:
  # length, mass, force, pressure (international yard and pound, 1959; standard gravity 9.80665)
  "unit:in": { si: "0.0254" }
  "unit:ft": { si: "0.3048" }
  "unit:yd": { si: "0.9144" }
  "unit:mi": { si: "1609.344" }
  "unit:thou": { si: "0.0000254" }
  "unit:nmi": { si: "1852" }
  "unit:angstrom": { si: "1E-10" }
  "unit:lb": { si: "0.45359237" }
  "unit:t": { si: "1000" }
  "unit:lbf": { si: "0.45359237*9.80665" }
  "unit:kgf": { si: "9.80665" }
  "unit:psi": { si: "0.45359237*9.80665/0.0254/0.0254" }
  "unit:bar": { si: "100000" }
  "unit:atm": { si: "101325" }
  "unit:Torr": { si: "101325/760" }
  # conventional millimetre of mercury: 133.322387415 Pa (NIST SP 811); qalc defines it as 1 Torr (133.322368… Pa)
  # conventional inch of mercury: 25.4 mmHg; qalc's follows its Torr-based mmHg
  "unit:inHg": { si: "0.0254*13595.1*9.80665" }
  "unit:mmHg": { si: "133.322387415" }
  # speed, volume
  "unit:km/h": { si: "1000/3600" }
  "unit:mph": { si: "1609.344/3600" }
  "unit:knot": { si: "1852/3600" }
  "unit:L": { si: "0.001" }
  "unit:gal": { si: "231*0.0254*0.0254*0.0254" }
  "unit:gal_UK": { si: "0.00454609" }
  # energy, power (thermochemical and IT calorie, IT Btu; mechanical horsepower = 550 ft·lbf/s)
  "unit:cal": { si: "4.184" }
  "unit:cal_IT": { si: "4.1868" }
  "unit:kcal": { si: "4184" }
  "unit:Btu": { si: "1055.05585262" }
  "unit:eV": { si: "1.602176634E-19" }
  "unit:kWh": { si: "3600000" }
  "unit:hp": { si: "550*0.3048*0.45359237*9.80665" }
  # kip = 1000 lbf; board foot = 1 ft x 1 ft x 1 in (derived); ampere hour = 3600 C (derived)
  "unit:kip": { si: "1000*0.45359237*9.80665" }
  "unit:fbm": { si: "0.3048*0.3048*0.0254" }
  "unit:Ah": { si: "3600" }
  "unit:mAh": { si: "3.6" }
  # time
  "unit:h": { si: "3600" }
  "unit:d": { si: "86400" }
  # exact constants of the 2019 SI and their exact products
  "const:c": { value: "299792458" }
  "const:planck": { value: "6.62607015E-34" }
  "const:q_e": { value: "1.602176634E-19" }
  "const:k_B": { value: "1.380649E-23" }
  "const:N_A": { value: "6.02214076E23" }
  "const:g_0": { value: "9.80665" }
  "const:StdT": { value: "273.15" }
  "const:StdP": { value: "101325" }
  "const:gas_constant": { value: "6.02214076E23*1.380649E-23" }
  "const:faraday": { value: "6.02214076E23*1.602176634E-19" }
  # CODATA 2022 (NIST allascii.txt) against qalc's own constants: the value and the 2-digit uncertainty, last digits only (G13)
  "const:Z_0": { value: "376.730313412", unc: "5.9E-8" }
  "const:mu_0": { value: "1.25663706127E-6", unc: "2.0E-16" }
  "const:m_n": { value: "1.67492750056E-27", unc: "8.5E-37" }
  "const:m_tau": { value: "3.16754E-27", unc: "2.1E-31" }
  "const:lambda_C": { value: "2.42631023538E-12", unc: "7.6E-22" }
  "const:muon_compton_wavelength": { value: "1.173444110E-14", unc: "2.6E-22" }
  "const:muon_compton_wavelength_2pi": { value: "1.867594306E-15", unc: "4.2E-23" }
  "const:neutron_compton_wavelength": { value: "1.31959090382E-15", unc: "6.7E-25" }
  "const:proton_compton_wavelength_2pi": { value: "2.10308910051E-16", unc: "6.6E-26" }
  "const:tau_compton_wavelength": { value: "6.97771E-16", unc: "4.7E-20" }
  "const:tau_compton_wavelength_2pi": { value: "1.110538E-16", unc: "7.5E-21" }
  "const:Ha_constant": { value: "4.3597447222060E-18", unc: "4.8E-30" }
  "const:d_220": { value: "1.920155716E-10", unc: "3.2E-18" }

constants:
  # Ours, not in qalc: the standard temperature and pressure that V_m101 goes with (spec/units-menu.yaml constants.define).
  # Exact: 0 °C = 273.15 K by the definition of the Celsius scale, 1 atm = 101325 Pa by definition.
  define:
    StdT: { value: "273.15", unit: K, title: "Standard temperature", names: ["standard temperature", "stp temperature"], source: derived }
    StdP: { value: "101325", unit: Pa, title: "Standard pressure", names: ["standard pressure", "stp pressure"], source: derived }
  skipCategories: ["Conversion factors for energy equivalents", "Particle Mass in u", "Particle Mass in MeV*c^(-2)"]

apply plugin: 'com.android.application'

android {
    namespace = "org.pascaline.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.pascaline.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // Measurement builds (PASCALINE_MEASURE=1) log timing marks to logcat; normal builds never do.
        buildConfigField "boolean", "MEASURE", (System.getenv('PASCALINE_MEASURE') == '1') ? "true" : "false"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig = true }
    // D9: keep .wasm uncompressed in the APK (mmap-able, about 75 ms off cold start)
    androidResources { noCompress 'wasm' }
    // Release builds are signed with a throwaway key only when PASCALINE_KEYSTORE names one (never committed).
    // Without it, assembleRelease produces app-release-unsigned.apk.
    if (System.getenv('PASCALINE_KEYSTORE')) {
        signingConfigs {
            throwaway {
                storeFile file(System.getenv('PASCALINE_KEYSTORE'))
                storePassword System.getenv('PASCALINE_KEYSTORE_PASS') ?: 'pascaline-throwaway'
                keyAlias 'throwaway'
                keyPassword System.getenv('PASCALINE_KEYSTORE_PASS') ?: 'pascaline-throwaway'
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('PASCALINE_KEYSTORE')) { signingConfig signingConfigs.throwaway }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// No Google services plugin: no Play Services, Firebase or push (CLAUDE.md, F-Droid).

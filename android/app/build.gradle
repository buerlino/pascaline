apply plugin: 'com.android.application'

android {
    namespace = "dev.n62.calc"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.n62.calc"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        // versionCode and versionName stay plain literals: F-Droid's update check reads them as text (tools/check-version.sh
        // checks them against app/package.json and the recipe). A measurement build says so in a suffix, so tools/device_run.py
        // can report the build type (its versionName ends in "-measure").
        versionName "0.1.0"
        versionNameSuffix = (System.getenv('N62_MEASURE') == '1') ? "-measure" : ""
        // Measurement builds (N62_MEASURE=1) log timing marks to logcat; normal builds never do.
        buildConfigField "boolean", "MEASURE", (System.getenv('N62_MEASURE') == '1') ? "true" : "false"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig = true }
    // F-Droid flags the dependency block that the Android Gradle plugin signs into the APK and the bundle
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    // D9: keep .wasm uncompressed in the APK (mmap-able, about 75 ms off cold start)
    androidResources { noCompress 'wasm' }
    // Signing reads the whole key from the environment (A7): N62_KEYSTORE (file), N62_KEYSTORE_PASS,
    // N62_KEY_ALIAS, N62_KEY_PASS. The throwaway defaults (alias `throwaway`, password `pascaline-throwaway`)
    // apply only while N62_KEY_ALIAS is unset, so dev builds work unchanged; with an alias set, a missing password
    // fails the build. Nothing is committed. Without N62_KEYSTORE, assembleRelease produces app-release-unsigned.apk.
    def keystoreEnv = System.getenv('N62_KEYSTORE')
    if (keystoreEnv) {
        def aliasEnv = System.getenv('N62_KEY_ALIAS')
        def storePassEnv = System.getenv('N62_KEYSTORE_PASS')
        def keyPassEnv = System.getenv('N62_KEY_PASS')
        if (aliasEnv) {
            if (!storePassEnv || !keyPassEnv) {
                throw new GradleException('N62_KEY_ALIAS is set: N62_KEYSTORE_PASS and N62_KEY_PASS must be set too')
            }
        } else {
            aliasEnv = 'throwaway'
            storePassEnv = storePassEnv ?: 'pascaline-throwaway'
            keyPassEnv = keyPassEnv ?: storePassEnv
        }
        signingConfigs {
            n62 {
                storeFile file(keystoreEnv)
                storePassword storePassEnv
                keyAlias aliasEnv
                keyPassword keyPassEnv
            }
        }
    }
    buildTypes {
        release {
            if (keystoreEnv) { signingConfig signingConfigs.n62 }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// No Google services plugin: no Play Services, Firebase or push (CLAUDE.md, F-Droid).

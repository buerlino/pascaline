    cases:
      - ['\sqrt9', '3']
      - ['\sqrt{9}', '3']
      - ['\sqrt{x}', 'sqrt(x)']
      - ['\sqrt{x+1}', 'sqrt(x+1)']
      - ['\sqrt{x^2+y^2}', 'sqrt(x^2+y^2)']
      - ['\sqrt{2}', 'sqrt(2)']
      - ['\sqrt[3]{8}', '2']
      - ['\sqrt[3]{x}', 'x^(1/3)']
      - ['\sqrt[n]{x}', 'x^(1/n)']
      - ['\sqrt{\frac{1}{4}}', '1/2']
      - ['\sqrt{x}\sqrt{x}', 'x']
      - ['2\sqrt{3}', '2*sqrt(3)']
      - ['\sqrt{2}+\sqrt{3}', 'sqrt(2)+sqrt(3)']
      - ['\sqrt{\sqrt{x}}', 'x^(1/4)']
      - ['\frac{\sqrt{3}}{2}', 'sqrt(3)/2']
      - ['\frac{-b+\sqrt{b^2-4ac}}{2a}', '(-b+sqrt(b^2-4*a*c))/(2*a)']

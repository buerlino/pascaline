      - ['\log\left(x\right)', 'ln(x)/ln(10)']
      - ['\log_{2}\left(8\right)', '3']
      - ['\log_{2}x', 'ln(x)/ln(2)']
      - ['\log_{10}\left(x\right)', 'ln(x)/ln(10)']
      - ['\log_{b}\left(x\right)', 'ln(x)/ln(b)']
      - ['\exp\left(x\right)', 'exp(x)']

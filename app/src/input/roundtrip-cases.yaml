      - ['\frac{1}{2}at^2', '1/2*a*t^2']
      - ['\left(x\right)\left(y\right)', 'x*y']
      - ['x_1x_2', 'x_1*x_2']
      - ['2x_1', '2*x_1']
      - ['2\alpha', '2*alpha']
      - ['\alpha\beta', 'alpha*beta']

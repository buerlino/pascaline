# SPDX-License-Identifier: GPL-3.0-or-later
# Round-trip cases for the LaTeX -> MathJSON -> Giac serializer (app/src/input/latex-to-giac.ts).
# Each case is [latex, intended Giac expression]. The intended expression is written by hand from the
# mathematics, so its source is `derived`; semantic choices that depend on a calculator's conventions are
# in groups marked `assumed` and listed for the owner in spike/G2-CHECKLIST (via henri).
# Equality is decided by Giac: simplify((got)-(want)) == 0, else numeric at 3 random points.
# Groups with status `gap` are known failures; the runner reports them but does not fail on them.
# LaTeX forms include what MathLive produces from our keyboard (\left(...\right), \frac12, \sqrt9, \times, \div).
groups:
  - name: arithmetic
    status: pass
    source: derived
    cases:
      - ['1+2', '1+2']
      - ['12+3\times4', '12+3*4']
      - ['3\times4\div5', '3*4/5']
      - ['10-4-3', '10-4-3']
      - ['10-\left(4-3\right)', '10-(4-3)']
      - ['2+3\times4', '2+3*4']
      - ['\left(2+3\right)\times4', '(2+3)*4']
      - ['100\div10\div5', '100/10/5']
      - ['100\div\left(10\div5\right)', '100/(10/5)']
      - ['7-3', '7-3']
      - ['-5+3', '-5+3']
      - ['-\left(5+3\right)', '-(5+3)']
      - ['2\times-3', '2*(-3)']
      - ['2-\left(-3\right)', '2-(-3)']
      - ['1+2+3+4+5', '15']
      - ['2\cdot3', '2*3']
      - ['2\times3\times4', '24']
      - ['1-2-3-4', '1-2-3-4']
      - ['8\div2\times4', '8/2*4']
      - ['8\div\left(2\times4\right)', '8/(2*4)']
      - ['a+b-c', 'a+b-c']
      - ['a-b+c', 'a-b+c']
      - ['a-\left(b+c\right)', 'a-(b+c)']
      - ['a\times b\div c', 'a*b/c']
      - ['a\div b\times c', 'a/b*c']
      - ['0', '0']
      - ['007', '7']
  - name: fractions
    status: pass
    source: derived
    cases:
      - ['\frac12', '1/2']
      - ['\frac{1}{2}', '1/2']
      - ['\frac{1}{2}+\frac{1}{3}', '1/2+1/3']
      - ['\frac{x+1}{x-1}', '(x+1)/(x-1)']
      - ['\frac{x}{y}+1', 'x/y+1']
      - ['\frac{1}{x}+\frac{1}{y}', '1/x+1/y']
      - ['\frac{\frac{1}{2}}{3}', '1/2/3']
      - ['\frac{1}{\frac{2}{3}}', '3/2']
      - ['\frac{a}{b}\frac{c}{d}', 'a/b*c/d']
      - ['\frac{x^2-1}{x+1}', '(x^2-1)/(x+1)']
      - ['\frac{-1}{2}', '-1/2']
      - ['\frac{1}{-2}', '1/(-2)']
      - ['\frac{2}{3}x', '2/3*x']
      - ['x\frac{2}{3}', 'x*2/3']
      - ['\frac{\sin x}{\cos x}', 'sin(x)/cos(x)']
      - ['\frac{1}{2}\times\frac{3}{4}', '3/8']
      - ['\frac{12}{4}', '3']
      - ['\frac{a+b}{c+d}', '(a+b)/(c+d)']
      - ['1+\frac{1}{1+\frac{1}{x}}', '1+1/(1+1/x)']
      - ['\frac{x}{2}-\frac{x}{3}', 'x/2-x/3']
      - ['\frac{1}{x^2}', '1/x^2']
      - ['\frac{1}{2x}', '1/(2*x)']
      - ['\frac{x}{yz}', 'x/(y*z)']
      - ['\frac{3}{4}\div\frac{5}{6}', '(3/4)/(5/6)']
      - ['\frac{22}{7}', '22/7']
  - name: powers
    status: pass
    source: derived
    cases:
      - ['x^2', 'x^2']
      - ['x^{2}', 'x^2']
      - ['x^3', 'x^3']
      - ['x^{12}', 'x^12']
      - ['x^{-1}', '1/x']
      - ['x^{-2}', '1/x^2']
      - ['x^{y+1}', 'x^(y+1)']
      - ['x^{\frac{1}{2}}', 'sqrt(x)']
      - ['2^x', '2^x']
      - ['2^{3^{4}}', '2^81']
      - ['\left(2^3\right)^4', '4096']
      - ['\left(x+1\right)^2', '(x+1)^2']
      - ['\left(x+1\right)^{2}-\left(x-1\right)^{2}', '4*x']
      - ['-x^2', '-(x^2)']
      - ['\left(-x\right)^2', 'x^2']
      - ['\left(-2\right)^2', '4']
      - ['-2^2', '-4']
      - ['x^2y', 'x^2*y']
      - ['x^{2}y^{3}', 'x^2*y^3']
      - ['10^{-3}', '1/1000']
      - ['10^{3}', '1000']
      - ['e^x', 'exp(x)']
      - ['\exponentialE^{x}', 'exp(x)']
      - ['\exponentialE^{-x^2}', 'exp(-x^2)']
      - ['\exponentialE^{2x}', 'exp(2*x)']
      - ['x^{y^{z}}', 'x^(y^z)']
      - ['a^{b+c}', 'a^b*a^c']
      - ['\left(x^2\right)^3', 'x^6']
      - ['x^{2}+y^{2}', 'x^2+y^2']
      - ['\pi^2', 'pi^2']
  - name: roots

      - ['\cos\left(\pi\right)', '-1']
      - ['\tan\left(\frac{\pi}{4}\right)', '1']
      - ['\sin\left(\pi x\right)', 'sin(pi*x)']
      - ['\sin\left(x\right)+\cos\left(x\right)', 'sin(x)+cos(x)']
      - ['\frac{\tan x}{x}', 'tan(x)/x']
      - ['\cot\left(x\right)', 'cot(x)']
      - ['\sin\left(\cos\left(x\right)\right)', 'sin(cos(x))']
      - ['\sin\left(x\right)\left(x+1\right)', 'sin(x)*(x+1)']
  - name: log-exp-constants
    status: pass

      - ['x=2', 'x=2']
      - ['x^2=4', 'x^2=4']
      - ['x+1=y', 'x+1=y']
      - ['x^2-4=0', 'x^2-4=0']
      - ['\sin x=\frac12', 'sin(x)=1/2']
      - ['x<3', 'x<3']
      - ['x>3', 'x>3']
      - ['x\le3', 'x<=3']
      - ['x\ge3', 'x>=3']
      - ['x\ne3', 'x!=3']
      - ['2x+3=11', '2*x+3=11']

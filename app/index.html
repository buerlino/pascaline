<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#1f2a44" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Pascaline</title>
    <script>
      // The theme before the first paint (R50b, R50e): the four values come from the localStorage mirror that
      // theme/lookApply.ts writes (IndexedDB stays the source); the family's and the switches' CSS is linked here, as a
      // blocking link, so the first frame is already the stored theme. Nothing stored: Dark in the Android app, System in
      // the browser, High contrast when the phone asks for it. ES5, every read in try/catch.
      (function () {
        var r = document.documentElement, l = {}, files = /*theme-css*/{};
        function mq(q) { return window.matchMedia ? matchMedia(q).matches : false; }
        try { l = JSON.parse(localStorage.getItem("pascaline.look") || "{}") || {}; } catch (e) { l = {}; }
        var cap = window.Capacitor, native = !!(cap && cap.isNativePlatform && cap.isNativePlatform());
        var fam = ["pascaline", "graphite", "solarized", "gruvbox", "nord"].indexOf(l.family) >= 0 ? l.family : "pascaline";
        var br = ["system", "light", "dark"].indexOf(l.brightness) >= 0 ? l.brightness : native ? "dark" : "system";
        var hc = typeof l.contrast === "boolean" ? l.contrast : mq("(prefers-contrast: more)"), plain = l.plain === true;
        r.setAttribute("data-family", fam);
        r.setAttribute("data-brightness", (br === "system" ? mq("(prefers-color-scheme: light)") : br === "light") ? "light" : "dark");
        if (hc) r.setAttribute("data-contrast", "high");
        if (plain) r.setAttribute("data-keys", "plain");
        if (typeof l.bg === "string" && /^#[0-9a-f]{3,8}$/i.test(l.bg)) document.querySelector('meta[name="theme-color"]').setAttribute("content", l.bg);
        var want = [];
        if (fam !== "pascaline" || hc || plain) want.push(fam);
        if (hc || plain) want.push("modes");
        for (var i = 0; i < want.length; i++) {
          if (!files[want[i]]) continue;
          try { document.write('<link rel="stylesheet" href="' + new URL(files[want[i]], document.baseURI).href + '">'); } catch (e) { /* the app applies the theme once it has loaded */ }
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Too-old WebView check (ES5, feature detection only, no UA sniffing). Inline and English on purpose:
      // the i18n table lives in the bundle, which an old WebView cannot even parse.
      // Needs: optional chaining (Chrome 80), WebAssembly legacy exception handling (Chrome 95, used by the Giac engine).
      (function () {
        var ok = true;
        try { new Function("var a = null; return a?.b;"); } catch (e) { ok = false; }
        try {
          // (module (func (try (catch_all)))) : validates only where wasm exception handling exists
          ok = ok && typeof WebAssembly === "object" && WebAssembly.validate(new Uint8Array(
            [0, 97, 115, 109, 1, 0, 0, 0, 1, 4, 1, 96, 0, 0, 3, 2, 1, 0, 10, 8, 1, 6, 0, 6, 64, 25, 11, 11]));
        } catch (e) { ok = false; }
        if (ok) return;
        var app = document.getElementById("app");
        if (app) app.removeAttribute("id");
        var p = document.createElement("p");
        p.style.cssText = "font:16px sans-serif;padding:24px";
        p.appendChild(document.createTextNode("This app needs a newer Android System WebView / Chrome. Update it from your app store."));
        document.body.insertBefore(p, document.body.firstChild);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

# DRAFT F-Droid recipe for fdroiddata (metadata/org.pascaline.app.yml). Never submitted; the application id is a placeholder.
# Modelled on net.alexbarry.alexgames (Debian emscripten in the build VM) and com.graphhopper.maps (Capacitor).
# Status: untested in fdroidserver (see fdroid/README.md). commit: below is a placeholder until a release tag exists.
Categories:
  - Science & Education
License: GPL-3.0-or-later
AuthorName: Pascaline contributors
WebSite: https://github.com/buerlino/pascaline
SourceCode: https://github.com/buerlino/pascaline
IssueTracker: https://github.com/buerlino/pascaline/issues

AutoName: Pascaline

RepoType: git
Repo: https://github.com/buerlino/pascaline.git

Builds:
  - versionName: 0.2.0
    versionCode: 2
    commit: v0.2.0
    subdir: android/app
    sudo:
      - apt-get update
      # Same Debian emscripten as the release container (P2): 3.1.69+dfsg-3 in trixie. Then `emcc` is on PATH (EMSDK_DIR=system).
      - apt-get install -y emscripten make patch gcc g++ m4 perl xz-utils bzip2 curl python3 pkg-config npm
    prebuild:
      - cd ../..
      - export EMSDK_DIR=system
      - engine/giac/build-wasm.sh
      # libqalculate for the Find index (milestone 4; the Units worker is milestone 5). Skip with build.sh's --no-units.
      - engine/qalc/build-wasm.sh dev
      - cd app
      - npm ci
      - npm run index
      - GIAC_OUT=../engine/giac/_out/gsl npm run build
      - npx cap sync android
    gradle:
      - yes
    scandelete:
      - app/node_modules/
      - engine/giac/_downloads/
      - engine/giac/_build/
      - engine/qalc/_downloads/
      - engine/qalc/_work/

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.2.0
CurrentVersionCode: 2

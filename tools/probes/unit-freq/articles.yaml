# S5 (the unit pad's arrangement): the English Wikipedia articles whose units are counted, 40 per field, three fields
# weighted equally (principle 2: one pad, no split by discipline). Chosen as the everyday subjects of each field's
# design work (components, machines, plant, the quantities sized in practice), not physics or history articles.
# fetch.mjs downloads each one once into tools/probes/_out/unit-freq/cache/ (gitignored) and records its revision and
# SHA-256 in sources.lock.yaml; count.mjs counts offline from the cache and checks every SHA-256 first.
# Licence: Wikipedia text is CC BY-SA 4.0. Nothing of it is kept in git; only counts are.

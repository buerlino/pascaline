# The showcase video's clips (owner, 2026-11-06; tests/core/SHOWCASE.md). Each press is one step, so the count is exact:
# a short clip is 6 presses + eval (one block of the song), a long clip 13 + eval (two blocks), the finale 20 + eval.
# setup: before the beat (not timed). Steps as core.yaml's keys, plus {cell: <template id>} (a tap on the Tmpl sheet's
# cell; the Tmpl key is its own step) and {row: <Find row id>} (a tap on a Find row). expect: as core.yaml, plus
# unit: {text, unit} (the unit view's result). Values derived (the working is in the comment).
clips:
  - { id: s1, blocks: [1], title: "stacked fraction (CAS)", setup: ["@cas"],
      presses: [d2, div, d3, right, add, d1], eval: enter, expect: { result: "5/3" } }            # 2/3 + 1
  - { id: A, blocks: [2, 3], title: "Σ template",
      presses: [tmpl, {cell: sum}, alpha, log, right, d1, right, d1, d0, right, alpha, log, sq], eval: enter,
      expect: { result: "385", mark: "=" } }                                                    # 10·11·21/6 (c60)
  - { id: s3, blocks: [4], title: "2^100 exact (CAS)", setup: ["@cas"],
      presses: [d2, pow, d1, d0, d0, right], eval: enter, expect: { result: "1267650600228229401496703205376" } }
  - { id: s4, blocks: [5], title: "2^100 in Home",
      presses: [d2, pow, d1, d0, d0, right], eval: enter, expect: { result: "1.26765060023E30", mark: "≈" } }
  - { id: B, blocks: [6, 7], title: "E notation",
      presses: [d6, dot, d0, d2, d2, emark, d2, d3, mul, d1, dot, d2, d5], eval: enter,
      expect: { result: "7.5275E23", mark: "=" } }                                              # 6.022 × 1.25 = 7.5275
  - { id: C, blocks: [8, 9], title: "a b/c",
      presses: [d0, dot, d3, d7, d5, mul, d0, dot, d0, d6, d2, d5, enter], eval: frac,
      expect: { result: "3/128", mark: "=" } }                                                  # 3/8 × 1/16
  - { id: s5, blocks: [10], title: "√200 = 10√2 (CAS)", setup: ["@cas"],
      presses: [shift, sq, d2, d0, d0, right], eval: enter, expect: { result: "10*sqrt(2)" } }
  - { id: s6, blocks: [11], title: "Euler: e^(iπ)",
      presses: [shift, ln, shift, d2, shift, d3], eval: enter,
      expect: { result: "-1", mark: "=" } }                                                     # e^(iπ) = −1
  - { id: D, blocks: [12, 13], title: "unit check kg·m²/s³ → W",
      presses: [d1, d5, d0, {up: tmpl}, d4, d6, d9, sq, div, d3, pow, enter, paren], eval: enter,
      expect: { unit: { text: "150", unit: "W" } } }
  - { id: s8, blocks: [14], title: "5 kg in lb",
      presses: [d5, {up: tmpl}, d4, d6, enter, {up: d6}], eval: {up: enter},
      expect: { unit: { text: "11.0231131092", unit: "lb" } } }                                 # 5 / 0.45359237
  - { id: s9, blocks: [15], title: "50 ± 1 m",
      presses: [d5, d0, {up: comma}, d1, {up: tmpl}, d9], eval: {up: enter},
      expect: { unit: { text: "50", unit: "m", has: "± 1" } } }
  - { id: E, blocks: [16, 17], title: "72.25 kg × g₀",
      presses: [d7, d2, dot, d2, d5, {up: tmpl}, d4, d6, math, {row: "ucat:const"}, {row: "uconst:Physics"}, {row: "const:g_0"}, enter],
      eval: enter, expect: { unit: { text: "708.5304625", unit: "N" } } }                       # 72.25 × 9.80665
  - { id: s7, blocks: [18], title: "d/dx x² (CAS)", setup: ["@cas"],
      presses: [tmpl, {cell: deriv}, x, sq, right, x], eval: enter, expect: { result: "2*x" } }
  - { id: F, blocks: [19, 20], title: "solve from Find (CAS)", setup: ["@cas"],
      presses: [math, {down: d9}, comma, sq, {down: d5}, frac, enter, x, sq, shift, dot, d1, d6], eval: enter,
      expect: { result: "{-4,4}" } }
  - { id: H, blocks: [21, 22], title: "p(x):=x³",
      presses: [shift, alpha, emark, paren, x, right, alpha, sub, shift, dot, x, pow, d3], eval: enter,
      expect: {} }
  - { id: I, blocks: [23, 24], title: "Solve app: x² − 2x = 168", setup: ["@place", d4, "@symb"],
      presses: [x, sq, sub, d2, x, shift, dot, d1, d6, d8, enter, "@num", "@menu"], eval: d2,
      expect: { text: { '[data-testid="solve-roots"] li': ["x = -12", "x = 14"] } } }          # 14² − 28 = (−12)² + 24 = 168
  - { id: s10, blocks: [25], title: "F1 = x³ − 2", setup: ["@symb"],
      presses: [x, pow, d3, right, sub, d2], eval: enter, expect: {} }
  - { id: s11, blocks: [26], title: "Plot, Root", after: s10,
      presses: ["@plot", right, right, right, right, "@menu"], eval: d1,
      expect: { text: { '[data-testid="readout-x"]': "1.25992104989" } } }                     # 2^(1/3) = 1.2599210498948…
  - { id: J, blocks: [27, 28], title: "signed area of x² from 0 to 1", setup: ["@symb", x, sq, enter],
      presses: ["@plot", "@menu", d5, right, right, right, right, right, right, right, right, right, right], eval: enter,
      expect: { text: { '[data-testid="readout-Signed area"]': "0.333333333333" } } }          # c47
  - { id: finale, blocks: [finale], title: "3x + 2y = 8, x − 4y = −2 as A⁻¹·b",
      presses: [tmpl, {cell: matrix22}, d3, right, d2, right, d1, right, neg, d4, right, shift, div, mul, tmpl, {cell: colvec}, d8, right, neg, d2],
      eval: enter, expect: { result: "[[2],[1]]", mark: "=" } }                                 # det −14; x = 2, y = 1

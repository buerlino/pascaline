# Solve, one equation in one unknown (docs/02 section 4): eq + var + guess -> root, 12 digits.
# Our rule: the real root NEAREST THE GUESS among those found in the first round of the bracket search
# that has one, else the Newton result; "no root found" when there is none. Which root the reference
# calculator returns is G2 items 12-14 (linked with `g2:`).
#   oracle  : tests/golden/oracle.py (mpmath, 30 digits, checked at 60)
#   derived : exact root by hand
cases:
  - { id: "lambert-xexp", eq: "x*exp(x)=5", var: "x", guess: "1", oracle: "lambertw(5)", expect: "1.32672466524", source: "oracle" }
  - { id: "cube-root-2", eq: "x^3=2", var: "x", guess: "1", oracle: "cbrt(2)", expect: "1.25992104989", source: "oracle" }
  - { id: "dottie", eq: "cos(x)=x", var: "x", guess: "0", oracle: "findroot(lambda t: mp.cos(t)-t, 0.7)", expect: "0.739085133215", source: "oracle" }
  - { id: "sqrt2-pos", eq: "x^2=2", var: "x", guess: "1", oracle: "sqrt(2)", expect: "1.41421356237", source: "oracle" }
  - { id: "sqrt2-neg", eq: "x^2=2", var: "x", guess: "-1", oracle: "-sqrt(2)", expect: "-1.41421356237", source: "oracle" }
  - { id: "ln-e", eq: "ln(x)=1", var: "x", guess: "1", oracle: "e", expect: "2.71828182846", source: "oracle", note: "left of 0 ln is complex: skipped by the search" }
  - { id: "sqrt-9", eq: "sqrt(x)=3", var: "x", guess: "1", oracle: "F(9)", expect: "9", source: "derived" }
  - { id: "quintic", eq: "x^5-x-1=0", var: "x", guess: "1", oracle: "findroot(lambda t: t**5-t-1, 1.2)", expect: "1.16730397826", source: "oracle" }
  - { id: "cubic-nearest", eq: "x^3-3*x+1=0", var: "x", guess: "0", oracle: "findroot(lambda t: t**3-3*t+1, 0.35)", expect: "0.347296355334", source: "oracle", g2: 12, note: "roots -1.88, 0.347, 1.53" }
  - { id: "kepler", eq: "E-0.5*sin(E)=1", var: "E", guess: "1", oracle: "findroot(lambda t: t-mpf('0.5')*mp.sin(t)-1, 1.5)", expect: "1.49870113352", source: "oracle" }
  - { id: "lambert-small", eq: "x*exp(-x)=0.1", var: "x", guess: "0", oracle: "-lambertw(mpf('-0.1'))", expect: "0.111832559159", source: "oracle", note: "other root 3.58" }
  - { id: "exp-big", eq: "exp(x)=1e100", var: "x", guess: "1", oracle: "100*ln(10)", expect: "230.258509299", source: "oracle" }
  - { id: "scale-small", eq: "1e6*x=1", var: "x", guess: "1", oracle: "F(1,10**6)", expect: "1E-6", source: "derived" }
  - { id: "tan-pole", eq: "tan(x)=0", var: "x", guess: "1.4", oracle: "F(0)", expect: "0", source: "derived", g2: 12, note: "sign change at the pole pi/2 must be rejected; nearest root is 0 (pi is 1.74 away)" }
  - { id: "double-root-0", eq: "x^2=0", var: "x", guess: "1", oracle: "F(0)", expect: "0", source: "derived", note: "no sign change: Newton" }
  - { id: "double-root-1", eq: "(x-1)^2=0", var: "x", guess: "3", oracle: "F(1)", expect: "1", source: "derived" }
  - { id: "triple-root-2", eq: "(x-2)^3=0", var: "x", guess: "0", oracle: "F(2)", expect: "2", source: "derived" }
  - { id: "triple-root-0", eq: "x^3=0", var: "x", guess: "1", oracle: "F(0)", expect: "0", source: "derived" }
  - { id: "tiny-root", eq: "x^2=1e-20", var: "x", guess: "1", oracle: "F(1,10**10)", expect: "1E-10", source: "derived", note: "no sign change seen from the guess: Newton" }
  - { id: "cos-touch", eq: "cos(x)=1", var: "x", guess: "1", oracle: "F(0)", expect: "0", source: "derived", note: "double root, no sign change" }
  - { id: "no-real-root", eq: "x^2+1=0", var: "x", guess: "0", expect: "no root found", source: "derived", g2: 13 }
  - { id: "exp-no-root", eq: "exp(x)=0", var: "x", guess: "0", expect: "no root found", source: "derived" }
  - { id: "pole-no-root", eq: "1/x=0", var: "x", guess: "1", expect: "no root found", source: "derived", g2: 14, note: "the only sign change is the pole at 0" }
  - { id: "double-root-0-scaled", eq: "3*x^2=0", var: "x", guess: "1", oracle: "F(0)", expect: "0", source: "derived", note: "regression 2026-10-11: multiple root at 0, the relative polish step never shrinks; accepted because the CAS proves x=0 (also the extremum of x^3)" }
# Systems: N equations in N unknowns from guesses (kind: system); expect has one value per unknown. The
# oracle is mpmath findroot started at the guess; Solve reports the root it converges to.
  - { id: "sys-circle-exp-left", kind: "system", eq: ["X^2+Y^2=4", "Y=exp(X)"], var: ["X", "Y"], guess: ["-1", "1"], oracle: "findroot([lambda x, y: x**2+y**2-4, lambda x, y: y-mp.exp(x)], (-1, 1))", expect: ["-1.99537317006", "0.135962907412"], source: "oracle", note: "GSL hybrids alone returns the guess unchanged here; hybridsj converges" }
  - { id: "sys-circle-exp-right", kind: "system", eq: ["X^2+Y^2=4", "Y=exp(X)"], var: ["X", "Y"], guess: ["1", "1"], oracle: "findroot([lambda x, y: x**2+y**2-4, lambda x, y: y-mp.exp(x)], (1, 1))", expect: ["0.639263074808", "1.89508382959"], source: "oracle" }
  - { id: "sys-linear", kind: "system", eq: ["X+Y=3", "X-Y=1"], var: ["X", "Y"], guess: ["0", "0"], oracle: "[F(2), F(1)]", expect: ["2", "1"], source: "derived" }
  - { id: "sys-circle-line", kind: "system", eq: ["X^2+Y^2=1", "Y=X"], var: ["X", "Y"], guess: ["1", "1"], oracle: "[sqrt(F(1,2)), sqrt(F(1,2))]", expect: ["0.707106781187", "0.707106781187"], source: "derived" }
  - { id: "sys-3x3-symmetric", kind: "system", eq: ["X+Y+Z=6", "X*Y*Z=6", "X^2+Y^2+Z^2=14"], var: ["X", "Y", "Z"], guess: ["0.8", "2.2", "3.1"], oracle: "[F(1), F(2), F(3)]", expect: ["1", "2", "3"], source: "derived", note: "the roots are the permutations of 1, 2, 3; the guess is nearest (1, 2, 3)" }
  - { id: "sys-trig", kind: "system", eq: ["sin(X)+Y=1", "X-Y^2=0"], var: ["X", "Y"], guess: ["0.5", "0.5"], oracle: "findroot([lambda x, y: mp.sin(x)+y-1, lambda x, y: x-y**2], (0.5, 0.5))", expect: ["0.387286068206", "0.622323122024"], source: "oracle" }
  - { id: "sys-decimal-coeffs", kind: "system", eq: ["0.1*X+0.2*Y=0.3", "X*Y=1"], var: ["X", "Y"], guess: ["0.5", "2"], oracle: "[F(1), F(1)]", expect: ["1", "1"], source: "derived", note: "decimal literals made exact; (1, 1) is a double root of the system, so Newton converges linearly" }
  - { id: "sys-no-solution", kind: "system", eq: ["X^2+Y^2=-1", "Y=X"], var: ["X", "Y"], guess: ["1", "1"], expect: "no root found", source: "derived", g2: 20, note: "no real solution; the reference shows the dialog \"Cannot find solution\" (G2 item 20, 2.4.2.15751, 2026-10-12); our wording differs" }
# Polynomials: every root, complex included (kind: poly). Our order: reals ascending, then complex by
# real part, then imaginary part (oracle sortroots).
  - { id: "poly-cube-minus-one", kind: "poly", eq: "X^3+1=0", var: "X", oracle: "sortroots(mp.polyroots([1, 0, 0, 1], extraprec=50))", expect: ["-1", "0.5-0.866025403784*i", "0.5+0.866025403784*i"], source: "oracle" }
  - { id: "poly-quartic-complex", kind: "poly", eq: "X^4+X+1=0", var: "X", oracle: "sortroots(mp.polyroots([1, 0, 0, 1, 1], extraprec=50))", expect: ["-0.727136084491-0.43001428833*i", "-0.727136084491+0.43001428833*i", "0.727136084491-0.934099289461*i", "0.727136084491+0.934099289461*i"], source: "oracle", g2: 21, note: "order confirmed by the reference's proot (G2 item 21, 2026-10-12); proot answers in double precision here; the 30-digit Newton polish makes 12 digits safe" }
  - { id: "poly-quintic", kind: "poly", eq: "X^5-X-1=0", var: "X", oracle: "sortroots(mp.polyroots([1, 0, 0, 0, -1, -1], extraprec=50))", expect: ["1.16730397826", "-0.764884433601-0.352471546032*i", "-0.764884433601+0.352471546032*i", "0.18123244447-1.08395410132*i", "0.18123244447+1.08395410132*i"], source: "oracle" }
  - { id: "poly-sqrt2", kind: "poly", eq: "X^2=2", var: "X", oracle: "[-sqrt(2), sqrt(2)]", expect: ["-1.41421356237", "1.41421356237"], source: "oracle" }
  - { id: "poly-i", kind: "poly", eq: "X^2+1=0", var: "X", oracle: "[-I, I]", expect: ["-i", "i"], source: "derived" }
  - { id: "poly-triple", kind: "poly", eq: "(X-1)^3=0", var: "X", oracle: "[F(1), F(1), F(1)]", expect: ["1", "1", "1"], source: "derived" }
  - { id: "poly-complex-coeffs", kind: "poly", eq: "X^2-2*i*X-1=0", var: "X", oracle: "[I, I]", expect: ["i", "i"], source: "derived", note: "(X-i)^2" }
  - { id: "poly-unity-6", kind: "poly", eq: "X^6=1", var: "X", oracle: "sortroots([mp.expjpi(mpf(2*k)/6) for k in range(6)])", expect: ["-1", "1", "-0.5-0.866025403784*i", "-0.5+0.866025403784*i", "0.5-0.866025403784*i", "0.5+0.866025403784*i"], source: "oracle" }
  - { id: "poly-decimal", kind: "poly", eq: "0.5*X^2-1.5*X+1=0", var: "X", oracle: "[F(1), F(2)]", expect: ["1", "2"], source: "derived" }
  - { id: "poly-not", kind: "poly", eq: "sin(X)=0", var: "X", expect: "not a polynomial", source: "derived" }
# 30 digits (M4-8, G3): one equation through the Solve app's engine path (kind: one), systems and polynomials. Every
# root is polished at W and again at W+20 (W = max(30, digits+10)); the digits on which the two agree are shown, ⚠ n
# when fewer than asked (status "warn"; the gate then compares expect rounded to the n digits shown).
  - { id: "s30-sqrt2", kind: "one", eq: "x^2=2", var: "x", guess: "1", settings: { digits: 30 }, oracle: "sqrt(2)", expect: "1.41421356237309504880168872421", source: "oracle" }
  - { id: "s30-dottie", kind: "one", eq: "cos(x)=x", var: "x", guess: "0", settings: { digits: 30 }, oracle: "findroot(lambda t: mp.cos(t)-t, 0.7)", expect: "0.739085133215160641655312087674", source: "oracle" }
  - { id: "s30-lambert", kind: "one", eq: "x*exp(x)=5", var: "x", guess: "1", settings: { digits: 30 }, oracle: "lambertw(5)", expect: "1.32672466524220022363509929776", source: "oracle" }
  - { id: "s30-kepler", kind: "one", eq: "E-0.5*sin(E)=1", var: "E", guess: "1", settings: { digits: 30 }, oracle: "findroot(lambda t: t-mpf('0.5')*mp.sin(t)-1, 1.5)", expect: "1.49870113351784831405798549726", source: "oracle" }
  - { id: "s30-wilk7", kind: "one", eq: "expand(product(x-k/7,k,1,25))=0", var: "x", guess: "3.4", settings: { digits: 30 }, oracle: "F(24,7)", expect: "3.42857142857142857142857142857", source: "derived", status: "warn", note: "the expanded product loses about 15 digits to cancellation, so the root polished at W=40 is right to about 25 digits only. Before G3 it showed 3.42857142857142857142857139464 without ⚠" }
  - { id: "s30-cube-offset", kind: "one", eq: "expand((x-2/3)^3)=1e-30", var: "x", guess: "0.7", settings: { digits: 30 }, oracle: "F(2,3)+F(1,10**10)", expect: "0.666666666766666666666666666667", source: "derived", status: "warn", note: "near a triple root: at W=40 the root is right to about 21 digits. Before G3 it showed 0.666666666766666666666140257671 without ⚠" }
  - { id: "s30-sys-circle-exp", kind: "system", eq: ["X^2+Y^2=4", "Y=exp(X)"], var: ["X", "Y"], guess: ["1", "1"], settings: { digits: 30 }, oracle: "findroot([lambda x, y: x**2+y**2-4, lambda x, y: y-mp.exp(x)], (1, 1))", expect: ["0.639263074808418896003896803303", "1.89508382959342614571907402552"], source: "oracle" }
  - { id: "s30-poly-wallis", kind: "poly", eq: "X^3-2*X-5=0", var: "X", settings: { digits: 30 }, oracle: "sortroots(mp.polyroots([1, 0, -2, -5], extraprec=50))", expect: ["2.09455148154232659148238654058", "-1.04727574077116329574119327029-1.13593988908892818624549262903*i", "-1.04727574077116329574119327029+1.13593988908892818624549262903*i"], source: "oracle", note: "Wallis's cubic" }

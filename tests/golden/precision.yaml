  - { id: "g67-cas-complexmode-relaunch-sqrt", kind: "cas", input: "sqrt(x^2)", before: ["complex_mode:=1"], relaunch: true, expect: "abs(x)", source: "derived", note: "guard: the log held complex_mode:=('complex_mode'), which set nothing when replayed" }
  # --- G65 (backlog F58, bug hunt N10): the names a line set come from Giac's state, so a relaunch replays no line as typed ---
  - { id: "g65-f58-cas-chain-purge-relaunch", kind: "cas", input: "x+y", before: ["x:=y:=3", "purge(x)", "purge(y)"], relaunch: true, expect: "x+y", source: "derived", note: "x:=y:=3 was logged as the line itself (kind other), which purge(x) and purge(y) did not remove: the relaunch replayed it and x+y showed 6" }
  # --- G90 (backlog F65, F67): a value from Giac's numeric integration is ⚠ without a count at every digits setting ---
  - { id: "g90-int-tanh-sqrt-30", input: "int(tanh(sqrt(x)),x,-1,0.5)", settings: { digits: 30 }, mark: "⚠", source: "derived", note: "mark-only: Giac's numeric integration is a double at any Digits (intg.cc tegral), so P and P+20 agree by construction; was 0.215044234948… with 30 digits under ≈, wrong from the 14th and without the imaginary part 0.85617660273i" }
  - { id: "g90-cas-evalf-int-asin-12x-30", kind: "cas", input: "evalf(int(asin(x)*12^x,x,0,1))", settings: { digits: 30 }, mark: "⚠", source: "derived", note: "mark-only: was ⚠13 on 3.651236791877, Giac's evalf of its rewrite (7 digits right; mpmath 3.65123638112457186); the numeric integration of the typed integrand is a double, so no count" }
  - { id: "g90-cas-evalf-int-asin-12x", kind: "cas", input: "evalf(int(asin(x)*12^x,x,0,1))", oracle: "quad(lambda x: asin(x)*12**x, [0, 1])", expect: "3.65123638112", mark: "⚠", source: "oracle", note: "was ⚠ 3.65123679188, Giac's evalf of its rewrite 6*pi/ln(12)+integrate(…), 7 digits right; now Giac's numeric integration of the typed integrand (float bounds), a double: ⚠ without a count" }
  - { id: "g90-int-tanh-sqrt-no-assume", kind: "cas", input: "solve(x^2=4,x)", beforeHome: ["int(tanh(sqrt(x)),x,0,1)"], expect: "list[-2,2]", source: "derived", note: "F64 reproducer: was list[2], Home read Giac's leftover integrate(…sqrt(x)…) through exactFacts, whose simplify left assume(x>0) (G92). Since G90 Home no longer evaluates that leftover; Giac's simplify bug stays (next case)" }
  - { id: "g92-cas-simplify-int-tanh-sqrt-assume", input: "solve(x^2=4,x)", beforeCas: ["simplify(integrate(tanh(sqrt(x)),x))"], expect: "[-2,2]", source: "derived", status: "pending", note: "known: F64 (G92). Giac's simplify keeps assume(x>0) when its work throws (subst.cc:2419, 2802); shows [2]. Pending until G92 puts the assumption back" }
  # --- G97 (backlog F69): CAS refuses a power of a non-square matrix too (Giac answers elementwise, gen.cc:6880-6886) ---
  - { id: "prec-g97-colvec-inv-pow-cas", kind: "cas", input: "[[5],[1]]^-1", expect: "error: notSquare", source: "derived", note: "F69: Home showed = [[0.2],[1]], the elementwise 1/x; refused as in Home" }
  - { id: "prec-g97-colvec-inv-cas", kind: "cas", input: "inv([[5],[1]])", expect: "error: notSquare", source: "derived", note: "F69: Giac's inv of a list is elementwise (usual.cc:357, gen.cc:7708); it showed = [[0.2],[1]]; refused as in Home" }
  - { id: "prec-g97-2x3-inv-pow-cas", kind: "cas", input: "[[1,2,3],[4,5,6]]^-1", expect: "error: notSquare", source: "derived", note: "F69: Giac gave [[1,1/2,1/3],[1/4,1/5,1/6]], elementwise; refused as in Home" }
  - { id: "prec-g97-colvec-pow-2-cas", kind: "cas", input: "[[5],[1]]^-2", expect: "error: notSquare", source: "derived", note: "F69: Giac gave 1/26, the inverse of v.v; refused as in Home" }
  - { id: "prec-g97-2x3-pow-2-cas", kind: "cas", input: "[[1,2,3],[4,5,6]]^2", expect: "error: notSquare", source: "derived", note: "F69: Giac gave 91, the sum of the squares (gen.cc:6884); refused as in Home" }
  - { id: "prec-g97-colvec-pow-half-cas", kind: "cas", input: "[[5],[1]]^(1/2)", expect: "error: notSquare", source: "derived", note: "F69: a non-integer power; Giac gave [[sqrt(5)],[1]], elementwise; refused as in Home" }
  - { id: "prec-g97-colvec-pow-2pos-cas", kind: "cas", input: "[[5],[1]]^2", expect: "error: notSquare", source: "derived", note: "F69: Giac gave 26, v.v; refused as in Home" }
  - { id: "prec-g97-2x3-pow-3-cas", kind: "cas", input: "[[1,2,3],[4,5,6]]^3", expect: "error: notSquare", source: "derived", note: "F69: Giac gave [[1,8,27],[64,125,216]], elementwise; refused as in Home" }
  - { id: "prec-g97-colvec-pow-0-cas", kind: "cas", input: "[[5],[1]]^0", expect: "error: notSquare", source: "derived", note: "F69: Giac gave 1; refused as in Home" }
  - { id: "prec-g97-rowvec-pow-2-cas", kind: "cas", input: "[[1,2]]^2", expect: "error: notSquare", source: "derived", note: "F69: a 1x2 matrix; Giac gave 5; refused as in Home" }
  - { id: "prec-g97-keep-2x2-inv-cas", kind: "cas", input: "[[1,2],[3,4]]^-1", expect: "[[-2,1],[3/2,-1/2]]", source: "derived", note: "guard: [[d,-b],[-c,a]]/(ad-bc), ad-bc = -2" }
  - { id: "prec-g97-keep-2x2-singular-cas", kind: "cas", input: "[[1,2],[2,4]]^-1", expect: "error: engine", source: "derived", note: "guard: det = 1*4-2*2 = 0, Giac refuses it (Not invertible, as g97-keep-2x2-singular in Home), not a non-square refusal" }
  - { id: "prec-g97-keep-2x2-pow-2-cas", kind: "cas", input: "[[1,2],[3,4]]^2", expect: "[[7,10],[15,22]]", source: "derived", note: "guard: [[1*1+2*3, 1*2+2*4],[3*1+4*3, 3*2+4*4]]" }
  - { id: "prec-g97-keep-flat-cas", kind: "cas", input: "[5,1]^-1", expect: "[1/5,1]", source: "derived", note: "guard: a flat vector keeps Giac's elementwise meaning" }
  - { id: "prec-g97-keep-colvec-pow-1-cas", kind: "cas", input: "[[5],[1]]^1", expect: "[[5],[1]]", source: "derived", note: "guard: the first power is the matrix" }
  - { id: "prec-g97-keep-flat-pow-2-cas", kind: "cas", input: "[1,2]^2", expect: "5", source: "derived", note: "guard: a flat vector keeps Giac's v.v = 1*1+2*2 = 5" }
  - { id: "prec-g97-colvec-div-cas", kind: "cas", input: "3/[[5],[1]]", expect: "error: notSquare", source: "derived", note: "F69: a/M is a*inv(M), elementwise for a 2x1 M; refused as in Home" }
  - { id: "prec-g106-list-plus-1-cas", kind: "cas", input: "[1,4]+1", expect: "error: listPlusNumber", source: "derived", note: "F78: Giac showed poly1[1,5], the list read as polynomial coefficients; the input asked for no polynomial: refused as in Home" }
  - { id: "prec-g106-list-times-plus-cas", kind: "cas", input: "[1,4]*2+1", expect: "error: listPlusNumber", source: "derived", note: "F78: Giac showed poly1[2,9], the list read as polynomial coefficients; the input asked for no polynomial: refused as in Home" }
  - { id: "prec-g106-stored-list-plus-cas", kind: "cas", input: "L+1", beforeHome: ["L:=[1,2]"], expect: "error: listPlusNumber", source: "derived", note: "F78: Giac showed poly1[1,3], the list read as polynomial coefficients; the input asked for no polynomial: refused as in Home; a stored list too" }
  - { id: "prec-g106-keep-symb2poly-cas", kind: "cas", input: "symb2poly(x^2+1)", expect: "poly1[1,0,1]", source: "derived", note: "guard: a polynomial asked for; x^2+0x+1 has the coefficients 1, 0, 1" }
  - { id: "prec-g106f1-nested-list-plus-cas", kind: "cas", input: "[[[1,4]+1]]", expect: "error: listPlusNumber", source: "derived", note: "F78, G106f1: Giac showed [[poly1[1,5]]], the inner list read as polynomial coefficients two levels deep; the input asked for no polynomial: refused as in Home" }
  - { id: "prec-g106f1-stored-nested-cas", kind: "cas", input: "[[L+1]]", beforeHome: ["L:=[1,4]"], expect: "error: listPlusNumber", source: "derived", note: "F78, G106f1: Giac showed [[poly1[1,5]]] for a stored list plus a number two levels deep; refused as in Home" }

  - { id: "g166-atan-tan-pi/2-minus-1e-15-12", latex: "\\arctan\\left(\\tan\\left(\\frac{\\pi}{2}-10^{-15}\\right)\\right)", oracle: "D200(lambda: mp.pi/2-mpf(10)**-15)", expect: "1.57079632679", mark: "≈", source: "oracle", note: "F174: atan(tan(x)) = x on (-pi/2, pi/2); showed ≈ -1.57079632679: a/pi+1/2 = 1-10^-15/pi is 1 in the double, so n = 1" }

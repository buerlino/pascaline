# SPDX-License-Identifier: GPL-3.0-or-later
# Honest precision (milestone 4, G1): the regression cases of docs/04 section 2.3 (#2–#7, #9) and the 20- and
# 30-digit cases that make the digits setting trustworthy. Written BEFORE the fix (CLAUDE.md): a case that fails
# today is `status: "pending"`; the package that fixes it removes the status in the same commit.
#   id          prec-<section 2.3 item>-<what> for the regression list, prec-<digits>-<what> for the digit cases
#   kind        absent = Home (exact-first), "cas" = the CAS view (host.cas, `text`)
#   settings    { digits: N } significant digits (default 12); angle as in home.yaml; `shown: N` the digits the result is
#               shown with when the input asks for them (CAS `evalf(x,n)`, decisions M4-6); the oracle rounds to it
#   latex       instead of `input`: what the keys type, through our parser first (with `before`), R18f1
#   before      inputs evaluated first, in the same view and engine (a stored variable, decisions M4-7)
#   expect      the text shown, in STD at `digits`; for source: oracle, written by tests/golden/oracle.py
#               (`oracle.py --write precision.yaml`, evaluated at digits+20 and digits+50 and required to agree)
#   mark        the mark that must precede the result (docs/04 section 2.4): "=", "≈" or "⚠". "=" and "≈" are derived
#               by oracle.py (exactly equal to the shown text, or rounded); "⚠" is written by hand and needs a note.
#   (no expect) a mark-only case: the case checks the mark, and that the answer is still a number (not the input
#               echoed back). It exists where the true digits are out of reach for Giac's own routine, so the correct
#               behaviour is the ⚠ and not a value.
#   budgetMs    G58: the case answers or is refused within this many ms (desktop wall time of its Enter, checked by
#               the gate). With no expect and no mark it is a time-only case: an answer or a refusal, in time
#   status      "pending" = known to fail until its fix. The gate (stage precision) runs it anyway and lists it as
#               still pending or now passing; it never fails the gate. Remove the status when the case passes.
# `mark:` is checked by the gate (markOf() in app/src/engine/format.ts, STD at `digits`). A result shown with ⚠ n must equal
# `expect` rounded to its n confirmed digits.
# #7 (Python `calc.eval`) went away with the Python app (P11); #1 (the parser) and #8 (the result chip) are ron's, in R2.
cases:
  # --- 20 and 30 digits: the displayed digits are the oracle's (these hold today; they guard the setting) ----------
  - { id: "prec-20-sqrt2", input: "sqrt(2)", settings: { digits: 20 }, oracle: "sqrt(2)", expect: "1.4142135623730950488", mark: "≈", source: "oracle" }
  - { id: "prec-20-third", input: "1/3", settings: { digits: 20 }, oracle: "F(1,3)", expect: "0.33333333333333333333", mark: "≈", source: "oracle" }
  - { id: "prec-20-22/7", input: "22/7", settings: { digits: 20 }, oracle: "F(22,7)", expect: "3.1428571428571428571", mark: "≈", source: "oracle" }
  - { id: "prec-30-sqrt2", input: "sqrt(2)", settings: { digits: 30 }, oracle: "sqrt(2)", expect: "1.41421356237309504880168872421", mark: "≈", source: "oracle" }
  - { id: "prec-30-pi", input: "pi", settings: { digits: 30 }, oracle: "pi", expect: "3.14159265358979323846264338328", mark: "≈", source: "oracle" }
  - { id: "prec-30-e", input: "exp(1)", settings: { digits: 30 }, oracle: "e", expect: "2.71828182845904523536028747135", mark: "≈", source: "oracle" }
  - { id: "prec-30-ln2", input: "ln(2)", settings: { digits: 30 }, oracle: "ln(2)", expect: "0.693147180559945309417232121458", mark: "≈", source: "oracle" }
  - { id: "prec-30-sin1", input: "sin(1)", settings: { digits: 30 }, oracle: "sin(1)", expect: "0.84147098480789650665250232163", mark: "≈", source: "oracle" }
  - { id: "prec-30-third", input: "1/3", settings: { digits: 30 }, oracle: "F(1,3)", expect: "0.333333333333333333333333333333", mark: "≈", source: "oracle" }
  - { id: "prec-30-quarter", input: "1/4", settings: { digits: 30 }, oracle: "F(1,4)", expect: "0.25", mark: "=", source: "derived" }
  - { id: "prec-30-0.1+0.2", input: "0.1+0.2", settings: { digits: 30 }, oracle: "F('0.1')+F('0.2')", expect: "0.3", mark: "=", source: "derived" }
  - { id: "prec-30-2^100", input: "2^100", settings: { digits: 30 }, oracle: "F(2**100)", expect: "1.26765060022822940149670320538E30", mark: "≈", source: "oracle", note: "a 31-digit integer: 30 digits round it, so it is not exact" }
  - { id: "prec-30-2^64", input: "2^64", settings: { digits: 30 }, oracle: "F(2**64)", expect: "18446744073709551616", mark: "=", source: "derived", note: "20 digits fit in 30: shown whole" }
  - { id: "prec-30-gamma0.5", input: "Gamma(0.5)", settings: { digits: 30 }, oracle: "gamma(F('0.5'))", expect: "1.77245385090551602729816748334", mark: "≈", source: "oracle" }
  - { id: "prec-30-sin1e22", input: "sin(1e22)", settings: { digits: 30 }, oracle: "sin(10**22)", expect: "-0.852200849767188801772705893753", mark: "≈", source: "oracle", note: "argument reduction" }
  - { id: "prec-30-e^pi-pi", input: "exp(pi)-pi", settings: { digits: 30 }, oracle: "exp(pi)-pi", expect: "19.9990999791894757672664429847", mark: "≈", source: "oracle", note: "cancellation" }
  - { id: "prec-30-355/113-pi", input: "355/113-pi", settings: { digits: 30 }, oracle: "-(pi-F(355,113))", expect: "2.66764189062422312368932886496E-7", mark: "≈", source: "oracle", note: "cancellation" }
  # --- 2.3 #2: inverse functions: Giac's value is wrong from the 8th digit and its two evaluations nearly agree ------
  - { id: "prec-2-normald_icdf-value", input: "normald_icdf(10^-10)", oracle: "findroot(lambda x: erfc(-x/sqrt(2))/2 - M(F(1,10**10)), -6.36)", expect: "-6.3613409024", mark: "≈", source: "oracle", note: "Home showed ⚠ 7 -6.36134 (Giac's double, wrong from the 8th digit; its two evaluations agree on the wrong digits). G44: Newton on erfc from Giac's value, checked at P and P+20 (docs/04 2.3 #2)" }

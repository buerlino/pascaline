# SPDX-License-Identifier: GPL-3.0-or-later
# The unit view (P15, docs/04 4.2-4.3; G16): the formula with its unit slots, evaluated on Giac with the Find index's
# exact factors (app/src/units). Run by the golden gate (stage "units", app/scripts/golden.ts) and checked by oracle.py.
#
# `input`: Giac text with each unit slot in braces and each constant as {=id}; `to`: the end slot (app/scripts/
# unit-case.ts has the syntax: "k:m" is km, " / " the ÷, "Hz^-1/2" a power). Without `to` the value is in SI base
# units. `expect` is the value shown at 12 digits (STD), `mark` its mark, `exact` Giac's exact text of it, `dim` the
# dimension key of the result as the index writes it ("" for a pure number; a result 0 keeps the dimension of its terms,
# G35); with an end slot, `si` is the exact text of the value in SI base units, checked against `si_oracle`. A
# refused case has `message` (the text the user reads) instead.
# `settings: { angle: deg }`: a bare number in sin, cos and tan follows the Home angle mode (G15 default, decisions.md).
# G17: °C, °F and the logarithmic units (dB, bel, Np, dBm, dBW) are allowed only alone and convert by their offset or level
# rule. G18: an uncertain value is `pasupm(value,sigma)` in the input (R28's parser writes it; sigma in the same unit, every
# one independent); σ = sqrt(Σ (∂f/∂xᵢ·σᵢ)²), first order, exact in Giac. `unc` is σ at 2 significant digits (docs/04 2.6;
# "none": the result carries no σ), `unc_oracle` σ by the oracle, `shown` the value rounded to σ's last digit with it. A
# result with a σ is always ≈.
# G25: `unit` is the unit the value is shown in ("" for a pure number), `dimtext` the dimension as text. Without an end slot the
# units typed are kept when they fit the result's dimension (one unit, a product with factor 1 like N·m, or the only slot),
# else SI with an SI prefix (µs, kJ, m/s); an end slot always wins. `rev` is a count of cycles (a pure number): rpm = 1/60 Hz.

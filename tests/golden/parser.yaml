# LaTeX -> Giac round trip for our parser (P1, app/src/input/latex-to-giac.ts). `latex` is what our
# keyboard + MathLive produce; `expect` is the intended Giac expression, written by hand from the
# mathematics (derived). Equality is decided by Giac: identical, same value, simplify(a-b)=0, else
# numeric at 3 points. `status: gap` cases are known failures: reported, never failing the run, and
# a gap that starts passing is reported too. Rule: each keyboard template has a case here.

  # P5 (b), R39: with realOddRoots (Solve and Function; not Home or CAS, R66) a power with a literal exponent p/q, q odd, is the real root
  - { id: "roots-17", latex: "\\left(-8\\right)^{\\frac{1}{3}}", options: { realOddRoots: true }, expect: "-2", source: "virtual-calc", g2: 11, group: "roots", note: "the option as Solve and Function set it; the G2 gives -2 (items 4 and 11), Home keeps the principal root (R66)" }
  - { id: "roots-18", latex: "\\left(-8\\right)^{\\frac{2}{3}}", options: { realOddRoots: true }, expect: "4", source: "derived", group: "roots", note: "(real cube root)^2 = (-2)^2" }

  # a space between two numbers (R51, F43): the space key or a spacing command between two numbers is an error, never a
  # product with no × on the line; spacing anywhere else stays nothing
  - { id: "decimals-e05", latex: "2 3", error: true, source: "derived", group: "decimals", note: "was 2*3 = 6" }

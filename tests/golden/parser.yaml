  - { id: "roots-22", latex: "\\left(-8\\right)^{\\frac{2}{6}}", options: { realOddRoots: true }, expect: "-2", source: "derived", group: "roots", note: "the fraction is reduced first: 2/6 is 1/3 (default, decisions R39)" }
  - { id: "roots-23", latex: "x^{\\frac{1}{3}}", options: { realOddRoots: true }, expect: "surd(x,3)", source: "derived", group: "roots" }
  - { id: "roots-24", latex: "\\left(-8\\right)^{\\frac{1}{2}}", options: { realOddRoots: true }, expect: "2*sqrt(2)*i", source: "derived", group: "roots", note: "an even denominator keeps the principal root (P5 a)" }
  - { id: "roots-25", latex: "\\left(-8\\right)^{0.2}", options: { realOddRoots: true }, expect: "(-8)^0.2", source: "derived", group: "roots", note: "not a literal fraction: Giac's (principal) power" }

  # --- the exponent mark ᴇ (R14, P12 point 4): the exponent key types \emark (drawn ᴇ, U+1D07) as one token;
  # <number>ᴇ<signed whole number> is number × 10^n exactly, as the ×10^ template above was. Anything else is an error.
  - { id: "emark-01", latex: "1.5\\emark3", expect: "1500", source: "derived", group: "emark" }

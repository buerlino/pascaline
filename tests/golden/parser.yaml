  - { id: "emark-16", latex: "\\sin\\left(1\\emark-3\\right)", expect: "sin(1/1000)", source: "derived", group: "emark" }
  - { id: "emark-17", latex: "2^{1\\emark1}", expect: "1024", source: "derived", group: "emark", note: "an E number in an exponent" }

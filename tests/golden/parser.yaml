  # --- R28 (2026-10-18): units mode, the unit view's formula (docs/04 4.3). `options: { units: true }`; a prompt
  # \placeholder[id]{…} after a number is its unit slot, pasu<i> in the order written (its body is never read: the slot's
  # units come from R24a's model); \const{ID}{…} is pask<j>; \pm after a number is pasupm(value,sigma) (G18); \to before
  # the last prompt is the end slot. `formula` is the exact text; `slots` and `to` (app/scripts/unit-case.ts syntax) go
  # with it through G16's builder (app/src/units/build.ts) to the Giac text `expect`, values derived by hand.
  - { id: "units-01", latex: "72\\placeholder[u1]{}", options: { units: true }, formula: "72*pasu1", slots: ["k:m / h"], expect: "20*pasdimL/pasdimT", source: "derived", group: "units", note: "72·1000/3600 = 20 m/s" }
  - { id: "units-02", latex: "\\frac{100\\placeholder[u1]{}}{4\\placeholder[u2]{}}", options: { units: true }, formula: "100*pasu1/(4*pasu2)", slots: ["k:m", "h"], expect: "125/18*pasdimL/pasdimT", source: "derived", group: "units", note: "100000/14400 m/s" }
  - { id: "units-03", latex: "72\\placeholder[u1]{}\\div2\\placeholder[u2]{}", options: { units: true }, formula: "72*pasu1/(2*pasu2)", slots: ["m", "s"], expect: "36*pasdimL/pasdimT", source: "derived", group: "units", note: "a flat ÷ takes the number with its slot" }
  - { id: "units-04", latex: "12.34\\pm0.05\\placeholder[u1]{}", options: { units: true }, formula: "pasupm(12.34,0.05)*pasu1", slots: ["m"], expect: "1234/100*pasdimL", source: "derived", group: "units", note: "G18: the ± goes before the slot; the builder puts the value in" }
  - { id: "units-05", latex: "1.5\\emark-3\\placeholder[u1]{}", options: { units: true }, formula: "1.5e-3*pasu1", slots: ["k:m"], expect: "3/2*pasdimL", source: "derived", group: "units", note: "an ᴇ number is one number before its slot" }
  - { id: "units-06", latex: "2\\placeholder[u1]{}\\times\\const{c}{c}", options: { units: true }, formula: "(2*pasu1)*pask1", slots: ["s"], expect: "599584916*pasdimL", source: "derived", group: "units", note: "a constant needs no chip value: the builder takes it from the index with its dimension" }
  - { id: "units-07", latex: "\\const{c}{c}\\times\\const{c}{c}\\times3\\placeholder[u1]{}", options: { units: true }, formula: "(pask1*pask1)*(3*pasu1)", slots: ["k:g"], expect: "269626553621045292*pasdimM*pasdimL^2/pasdimT^2", source: "derived", group: "units", note: "the same constant twice is one pask; 3·299792458² kg·m²/s²" }
  - { id: "units-08", latex: "5\\placeholder[u1]{}\\to\\placeholder[end]{\\mathrm{m}}", options: { units: true }, formula: "5*pasu1", slots: ["k:m"], to: "m", expect: "5000*pasdimL", source: "derived", group: "units", note: "\\to and the end slot close the line; the end slot's body is not read" }
  - { id: "units-09", latex: "3\\placeholder[u1]{}+20\\placeholder[u2]{}", options: { units: true }, formula: "3*pasu1+20*pasu2", slots: ["m", "c:m"], expect: "16/5*pasdimL", source: "derived", group: "units" }
  - { id: "units-10", latex: "-20\\placeholder[u1]{}", options: { units: true }, formula: "-20*pasu1", slots: ["oC"], expect: "5063/20*pasdimK", source: "derived", group: "units", note: "°C alone: -20 + 273.15 K" }
  - { id: "units-11", latex: "\\left(2.5\\pm0.1\\placeholder[u1]{}\\right)^{2}", options: { units: true }, formula: "(pasupm(2.5,0.1)*pasu1)^2", slots: ["m"], expect: "25/4*pasdimL^2", source: "derived", group: "units" }
  - { id: "units-12", latex: "9.81\\pm2\\emark-3\\placeholder[u1]{}", options: { units: true }, formula: "pasupm(9.81,2e-3)*pasu1", slots: ["m / s^2"], expect: "981/100*pasdimL/pasdimT^2", source: "derived", group: "units", note: "σ may be an ᴇ number" }
  - { id: "units-13", latex: "2{,}5\\placeholder[u1]{}", options: { units: true, decimalComma: true }, formula: "2.5*pasu1", slots: ["h"], expect: "9000*pasdimT", source: "derived", group: "units" }
  - { id: "units-14", latex: "-20\\pm0.5\\placeholder[u1]{}", options: { units: true }, formula: "pasupm(-20,0.5)*pasu1", slots: ["oC"], expect: "5063/20*pasdimK", source: "derived", group: "units", note: "the sign goes inside the pasupm call, so °C sees a lone number (decisions Opus pass 2): -20 + 273.15 K" }
  - { id: "units-15", latex: "-20\\pm0.5\\placeholder[u1]{}", options: { units: true }, formula: "pasupm(-20,0.5)*pasu1", slots: ["m"], expect: "-20*pasdimL", source: "derived", group: "units" }

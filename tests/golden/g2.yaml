# SPDX-License-Identifier: GPL-3.0-or-later
# G2 checklist items: questions only the reference calculator (a real G2, firmware 2.4 rev 15515, or the
# official Virtual Calculator) can answer. Single source for tests/golden/G2-CHECKLIST.md, which oracle.py --g2
# generates (never edit the .md by hand). Cases link items with `g2: <n>`.
# To record an answer: fill `answer` (markdown, with who/date) and set `source: device` or `virtual-calc`;
# then re-tag the linked `assumed` cases. Never delete an answer.
items:
  - { n: 1, area: "CAS, numeric", question: "In which order are numeric eigenvalues shown, e.g. `eigenvals([[2.,1.,0.],[1.,3.,1.],[0.,1.,4.]])`?", why: "GSL sorts ascending; Giac without GSL doesn't", asked_by: "Q5", answer: "**Not sorted ascending**: `[3. 1.26794919243 4.73205080757]`. Exact eigenvalues are 3 and 3±√3; shown in solver-return order: 3, 3-√3, 3+√3 (virtual-calc, 2.4.2.15751, 2026-10-11)", source: "virtual-calc" }
  - { n: 2, area: "Keyboard", question: "Where do sin/cos/tan, x^y, √, a/b, ln, log, π, i and Shift sit, and what are their shifted functions?", why: "Our prototype grid is our own choice, not a copy", asked_by: "ron", answer: "Full key-by-key layout recorded in spec/mapping/vc-2026-10-11/keys.yaml (59 rows) and applied to spec/keyboard.yaml. Short version: SIN/COS/TAN at r5c2-r5c4 (shift ASIN/ACOS/ATAN); x^y at r5c1 (shift: nth root); x² at r6c1 (shift: √); LN at r5c5 (shift eˣ); LOG at r5c6 (shift 10ˣ via ALOG); ÷ at r7c5 (shift x⁻¹, makes a stacked fraction — matches G2 item 5 / `source: device`); π is Shift of the \"3\" key; i is Shift of the \"2\" key; the \"a b/c\" key (r4c5) does NOT insert a fraction template — it cycles the last Home result's display form (decimal/fraction/mixed); Shift is r9c1, Alpha is r8c1 (virtual-calc, 2.4.2.15751, 2026-10-11). **Correction (user, 2026-10-11):** the a b/c behaviour above is the user's own User-mode script, not the stock key; see item 29", source: "virtual-calc" }
  - { n: 3, area: "Entry", question: "After the a/b, x^y and √ templates, does the cursor stay inside until you press →, or does the next operator leave the template?", why: "Today `x ^ 2 +` puts the + into the exponent", asked_by: "ron", answer: "**Yes, the cursor stays inside the template** until → (or ↓) is pressed: confirmed for the exponent, a fraction's denominator, the root sign, function brackets, eˣ and ABS. The nth-root template starts in the index box; → moves to the radicand. Up in a fraction moves from denominator to numerator (virtual-calc, 2.4.2.15751, 2026-10-11)", source: "virtual-calc" }
  - { n: 4, area: "Home/CAS", question: "Does ∛(-8) (or another odd root of a negative number) give -2 or a complex number in the default mode?", why: "Our serializer gives the complex principal root", asked_by: "ron", answer: "**-2** (a real number): `(-8)^(1/3)` gives -2 in Home, default settings (radians, Standard). Tested as a power, not with a dedicated cube-root key (virtual-calc, 2.4.2.15751, 2026-10-11)", source: "virtual-calc" }
  - { n: 5, area: "Entry", question: "Is ÷ shown as ÷ in the entry line, or turned into a fraction?", why: "Display of division", asked_by: "ron", answer: "**Stacked fraction** in Home when typing `5 ÷ 5` (user, G2, 2026-10-11; `source: device`)", source: "device" }
  - { n: 6, area: "Entry", question: "How are `2x`, `x(x+1)` and `1/2x` read (implicit multiplication; does `1/2x` mean (1/2)·x or 1/(2x))?", why: "We emit `2*x`, `x*(x+1)`, `(1/2)*x`", asked_by: "ron", answer: "`2x`, `x(x+1)`, `2(3+1)` and `(1)(2)` are all read as multiplication (echo inserts `*`). Pasted one-line `1/2x` reads as `(1/2)*x` (matches our rule). But typed key-by-key in Textbook entry, `1 ÷ 2 x` (no → pressed) reads as `1/(2x)` — pressing → first gives `(1/2)x`: the template-exit timing changes the parse, not just the linear text (virtual-calc, 2.4.2.15751, 2026-10-11)", source: "virtual-calc" }
  - { n: 7, area: "CAS", question: "How does the CAS show `factor(x^20-1)`: over the rationals only, or with √5 factors?", why: "Our Giac build factors over ℚ(√5)", asked_by: "Q1 bench", answer: "**With √5 factors**: `(x-1)(x+1)(x²+1)` times four quadratics with √5 in their middle coefficients, times a degree-8 factor `x^8-x^6+x^4-x^2+1` (matches our Giac build). Full text in spec/mapping/vc-2026-10-11/cas.yaml id `heavy-factor` (virtual-calc, 2.4.2.15751, 2026-10-11)", source: "virtual-calc" }
  - { n: 8, area: "Home", question: "How are exact ties rounded at 12 digits, e.g. `0.1234567890125`: half away from zero (0.123456789013) or half to even?", why: "We round half away from zero", asked_by: "gorge", answer: "**Looks like half to even, not half away from zero**: `123456789012.5` → `123,456,789,012`; `-123456789012.5` → `−123,456,789,012`; `0.1234567890125` → `0.123456789012`; `999999999999.5` → `1ᴇ12` (carries into the even neighbour). Caveat (marked `unsure` by the mapper): the history echo already rounds the typed literal to 12 digits, so the rounding may happen at entry, not at display — worth a real-device spot check (virtual-calc, 2.4.2.15751, 2026-10-11)", source: "virtual-calc" }
  - { n: 9, area: "Home", question: "In real mode, does `sqrt(-4)` give `2*i` or an error?", why: "We give `2*i`", asked_by: "gorge", answer: "**An error** (\"Error: Invalid input\"), not `2*i`, in default settings (complex mode a+b*i). This differs from our behaviour — see mapping README \"Differences from our defaults\" (virtual-calc, 2.4.2.15751, 2026-10-11)", source: "virtual-calc" }
  - { n: 10, area: "Home", question: "What does `asin(2)` give (which complex branch, or an error)?", why: "We give 1.57079632679-1.31695789692*i", asked_by: "gorge", answer: "**An error** (\"Error: Invalid input\"), not a complex branch, in default settings. Differs from our behaviour — see mapping README (virtual-calc, 2.4.2.15751, 2026-10-11)", source: "virtual-calc" }
  - { n: 11, area: "Home", question: "Does `(-8)^(1/3)` give -2 or 1+1.73205080757*i? (Same question as #4 for the Home view)", why: "We give the principal complex root", asked_by: "gorge", answer: "**-2** in Home, default settings — same as item 4 (virtual-calc, 2.4.2.15751, 2026-10-11)", source: "virtual-calc" }
  - { n: 12, area: "Solve", question: "Which root does Solve return for `tan(x)=0` with guess 1.4, and for `x^3-3x+1=0` with guess 0?", why: "Our rule is \"the root nearest the guess\"", asked_by: "gorge", answer: "`x^3-3x+1=0` guess 0 → `0.347296355335` (message \"Zero\"), matching \"nearest root to the guess\". `tan(x)=0` guess 1.4 → `0` (message \"Zero\") — the nearest root by value (distance 1.4) rather than the pole at ~1.57 or π (virtual-calc, 2.4.2.15751, 2026-10-11)", source: "virtual-calc" }
  - { n: 13, area: "Solve", question: "What does Solve show for `x^2+1=0` with guess 0 (no real root)?", why: "We show \"no root found\"", asked_by: "gorge", answer: "Returns `x = 0` (the guess) with message \"Error: Extremum found\" — **not** \"no root found\" text. Differs from our message — see mapping README (virtual-calc, 2.4.2.15751, 2026-10-11)", source: "virtual-calc" }
  - { n: 14, area: "Solve", question: "Does Solve say anything about the pole when solving `1/x=0`?", why: "We show \"no root found\"", asked_by: "gorge", answer: "**No pole message.** Returns a huge value (`1.45989166621ᴇ499`) with message \"Zero\". Differs from our \"no root found\" behaviour — see mapping README (virtual-calc, 2.4.2.15751, 2026-10-11)", source: "virtual-calc" }
  - { n: 15, area: "Home", question: "Which number formats does Home offer (Standard, Fixed, Scientific, Engineering?) and how does each show 12345.6789 and 0.000123?", why: "D5 plans STD 12 digits + SCI + ENG", asked_by: "henri", answer: "**Six formats**: Standard, Fixed, Scientific, Engineering, Floating, Rounded (digits box defaults to 8 for every format but Standard). For `12345.6789` / `0.000123`: Standard `12,345.6789` / `0.000123`; Fixed(8) `12,345.6789000` / `0.00012300`; Scientific(8) `1.23456789ᴇ4` / `1.23000000ᴇ-4`; Engineering(8) `12.3456789ᴇ3` / `123.000000ᴇ-6`; Floating(8) and Rounded(8) both `12,345.6789` / `0.000123` (virtual-calc, 2.4.2.15751, 2026-10-11)", source: "virtual-calc" }
  - { n: 16, area: "Home", question: "Default settings: how does `1 ÷ 3` Enter show the result?", why: "Home result format (decimal vs exact)", asked_by: "user", answer: "**`0.333333333333`** (user, G2, 2026-10-11; `source: device`)", source: "device" }
  - { n: 17, area: "CAS", question: "Default settings: how does the CAS show `1/3+1/6` and `√8`? (stacked `1/2`? `2√2`?)", why: "Milestone 1 draws exact CAS results in 2D", asked_by: "Phase 1", answer: "`1/3+1/6` → stacked fraction **1/2** (clipboard text `1/2`). `√8` → **2√2** (clipboard text `2*√2`, shown as 2, a star, then a root sign over 2). Confirms our exact-2D-in-CAS default (virtual-calc, 2.4.2.15751, 2026-10-11)", source: "virtual-calc" }
  - { n: 18, area: "Entry", question: "Which entry modes exist (e.g. textbook, one-line/algebraic, RPN), and which is the default?", why: "Our one-line mode setting", asked_by: "Phase 1", answer: "**Three modes: Textbook (the default), Algebraic and RPN** (RPN only listed, not exercised). Matches our MathPrint-by-default decision (virtual-calc, 2.4.2.15751, 2026-10-11)", source: "virtual-calc" }
  - { n: 19, area: "Function", question: "In the Function app Num view with F1(X)=1/X, what does the cell at X=0 show (blank, an error text, ∞)?", why: "We show what Home shows for 1/0", asked_by: "gorge", answer: "**`NaN`** at X=0 (the other rows are 0.1 → 10, 0.2 → 5, 0.3 → 3.33333333333, and so on). Num starts at X=0 with step 0.1 (virtual-calc, 2.4.2.15751, 2026-10-12)", source: "virtual-calc" }
  - { n: 20, area: "Solve", question: "Solve app with two equations (E1: X^2+Y^2=4, E2: Y=e^X) and guesses X=-1, Y=1: what does it show, and what if the system has no real solution (X^2+Y^2=-1, Y=X)?", why: "We return the solution nearest the guesses, or \"no root found\"", asked_by: "gorge", answer: "Entered in Solve Symbolic view as E1 `X^2+Y^2=4` and E2 `Y=EXP(X)`; in Num view the fields X and Y take the guesses. With X=-1, Y=1: **X = -1.99537317006, Y = 0.135962907412** (check: e^-1.995 = 0.1360, and X²+Y² = 4). No message was shown. For `X^2+Y^2=-1`, `Y=X` with guesses X=1, Y=1: a dialog **\"Cannot find solution\"** appears and the fields keep the guesses 1 and 1. Differs from our \"no root found\" wording (virtual-calc, 2.4.2.15751, 2026-10-12)", source: "virtual-calc" }
  - { n: 21, area: "Solve", question: "Where does the reference give all roots of a polynomial, complex included (e.g. X^4+X+1=0), and in which order are they listed?", why: "We list reals ascending, then complex by real part, then imaginary part", asked_by: "gorge", answer: "Not in the Solve app (it returns one root per run). In the CAS view (t instead of x, since x held a leftover value): `proot([1,0,0,1,1])` gives all four, **sorted by real part, then imaginary part**: -0.727136084491-0.43001428833i, -0.727136084491+0.43001428833i, 0.727136084491-0.934099289461i, 0.727136084491+0.934099289461i — matches our rule. `cZeros(t^4+t+1,t)` gives the same four in another order (0.727…-0.934…i, 0.727…+0.934…i, -0.727…-0.430…i, -0.727…+0.430…i) as a list in square brackets; `cSolve(t^4+t+1=0,t)` gives the four in yet another order (+0.934i, -0.934i, +0.430i, -0.430i) in curly brackets. Only `proot` is sorted (virtual-calc, 2.4.2.15751, 2026-10-12)", source: "virtual-calc" }
  - { n: 22, area: "Function", question: "In the Plot analysis menu: what does Extremum report for F1(X)=X^3 near X=1 (a flat point, no extremum), and what does Signed area give for 1/X from -1 to 1?", why: "We report a flat point at 0, and no area across the pole", asked_by: "gorge", answer: "Plot view, Menu soft key, Fcn list (Sketch, Definition, Transform, Root, Intersection, Slope, Signed area, Extremum, Tangent). **Extremum** for F1(X)=X^3 with the trace cursor sent to X=1 by Go To: reports **(0, 0)**, a flat point, not an error (matches ours). **Signed area** for F1(X)=1/X, From -1 To 1, against the X-axis: **`NaN`** (matches \"no area across the pole\"; the shown text is Signed area: NaN) (virtual-calc, 2.4.2.15751, 2026-10-12)", source: "virtual-calc" }
  - { n: 23, area: "Function", question: "Function app Plot with the default settings: what are the X and Y ranges of the window, and is the grid or axes labelling shown?", why: "We use x in [-10,10] with y at the same scale, centred on 0", asked_by: "ron", answer: "**X Rng -15.9..15.9, Y Rng -10.9..10.9**, ticks 1. Axes on, Labels off, Grid Dots on, Grid Lines on. Differs from our [-10,10] default — see mapping README (virtual-calc, 2.4.2.15751, 2026-10-11)", source: "virtual-calc" }
  - { n: 24, area: "Function", question: "In Plot, how far does one trace step move X with the default window, and which X-values does Num start at and step by?", why: "We use a 1-2-5 step near width/100; Num starts at 0 with step 1", asked_by: "ron", answer: "**Num Start 0, Num Step 0.1** (not 1 as we assumed), Num Zoom 2, Num Type Automatic (virtual-calc, 2.4.2.15751, 2026-10-11). **One trace step (right arrow) moves X by 0.1** with the default window X -15.9..15.9: X read 0.2, then 0.3, then 0.5 after two more presses (virtual-calc, 2.4.2.15751, 2026-10-12). Not checked with other window widths, so whether the step scales with the window is still open", source: "virtual-calc" }
  - { n: 25, area: "Function", question: "With three functions on, which two does the Intersection item in the Plot menu use, and does it ask?", why: "We use the traced function and the next one that is on", asked_by: "ron", answer: "**It asks.** With F1=X^3, F2=X+1, F3=1/X all on, Fcn > Intersection opens a list titled \"Intersection of F1(X) and\" (F1 was the traced one) with the other functions that are on, F2 and F3, plus **X-Axis**. After pressing Down in Plot to trace F2, the list read \"Intersection of F2(X) and\" with F1, F3 and X-Axis. So the first function is the traced one and the second is chosen by the user (not \"the next one\"). Choosing F2 for F1 gave Intersection: (1.32472, 2.32472), the only real crossing of X^3 and X+1 (virtual-calc, 2.4.2.15751, 2026-10-12)", source: "virtual-calc" }
  - { n: 26, area: "Python", question: "In the Python app, which functions of the graphics module draw a pixel, a line, a rectangle (outline and filled), a circle and text, and in which order do they take their arguments (is the graphic, e.g. G0, the first one; are rectangles x, y, width, height or two corners)?", why: "Our compatibility module assumes pixon(g,x,y,c), line(g,x1,y1,x2,y2,c), fillrect(g,x,y,w,h,edge,fill), circle(g,x,y,r,c), textout(g,x,y,s,c)", asked_by: "gorge", answer: "Python app, Num view is the shell; `import hpprime` lists (via dir) these names: arc, blit, circle, dimgrob, eval, fillpoly, fillrect, get_cartesian, getpix, grobh, grobw, invert, keyboard, line, mouse, pixon, rect, set_cartesian, strblit, strblit2, textout, ticks, each also with a `_c` variant (e.g. `pixon_c`). **The graphic is the first argument (0 = the screen)**. Drawn and measured on screen: `pixon(g,x,y,c)` one pixel; `line(g,x1,y1,x2,y2,c)` end points; `rect(g,x,y,w,h,c)` outline, width and height (rect(0,150,100,50,30,..) covered x 150..200, y 100..130); `fillrect(g,x,y,w,h,edge,fill)` (fillrect(0,20,20,100,50,0xFF0000,0x00FF00) gave a green fill with a red edge, x 20..120, y 20..70); `circle(g,x,y,r,c)` outline, centre x,y; `textout(g,x,y,s,c)` text at x,y. All five match our assumed signatures (the `_c` variants were not exercised) (virtual-calc, 2.4.2.15751, 2026-10-12)", source: "virtual-calc" }
  - { n: 27, area: "Python", question: "What colours does the Python graphics module take (0xRRGGBB integers?), and is the screen cleared when a script starts or ends?", why: "We take 0xRRGGBB; the canvas starts white and a run doesn't clear it", asked_by: "gorge", answer: "**0xRRGGBB integers**: 0xFF0000 drew red, 0x00FF00 green, 0x0000FF blue, 0x00FFFF cyan, 0xFF00FF magenta. **A run does not clear the screen at start**: the shapes were drawn over the text already in the shell. **When the script ends the screen is repainted** by the shell and the drawing is gone (a script that waits keeps it on screen). So there is no white canvas that survives the run, which differs from \"the canvas starts white\" (virtual-calc, 2.4.2.15751, 2026-10-12)", source: "virtual-calc" }
  - { n: 28, area: "Python", question: "How does a Python script reach the CAS and the calculator variables (A-Z, user variables), and what do those calls return: text or numbers?", why: "Our calc.cas returns text, calc.eval/get return Python numbers", asked_by: "gorge", answer: "Through **`hpprime.eval(string)`**, which takes a calculator expression as text. Variables: `hpprime.eval(\"A:=7\")` assigns (returns 7.0) and `hpprime.eval(\"A\")` reads (7.0). Return types: numbers come back as **Python floats, even whole ones** (`1+1` → 2.0, `1/3` → 0.333333333333); a list `{1,2,3}` → Python list [1.0, 2.0, 3.0]; a matrix → nested lists; a string → str. **The CAS is reached with `hpprime.eval('CAS(\"...\")')`**: a numeric result is a float or list of floats (`CAS(\"approx(sqrt(2))\")` → 1.41421356237, `CAS(\"solve(x^2=4,x)\")` → [-2.0, 2.0], a matrix product → nested lists), a symbolic result is text (`CAS(\"1/3+1/6\")` → '1/2', `CAS(\"factor(x^2-1)\")` → '(x-1)*(x+1)'). **Errors are returned as text, not raised**: 'Error: Syntax Error' (the form `CAS.factor(x^2-1)` gave that), 'No such variable A'. So calc.cas returning always text and eval/get returning numbers is only partly right: the type depends on the result (virtual-calc, 2.4.2.15751, 2026-10-12)", source: "virtual-calc" }
  - { n: 29, area: "Keyboard", question: "With User key mode OFF (no 1U/U in the status bar), what does the a b/c key do: on an empty line after a result, and while typing a number (does it insert a fraction or mixed-number template)?", why: "The Virtual Calculator run saw the user's own script on this key; our L2 inserts a stacked fraction, twice after a whole number a mixed number", asked_by: "henri", answer: "Observed in the Virtual Calculator with **no 1U/U in the status bar** (User mode off; the bar showed only the clock and battery). **On an empty line after a result, a b/c cycles the form of the last result**: `5 ÷ 2` Enter shows 2.5; a b/c → stacked 5/2; again → mixed 2 1/2. **While typing a number it did nothing**: `3`, a b/c, `1`, a b/c, `2` left the entry line as plain `312` (no template, no space). So this stock behaviour, not a template insert, is what the key does with User mode off; this contradicts the 2026-10-11 correction in item 2 that attributed it to the user's own script, so a spot check on the real G2 is worth doing (virtual-calc, 2.4.2.15751, 2026-10-12)", source: "virtual-calc" }
  - { n: 30, area: "Units", question: "Which key or menu opens the units list and the physical constants, how is a unit attached to a number (e.g. 5 km), and how is a value converted to another unit?", why: "P3 plan: Units and Constants as pickers in our Menu key's menu, conversion with a → operator (docs/p3-units-plan.md)", asked_by: "henri", answer: "**Shift + the Units key (r4c3) opens one menu with three tabs: Tools, Units, Const.** Tools: CONVERT, MKSA, UFACTOR, UPART, USIMPLIFY, UVAL. Units: categories Prefix, Length, Area, Volume, Time, Speed, Mass, Acceleration and more (scrolls); each opens a grid of unit names (Length: m, cm, mm, km, au, lyr, pc, Å, fermi, yd, ft, inch…). Const: Math, Chemistry, Physics, Quantum, with a Value toggle soft key. **Attaching a unit**: number, underscore, unit name: picking km from the menu after typing 5 inserts `5_(km)`, shown as `5_km`; pasted `5_km` also works. Mixed sums keep the first unit: `5_km+300_m` → 5.3_km. **Converting**: `CONVERT(5_km,1_m)` → `5,000_m` (clipboard `5000_(m)`); or the ▶ operator (Sto▸ soft key) with a unit after it: `5_km▶_m` is rewritten in the history as `CONVERT(5_km,0_m)` and gives 5,000_m, while `5_km▶1_m` gives \"Error: Bad argument type\" (it is the store operator when a value follows). The Const tab's entries were not opened (virtual-calc, 2.4.2.15751, 2026-10-12)", source: "virtual-calc" }
  - { n: 31, area: "CAS", question: "In the CAS view, how are x*x, a*b*a and x*y^2*x shown after Enter (x^2? a^2*b? or left as typed)? And in Home with x, a, b undefined?", why: "We merge equal factors after each symbolic result (x*x shows x^2)", asked_by: "gorge", answer: "**CAS view merges them**: `x*x` → `x^2`, `a*b*a` → `a^2*b`, `x*y^2*x` → `x^2*y^2` (x, a, b, y undefined; run in the Function app, since after the Solve app x held a leftover number and `x*x` gave 1.76019833736). **Home does not accept them**: lowercase `x`, `a*b` and `x*x` all give \"Error: Syntax Error\" in Home with the names undefined (the text was pasted, not typed from the keys); the uppercase `A*B` and `X*X` give 0 there (virtual-calc, 2.4.2.15751, 2026-10-12)", source: "virtual-calc" }

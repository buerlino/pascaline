# G2 checklist items: questions only the reference calculator (a real G2, firmware 2.4 rev 15515, or the
# official Virtual Calculator) can answer. Single source for spike/G2-CHECKLIST.md, which oracle.py --g2
# generates (never edit the .md by hand). Cases link items with `g2: <n>`.
# To record an answer: fill `answer` (markdown, with who/date) and set `source: device` or `virtual-calc`;
# then re-tag the linked `assumed` cases. Never delete an answer.
items:
  - { n: 1, area: "CAS, numeric", question: "In which order are numeric eigenvalues shown, e.g. `eigenvals([[2.,1.,0.],[1.,3.,1.],[0.,1.,4.]])`?", why: "GSL sorts ascending; Giac without GSL doesn't", asked_by: "Q5", answer: "", source: "" }
  - { n: 2, area: "Keyboard", question: "Where do sin/cos/tan, x^y, √, a/b, ln, log, π, i and Shift sit, and what are their shifted functions?", why: "Our prototype grid is our own choice, not a copy", asked_by: "ron", answer: "", source: "" }
  - { n: 3, area: "Entry", question: "After the a/b, x^y and √ templates, does the cursor stay inside until you press →, or does the next operator leave the template?", why: "Today `x ^ 2 +` puts the + into the exponent", asked_by: "ron", answer: "", source: "" }
  - { n: 4, area: "Home/CAS", question: "Does ∛(-8) (or another odd root of a negative number) give -2 or a complex number in the default mode?", why: "Our serializer gives the complex principal root", asked_by: "ron", answer: "", source: "" }
  - { n: 5, area: "Entry", question: "Is ÷ shown as ÷ in the entry line, or turned into a fraction?", why: "Display of division", asked_by: "ron", answer: "**Stacked fraction** in Home when typing `5 ÷ 5` (user, G2, 2026-10-11; `source: device`)", source: "device" }
  - { n: 6, area: "Entry", question: "How are `2x`, `x(x+1)` and `1/2x` read (implicit multiplication; does `1/2x` mean (1/2)·x or 1/(2x))?", why: "We emit `2*x`, `x*(x+1)`, `(1/2)*x`", asked_by: "ron", answer: "", source: "" }
  - { n: 7, area: "CAS", question: "How does the CAS show `factor(x^20-1)`: over the rationals only, or with √5 factors?", why: "Our Giac build factors over ℚ(√5)", asked_by: "Q1 bench", answer: "", source: "" }
  - { n: 8, area: "Home", question: "How are exact ties rounded at 12 digits, e.g. `0.1234567890125`: half away from zero (0.123456789013) or half to even?", why: "We round half away from zero", asked_by: "gorge", answer: "", source: "" }
  - { n: 9, area: "Home", question: "In real mode, does `sqrt(-4)` give `2*i` or an error?", why: "We give `2*i`", asked_by: "gorge", answer: "", source: "" }
  - { n: 10, area: "Home", question: "What does `asin(2)` give (which complex branch, or an error)?", why: "We give 1.57079632679-1.31695789692*i", asked_by: "gorge", answer: "", source: "" }
  - { n: 11, area: "Home", question: "Does `(-8)^(1/3)` give -2 or 1+1.73205080757*i? (Same question as #4 for the Home view)", why: "We give the principal complex root", asked_by: "gorge", answer: "", source: "" }
  - { n: 12, area: "Solve", question: "Which root does Solve return for `tan(x)=0` with guess 1.4, and for `x^3-3x+1=0` with guess 0?", why: "Our rule is \"the root nearest the guess\"", asked_by: "gorge", answer: "", source: "" }
  - { n: 13, area: "Solve", question: "What does Solve show for `x^2+1=0` with guess 0 (no real root)?", why: "We show \"no root found\"", asked_by: "gorge", answer: "", source: "" }
  - { n: 14, area: "Solve", question: "Does Solve say anything about the pole when solving `1/x=0`?", why: "We show \"no root found\"", asked_by: "gorge", answer: "", source: "" }
  - { n: 15, area: "Home", question: "Which number formats does Home offer (Standard, Fixed, Scientific, Engineering?) and how does each show 12345.6789 and 0.000123?", why: "D5 plans STD 12 digits + SCI + ENG", asked_by: "henri", answer: "", source: "" }
  - { n: 16, area: "Home", question: "Default settings: how does `1 ÷ 3` Enter show the result?", why: "Home result format (decimal vs exact)", asked_by: "user", answer: "**`0.333333333333`** (user, G2, 2026-10-11; `source: device`)", source: "device" }
  - { n: 17, area: "CAS", question: "Default settings: how does the CAS show `1/3+1/6` and `√8`? (stacked `1/2`? `2√2`?)", why: "Milestone 1 draws exact CAS results in 2D", asked_by: "Phase 1", answer: "", source: "" }
  - { n: 18, area: "Entry", question: "Which entry modes exist (e.g. textbook, one-line/algebraic, RPN), and which is the default?", why: "Our one-line mode setting", asked_by: "Phase 1", answer: "", source: "" }

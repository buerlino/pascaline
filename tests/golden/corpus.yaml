# Short runs in order on one engine: each step is shown in Home, in RAD and DEG, at 12 and 30 digits.
sequences:
  # store a number, use it, redefine it
  - { id: "store-use", steps: ["a:=2.5", "a*2", "a:=a+1", "a", "sqrt(a)"] }
  # a function that reads a stored value, then the value changes
  - { id: "fn-reads-name", steps: ["k:=3", "f(x):=x^2+k", "f(2)", "k:=4", "f(2)", "f(0.5)"] }
  # an angle function stored and used
  - { id: "fn-angle", steps: ["g(x):=sin(x)+cos(x)", "g(30)", "g(pi/6)", "g(1.5)"] }
  # list and run-once assignments
  - { id: "list-once", steps: ["[u1,u2]:=[1/3,0.5]", "u1", "u2", "u1+u2", "L:=[1,2,3]", "L[2]:=9", "L", "sum(L)"] }
  # a large value stored, then used
  - { id: "big-value", steps: ["w:=floor(sin(10^100)*10^12)", "w", "w+1", "w:=2^100", "w/3"] }
  # an exact value stored, then a rounding of it
  - { id: "round-stored", steps: ["r:=12.345", "round(r,2)", "r:=pi", "round(r,3)", "trunc(r,2)"] }

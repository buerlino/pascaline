# G55: everyday engineering inputs with NO expected values. app/scripts/behaviour-diff.ts runs them through two trees and
# prints what differs (a tool for audits, not a gate). One input per line; an `# area` comment says what the block covers.
# Inputs are what the user types (Giac's spelling); the tool gives them the parser's angle rule, as golden.ts does.
# Add inputs freely; none may need a device, a long run (> 2 s) or a particular order (order is for `sequences`).
cases:
  # --- rounding and formats
  - { input: "round(12.345,2)" }
  - { input: "round(pi,3)" }
  - { input: "round(-0.125,2)" }
  - { input: "round(2.5)" }
  - { input: "round(-2.5)" }

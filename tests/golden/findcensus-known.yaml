# G110: the census of Find's tier-1 functions (app/scripts/findcensus.ts; the probe tools/probes/find-census.ts). Every function's
# sample input (Giac's help's first typeable example as the keys write it; on numbers also an integer, a decimal, a negative and a list
# as the last argument) runs in Home and in CAS. `classes`: per function, one letter per input in sample order, Home's, then `|`, then
# CAS's; `-` for a function without a sample. Letters: c checked (a number whose mark mpmath confirms), u unchecked (a number, no
# oracle), s symbolic, r refused (a message), t raw text (Giac's words, objects, strings, an unevaluated call on numbers), w wrong (the
# oracle disagrees; in CAS an exact form on numbers is judged as =), d defined (a store, assume or purge that left only what the
# definitions log holds, as intended), x state (a name or a setting left behind that the log does not hold), h hang, k crash (an
# exception out of the engine). `findings`: every t, w, x, h and k input, under the backlog line that holds it. A class change fails the stage: rerun the
# function with `node tools/probes/find-census.ts <name>`, and when the change is right, `node scripts/findcensus.ts --update` (in app/)
# and file any new finding. `deadline`: the inputs whose class came from a clock (a hang past the census's 6 s, or a time-out refusal,
# Home's after 2 s); a faster or a loaded machine moves them. An input that is on this list or hits a deadline in this run and whose
# class moved runs once more alone (no other worker running); if it still differs, the stage reports a TIMING change and does not fail.
# G111: the functions find/functions.yaml's `census` names (exclude groups graphics, graphs, strings, debugger) are left out of Find's
# index and run here all the same, in their place in Giac's help, so an upstream fix shows; their findings stay under their lines.

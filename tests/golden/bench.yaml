# SPDX-License-Identifier: GPL-3.0-or-later
# Benchmark inputs (spike Q1, docs/02 D3): typical calculator inputs, timed on devices through the app.
# A timing set, not a value set: `expect` only where provable (source: derived), compared with Giac's
# printed output as an exact string (CAS mode, Digits 12, radians). Cases without expect only run.
cases:
  # arithmetic / numbers
  - { id: "arith-frac", input: "1/3+1/6", expect: "1/2", source: "derived", cat: "arithmetic" }
  - { id: "arith-dec", input: "1-0.9-0.1", cat: "arithmetic" }
  - { id: "arith-pow", input: "2^100", expect: "1267650600228229401496703205376", source: "derived", cat: "arithmetic" }
  - { id: "arith-fact", input: "50!", cat: "arithmetic" }
  - { id: "arith-sqrt", input: "sqrt(12)", expect: "2*sqrt(3)", source: "derived", cat: "arithmetic" }
  - { id: "arith-evalf", input: "evalf(sqrt(2))", cat: "arithmetic" }
  - { id: "arith-pi50", input: "evalf(pi,50)", cat: "arithmetic" }
  - { id: "arith-ifactor", input: "ifactor(123456789)", cat: "arithmetic" }
  - { id: "arith-gcd", input: "gcd(1071,462)", expect: "21", source: "derived", cat: "arithmetic" }
  - { id: "arith-complex", input: "(3+4*i)*(1-2*i)", expect: "11-2*i", source: "derived", cat: "arithmetic" }
  # trig / transcendental
  - { id: "trig-exact", input: "sin(pi/6)", expect: "1/2", source: "derived", cat: "trig" }
  - { id: "trig-num", input: "evalf(sin(1)+cos(2))", cat: "trig" }
  - { id: "trig-simplify", input: "simplify(sin(x)^2+cos(x)^2)", expect: "1", source: "derived", cat: "trig" }
  - { id: "trig-expand", input: "texpand(sin(2*x))", cat: "trig" }
  - { id: "trig-atan", input: "atan(1)", expect: "pi/4", source: "derived", cat: "trig" }
  - { id: "exp-ln", input: "evalf(exp(1)*ln(10))", cat: "trig" }
  # algebra
  - { id: "alg-factor", input: "factor(x^4-1)", cat: "algebra" }
  - { id: "alg-factor2", input: "factor(x^6-y^6)", cat: "algebra" }
  - { id: "alg-expand", input: "expand((x+y)^5)", cat: "algebra" }
  - { id: "alg-partfrac", input: "partfrac(1/(x^2-1))", cat: "algebra" }
  - { id: "alg-normal", input: "normal((x^2-1)/(x-1))", expect: "x+1", source: "derived", cat: "algebra" }
  # solve
  - { id: "solve-quad", input: "solve(x^2=2,x)", cat: "solve" }
  - { id: "solve-cubic", input: "solve(x^3-6*x^2+11*x-6=0,x)", cat: "solve" }
  - { id: "solve-sys", input: "solve([x+y=3,x-y=1],[x,y])", cat: "solve" }
  - { id: "solve-trig", input: "solve(sin(x)=1/2,x)", cat: "solve" }
  - { id: "solve-fsolve", input: "fsolve(x*exp(x)=5,x=1)", cat: "solve" }
  - { id: "solve-fsolve-sys", input: "fsolve([x^2+y^2=4,x=y],[x,y],[1,1])", cat: "solve" }
  - { id: "solve-proot", input: "proot([1,0,-2,5])", cat: "solve" }
  - { id: "solve-csolve", input: "csolve(x^4=1,x)", cat: "solve" }
  # calculus
  - { id: "int-atan", input: "int(1/(1+x^2),x)", cat: "calculus" }
  - { id: "int-parts", input: "int(x*exp(x),x)", cat: "calculus" }
  - { id: "int-def", input: "int(x^2,x,0,3)", expect: "9", source: "derived", cat: "calculus" }
  - { id: "int-trig", input: "int(sin(x)^3,x)", cat: "calculus" }
  - { id: "int-num", input: "romberg(exp(-x^2),x,0,1)", cat: "calculus" }
  - { id: "diff-chain", input: "diff(sin(x^2),x)", cat: "calculus" }
  - { id: "diff-2nd", input: "diff(x^3*ln(x),x,2)", cat: "calculus" }
  - { id: "limit-sinc", input: "limit(sin(x)/x,x,0)", expect: "1", source: "derived", cat: "calculus" }
  - { id: "limit-inf", input: "limit((1+1/n)^n,n,inf)", cat: "calculus" }
  - { id: "series-exp", input: "series(exp(x),x,0,5)", cat: "calculus" }
  - { id: "sum-sym", input: "sum(k^2,k,1,n)", cat: "calculus" }
  - { id: "desolve", input: "desolve(y'=y,y)", cat: "calculus" }
  # matrices / lists
  - { id: "mat-det", input: "det([[1,2],[3,4]])", expect: "-2", source: "derived", cat: "matrix" }
  - { id: "mat-inv", input: "inv([[1,2],[3,4]])", cat: "matrix" }
  - { id: "mat-eig", input: "eigenvals([[2,1],[1,2]])", cat: "matrix" }
  - { id: "mat-rref", input: "rref([[1,2,3],[4,5,6],[7,8,10]])", cat: "matrix" }
  - { id: "mat-mul", input: "[[1,2],[3,4]]*[[5,6],[7,8]]", cat: "matrix" }
  - { id: "mat-det5", input: "det(hilbert(5))", cat: "matrix" }
  # statistics / regressions
  - { id: "stat-mean", input: "mean([1,2,3,4,10])", expect: "4", source: "derived", cat: "stats" }
  - { id: "stat-stddev", input: "stddev([2,4,4,4,5,5,7,9])", expect: "2", source: "derived", cat: "stats" }
  - { id: "stat-linreg", input: "linear_regression([1,2,3,4],[2.1,3.9,6.2,7.8])", cat: "stats" }
  - { id: "stat-expreg", input: "exponential_regression([1,2,3,4],[2.7,7.4,20.1,54.6])", cat: "stats" }
  - { id: "stat-normal", input: "normald_cdf(0,1,1.96)", cat: "stats" }
  # heavier "still calculator-sized" inputs
  - { id: "heavy-factor", input: "factor(x^20-1)", cat: "heavy" }
  - { id: "heavy-int", input: "int(1/(x^4+1),x)", cat: "heavy" }
  - { id: "heavy-ifactor", input: "ifactor(2^64+1)", cat: "heavy" }
  - { id: "g38-abs-sin1e50", input: "abs(sin(10^50))", expect: "-sin(100000000000000000000000000000000000000000000000000)", source: "derived", cat: "trig", note: "G38: sin(10^50) < 0 (oracle, mpmath at 200 digits: -0.78967249342931008271), so |sin(10^50)| = -sin(10^50); at Digits 12 Giac gave sin(10^50)" }

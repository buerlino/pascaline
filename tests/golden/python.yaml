# SPDX-License-Identifier: GPL-3.0-or-later
# Python (milestone 3): MicroPython in PyHost (app/src/python/pyHost.ts) with the calc bridge on Giac, run by
# `npm run golden` (stage python). Kinds:
#   run     `code` as an editor script (fresh globals; `file` names it, default <script>)
#   shell   `before` shell entries, then `code` as one more; only the output of `code` is compared
#   cancel  `code` runs in a worker that is terminated after 300 ms; then a fresh runtime runs print(1)
# `home`: Home entries evaluated first (they share Giac with calc). `expect` keys: stdout (exact text),
# error ({type, line}), gfx (the graphics commands, in order), home ({input: display} after the run).
# `status: "pending"`: known to fail until its fix; the gate runs it, lists it as still pending or now passing, and never fails on it.
# Sources: derived = follows from Python's or the module's documented semantics (app/src/python/README.md).
cases:
  # --- output and arithmetic
  - { id: "py-print-01", kind: "run", code: "print(1+1)", expect: { stdout: "2\n" }, source: "derived", group: "basics" }
  - { id: "py-print-02", kind: "run", code: "print(\"a\", 2, end=\"|\")\nprint(3)", expect: { stdout: "a 2|3\n" }, source: "derived", group: "basics" }
  - { id: "py-arith-01", kind: "run", code: "print(7 // 2, 7 % 2, 2 ** 100)", expect: { stdout: "3 1 1267650600228229401496703205376\n" }, source: "derived", group: "basics" }
  - { id: "py-arith-02", kind: "run", code: "print(0.1 + 0.2 == 0.3, abs(-3), 10 / 4)", expect: { stdout: "False 3 2.5\n" }, source: "derived", group: "basics" }
  - { id: "py-shell-01", kind: "shell", before: ["a = 6"], code: "a * 7", expect: { stdout: "42\n" }, source: "derived", group: "basics" }
  - { id: "py-shell-02", kind: "shell", before: ["def sq(v):\n    return v * v\n"], code: "sq(12)", expect: { stdout: "144\n" }, source: "derived", group: "basics" }
  - { id: "py-shell-03", kind: "shell", code: "x = 5", expect: { stdout: "" }, source: "derived", group: "basics" }
  # --- errors carry the user's line
  - { id: "py-error-01", kind: "run", file: "main.py", code: "a = 1\nb = 0\nprint(a / b)\n", expect: { error: { type: "ZeroDivisionError", line: 3 } }, source: "derived", group: "errors" }
  - { id: "py-error-02", kind: "run", code: "def f(n):\n    return n + undefined_name\n\nf(1)\n", expect: { error: { type: "NameError", line: 2 } }, source: "derived", group: "errors" }
  - { id: "py-error-03", kind: "run", code: "x = 1\nif x:\nprint(x)\n", expect: { error: { type: "SyntaxError", line: 3 } }, source: "derived", group: "errors", note: "MicroPython reports a missing indented block as SyntaxError (CPython: IndentationError, its subclass)" }
  # --- calc: the CAS and calculator variables
  - { id: "py-calc-01", kind: "run", code: "import calc\nprint(calc.cas(\"factor(x^2-1)\"))", expect: { stdout: "(x-1)*(x+1)\n" }, source: "derived", group: "calc", note: "x^2-1 = (x-1)(x+1)" }
  - { id: "py-calc-02", kind: "run", code: "import calc\nprint(calc.cas(\"diff(x^3,x)\"))", expect: { stdout: "3*x^2\n" }, source: "derived", group: "calc" }
  - { id: "py-calc-03", kind: "run", code: "import calc\nprint(calc.eval(\"2^70\"), calc.eval(\"7/2\"), calc.eval(\"sqrt(-4)\"))", expect: { stdout: "1180591620717411303424 3.5 2j\n" }, source: "derived", group: "calc" }
  - { id: "py-calc-04", kind: "run", home: ["A:=1/4"], code: "import calc\nprint(calc.get(\"A\") * 8)", expect: { stdout: "2.0\n" }, source: "derived", group: "calc", note: "a Home variable is read from Python" }
  - { id: "py-calc-05", kind: "run", code: "import calc\ncalc.set(\"B\", 2.5)\ncalc.set(\"C\", 3)", expect: { home: { "B*C": "7.5" } }, source: "derived", group: "calc", note: "a value written by Python is seen in Home" }
  - { id: "py-calc-06", kind: "run", code: "import calc\ncalc.set(\"Q\", None)\nprint(1)\ncalc.get(\"Q\")\n", expect: { stdout: "1\n", error: { type: "NameError", line: 4 } }, source: "derived", group: "calc" }
  - { id: "py-calc-07", kind: "run", code: "import calc\n\ncalc.cas(\"factor(\")\n", expect: { error: { type: "ValueError", line: 3 } }, source: "derived", group: "calc" }
  - { id: "py-calc-eval-float-trap", kind: "run", code: "import calc\nprint(calc.eval(\"1-0.9-0.1\"))", expect: { stdout: "0\n" }, source: "derived", group: "calc", status: "pending", note: "docs/04 2.3 #7: Home shows 0 (exact decimals) but calc.eval ran a raw Giac float call and gave 1.7763568394e-15; calc.eval goes through home() in EN3-engine (2.10). An exact integer result stays int, so print shows 0, not 0.0" }
  # --- Cancel
  - { id: "py-cancel-01", kind: "cancel", code: "while True: pass", expect: { stdout: "1\n" }, source: "derived", group: "cancel" }
  - { id: "py-cancel-02", kind: "cancel", code: "i = 0\nwhile True:\n    i += 1\n    if i % 100000 == 0: print(i)\n", expect: { stdout: "1\n" }, source: "derived", group: "cancel" }
  # --- graphics (draw: our API; hpprime: assumed compatibility API)
  - { id: "py-gfx-01", kind: "run", code: "import draw\ndraw.line(0, 0, 319, 239, 0xFF0000)\ndraw.circle(160, 120, 50, 0x0000FF)", expect: { gfx: [["line", 0, 0, 319, 239, 16711680], ["circle", 160, 120, 50, 255]] }, source: "derived", group: "gfx" }
  - { id: "py-gfx-02", kind: "run", code: "import draw\ndraw.clear()\ndraw.fill_rect(1.4, 2.6, 10, 5, draw.rgb(0, 128, 255))\ndraw.text(5, 6, \"Hi\", 0, \"small\")\ndraw.show()", expect: { gfx: [["clear", 16777215], ["fillrect", 1, 3, 10, 5, 33023], ["text", 5, 6, "Hi", 0, "small"], ["show"]] }, source: "derived", group: "gfx" }
  - { id: "py-gfx-03", kind: "run", code: "import hpprime\nhpprime.pixon(0, 3, 4, 0)\nhpprime.fillrect(0, 1, 2, 3, 4, 5, 6)", expect: { gfx: [["pixel", 3, 4, 0], ["fillrect", 1, 2, 3, 4, 6], ["rect", 1, 2, 3, 4, 5]] }, source: "virtual-calc", g2: 26, group: "gfx", note: "pixon, line, rect, fillrect, circle, textout orders confirmed 2026-10-12 (2.4.2.15751)" }

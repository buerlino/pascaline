# Home view, exact-first (D3): input -> value shown in STD with 12 significant digits.
# `expect` is the mathematically correct value rounded to 12 significant digits, half away from zero,
# in our canonical text (format.ts: plain for 1e-4 <= |x| < 1e12, else d.dddE+-k; complex a+b*i).
# It is NOT a claim about how the reference calculator displays anything (G2 checklist item 15).
#   oracle  : expect written by tests/golden/oracle.py (exact Fraction, else mpmath at 30 digits, checked at 60)
#   derived : provable by hand; an oracle expression is a cross-check
#   assumed : depends on an open G2 question (`g2:` = item number); the oracle shows our current rule
# `settings` overrides the Home defaults (angle: rad). `g2:` on a non-assumed case links the item it
# also touches. One case per line (oracle.py rewrites lines). Runner: npm run golden (app/).
cases:

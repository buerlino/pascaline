# SPDX-License-Identifier: GPL-3.0-or-later
# The units menu of the unit view (milestone 5 item 4): an empty unit slot shows it on the sheet, typing letters
# filters it (Find on units), and its Const and Tools tabs map onto the unit view (docs/04 4.3). Nothing reads this
# file yet; the unit view package does (ron).
#
# The G2's flow, our data (owner, 2026-10-13; decisions.md). From the G2, for the hand's memory: Shift + Units opens
# it, the three tabs, Prefix first, the categories in the G2's order (spec/mapping/vc-2026-10-11/menus.yaml, G2
# items 30 and 33). Everything in the grids is ours: the units, their names and sizes come from our Find index
# (qalc 5.13.1, audited against the 2019 SI and NIST SP 811 in find/units.yaml `checks`), the prefixes from the SI
# (2022, with R Q r q), the constants from CODATA 2022 (Find). The G2's own grids, spellings and derived constants
# are not copied; where Giac (the G2's CAS) has an older or wrong size, ours is the current definition.
#
# What a cell inserts: a Find unit by its id (qalc's name), or a product of them ("ft^3", "Btu/h"), the same token a
# slot reads when the name is typed. A grid is built when the index is: `first` in this order, then every other
# unit of the category's `dims` (Find's `dim`) in Find's order, without tier 1 units (Planck, atomic, solar: they
# stay findable by typing) and without `hide`. A unit in no category is found by typing only.

tabs: [Tools, Units, Const]                 # source: virtual-calc (G2 item 30)

# ---- Units tab ---------------------------------------------------------------------------------------------------
# The prefix palette: the G2's 5 × 4 places, with SI's da where the G2 writes D, then the 2022 prefixes R Q r q as a
# fifth row, so the old places do not move. Values: Find's `pfx` items (exact). Binary prefixes (Ki, Mi, ...) are
# found by typing.
prefixes:
  columns: 5
  items: [Y, Z, E, P, T, G, M, k, h, da, d, c, m, µ, n, p, f, a, z, y, R, Q, r, q]

# The categories in the G2's order, then ours (Flow, Density, Amount, Data: common engineering quantities the G2
# has no category for). `first`: the units an engineer reaches for, SI first, then the common US and imperial ones
# (our choice). `dims`: Find dimensions whose remaining tier 0 units follow. `hide`: tier 0 units left out of the
# grid (typography, pre-metric French and other non-engineering families).
categories:
  - name: Length
    dims: [m1]
    first: [m, km, cm, mm, um, nm, in, ft, yd, mi, nmi, thou, angstrom, ft_US, mi_US, au, ly, pc]
    hide: [pt, pt_TeX, sp_TeX, pica, twip, agate, ata_pica, pt_US, new_didot, dd, cicero, pied_du_roi, pouce, ligne, toise, U]
  - name: Area
    dims: [m2]
    first: [m^2, km^2, ha, a, cm^2, mm^2, in^2, ft^2, yd^2, acre, mi^2, cmil, kcmil, b]
    hide: [L/km, da]                        # L/km: fuel use, an area by dimension; da: the decare, read as the prefix
  - name: Volume
    dims: [m3]
    first: [m^3, L, mL, cm^3, mm^3, in^3, ft^3, yd^3, gal, liq_qt, liq_pt, fl_oz, gal_UK, pt_UK, fl_oz_UK, bbl, bu, fbm]
    hide: [imperial_minim, imperial_fluid_scruple, minim, fl_dr, fl_dr_UK]
  - name: Time
    dims: [s1, s-1]
    first: [s, ms, us, ns, min, h, d, week, a_j, Hz, kHz, MHz, GHz]
    hide: [Bq, Ci, Rd]                      # activity, in Radiation
  - name: Speed
    dims: [m1s-1, rad1s-1]
    first: [m/s, km/h, mph, knot, ft/s, rad/s, rpm]
  - name: Mass
    dims: [kg1]
    first: [kg, g, mg, ug, t, lb, oz, slug, s_ton, l_ton, gr, oz_t, carat, Da]
    hide: [pfund, zentner]
  - name: Acceleration
    dims: [m1s-2, rad1s-2]
    first: [m/s^2, gee, ft/s^2, Gal, rad/s^2]
  - name: Force
    dims: [kg1m1s-2]
    first: [N, kN, MN, lbf, kip, kgf, gf, ozf, dyn, pdl]
  - name: Energy
    dims: [kg1m2s-2]
    first: [J, kJ, MJ, Wh, kWh, MWh, cal, kcal, cal_IT, Btu, thm, eV, erg, ft*lbf]
    hide: [N*m, kN*m, W*h, kW*h, foe]       # N·m is torque (its own category); W*h, kW*h: Wh, kWh again; foe: astronomy
  - name: Power
    dims: [kg1m2s-3]
    first: [W, mW, kW, MW, GW, hp, PS, Btu/h, TOR, dBm, dBW]
  - name: Pressure
    dims: [kg1m-1s-2]
    first: [Pa, kPa, MPa, GPa, hPa, bar, psi, ksi, atm, Torr, mmHg, inHg, inWC, mmWC, kgf/cm^2]
    hide: [J/m^3]                           # energy density, found by typing
  - name: Temperature
    dims: [K1]
    first: [oC, K, oF, oR]
  - name: Electricity
    dims: [A1, A-1kg1m2s-3, A1s1, A-2kg1m2s-3, A2kg-1m-2s4, A-1kg1m2s-2, A-2kg1m2s-2, A2kg-1m-2s3, A-1kg1s-2]
    first: [A, mA, uA, kA, V, mV, kV, ohm, mohm, kohm, Mohm, S, C, Ah, mAh, F, mF, uF, nF, pF, H, mH, uH, nH, Wb, T, mT, uT]
    hide: [abA, abV, statV, abohm, statohm, abC, statC, abH]   # CGS electrical units, found by typing
  - name: Light
    dims: [cd1, cd1rad2, cd1m-2rad2, cd1m-2]
    first: [cd, lm, lx, fc, cd/m^2]
  - name: Angle
    dims: [rad1, rad2]
    first: [rad, deg, gra, arcmin, arcsec, tr, sr]
    hide: [deg^2]
  - name: Viscosity
    dims: [kg1m-1s-1, m2s-1]
    first: [Pa*s, cP, P, m^2/s, cSt, St]
  - name: Radiation
    dims: [m2s-2, A1kg-1s1, m2s-3]
    first: [Bq, Ci, Gy, Sv, rem, mrem, rad_radioactivity, R, Gy/s]
    hide: [J/kg, kcal/g, erg/g]             # specific energy, found by typing
  - name: Torque
    dims: []                                # the dimension of energy, listed there
    first: [N*m, kN*m, ft*lbf, in*lbf]
  - name: Flow
    dims: [m3s-1]
    first: [m^3/s, L/s, L/min, L/h, m^3/h, cfm, cfs, gpm, gph]
  - name: Density
    dims: [kg1m-3]
    first: [kg/m^3, g/cm^3, g/L, lb/ft^3]
  - name: Amount
    dims: [mol1, m-3mol1]
    first: [mol, mmol, kmol, mol/L, mol/m^3]
  - name: Data
    dims: [bit1]
    first: [bit, B, kB, MB, GB, TB, KiB, MiB, GiB, TiB, kbit, Mbit, Gbit]

# Units the grids name that Find does not have yet: the package adds them to find/units.yaml (curated units, with a
# `checks` entry each). Sizes exact from the definitions (source: oracle, mpmath).
add_to_find:
  - { id: kip, parts: "k:lbf", names: [klbf], si: "4448.2216152605", note: "1000 lbf; structural engineering" }
  - { id: fbm, parts: "ft^2 in", names: ["board foot"], si: "0.002359737216", note: "lumber" }
  - { id: Ah, parts: "A h", names: ["ampere hour"], si: "3600" }
  - { id: mAh, parts: "m:A h", names: ["milliampere hour"], si: "3.6" }
# Products of Find units, inserted as written (no Find item needed): cm^2 mm^2 yd^2 mm^3 ft^3 yd^3 ft/s ft/s^2
# Btu/h (0.29307107017222... W) in*lbf (0.1129848290276167 N·m) m^3/h g/L lb/ft^3. A check per product is the
# generator's (the dimension must be the category's).

# ---- Const tab ---------------------------------------------------------------------------------------------------
# The G2's four lists by name (G2 item 39 saw Math, Chemistry, Physics, Quantum), filled with our constants (Find
# ids, CODATA 2022), then a fifth list with every other Find constant in qalc's category order. A pick inserts the
# constant's chip (docs/04 3.6): symbol, value and unit; the number alone is UVAL below. Left out: the G2's MAXREAL
# and MINREAL (its float limits, not ours) and the ratios it derives (q/mₑ, mₚ/mₑ, the wavelength and frequency of
# 1 eV): typed from their parts they carry the current values.
constants:
  lists:
    - name: Math
      items: [e, π, i]                        # Home constants, not Find items
    - name: Chemistry
      items: [N_A, k_B, gas_constant, V_m101, StdT, StdP, faraday]
    - name: Physics
      items: [c, g_0, G, sigma, epsilon_0, mu_0]
    - name: Quantum
      items: [planck, planck2pi, q_e, m_e, m_p, m_n, alpha, phi_0, rydberg, a_0, mu_B, mu_N, lambda_C]
    - name: More
      items: generated                        # every Find constant not above
  # Ours, not in Find: the standard temperature and pressure that V_m101 goes with. The package adds them to Find's
  # constants, exact, with a `checks` entry.
  define:
    StdT: { value: "273.15", unit: K }
    StdP: { value: "101325", unit: Pa }

# ---- Tools tab ---------------------------------------------------------------------------------------------------
# The G2's six unit tools (G2 items 30 and 38) and where each lives in the unit view (docs/04 4.3). None is a
# command we add: each is a place in the unit view, so it costs no new key or menu.
tools:
  - { g2: CONVERT,   ours: "the end slot (→ should be): 5 km, end slot m → 5000 m" }
  - { g2: MKSA,      ours: "the result's one tap to the SI base form" }
  - { g2: UFACTOR,   ours: "the end slot with the target unit (100 C → A·s); the end slot must match the whole dimension" }
  - { g2: USIMPLIFY, ours: "the result rule: units typed when they fit, else SI with a prefix; the one-tap alternatives include the named unit (kg·m²/s² → J)" }
  - { g2: UPART,     ours: "a tap on the result's unit gives the unit alone (5 km → 1 km, as on the G2, item 38)" }
  - { g2: UVAL,      ours: "the result's number without its unit: the `\\res` chip into Home (docs/04 4.3, the way back); 5 km → 5 (item 38)" }

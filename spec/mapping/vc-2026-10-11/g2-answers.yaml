# Answers to inputs/g2.yaml, from the official Virtual Calculator, software 2.4.2 rev 15751 (user accepted this in place of 2.4.15515).
# Items 5 and 16 were already answered on the real G2 and are skipped. The calculator's exponent mark is a small-capital E (ᴇ).
- { n: 1, answer: "Not sorted ascending: [3. 1.26794919243 4.73205080757] (shown as a one-row vector). The input has exact eigenvalues 3 and 3±√3, so the order is the order the solver returns them in: 3, then 3-√3, then 3+√3.", how: "CAS view, default CAS settings, radians; typed eigenvals([[2.,1.,0.],[1.,3.,1.],[0.,1.,4.]]) (pasted via Edit>Paste), Enter", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { n: 2, answer: "See observations/keys.yaml (every key, four layers, printed labels). Short version: SIN, COS, TAN are the top-row keys r5c2..r5c4 (shifted: ASIN, ACOS, ATAN); x^y is r5c1 (shifted: nth root); LN r5c5 (shifted e^x), LOG r5c6 (shifted 10^x); x² is r6c1 (shifted: square root); ÷ is r7c5 (shifted x⁻¹); π is Shift on the 3 key (r9c4); i is Shift on the 2 key (r9c3); Shift is r9c1 (bottom-left block, blue), Alpha r8c1 (orange); the key marked a b/c is r4c5 (no visible effect found).", how: "keys.yaml; labels read from the keypad picture, each key pressed in four layers", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { n: 3, answer: "Yes, the cursor stays inside the template until you press → (or ↓). After x, ^, 2 the following + stays in the exponent; the same holds for the denominator of a fraction, the root sign, function brackets, e^x and ABS. The nth-root template starts in the index box and → moves to the radicand. Up in a fraction goes to the numerator.", how: "Home view, Textbook entry (default); typed with the keys, then read back with Edit>Copy; details in keys.yaml (textbook-* rows)", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { n: 4, answer: "-2 (a real number, no complex result): (-8)^(1/3) gives −2 in Home.", how: "Home, default settings (radians, Standard), typed (-8)^(1/3), Enter. A dedicated cube-root key was not used; the odd root was tested as a power, see home.yaml id cx-cbrt-neg8", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { n: 6, answer: "2x, x(x+1), 2(3+1) and (1)(2) are read as multiplication (the history echo inserts a *). With pasted one-line text, 1/2x is read as (1/2)·x (with x=0 the result is 0; 1/2(3) gives 1.5; 6/2(1+2) gives 9). Typed with the keys in Textbook entry, the x lands in the denominator unless you press → first: 1, ÷, 2, x gives 1/(2x); 1, ÷, 2, →, x gives (1/2)x.", how: "Home view; X evaluates as 0 in the Function app; Textbook entry typed by keys and one-line text pasted; keys.yaml textbook-implicit-multiplication", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { n: 7, answer: "With √5 factors: factor(x^20-1) shows (x-1)(x+1)(x²+1), four quadratics whose middle coefficients contain √5 ((±√5±1)/2 times x), and a degree-8 factor x^8-x^6+x^4-x^2+1.", how: "CAS view, default CAS settings; see cas.yaml id heavy-factor for the full text", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { n: 8, answer: "Looks like half to even, not half away from zero: 123456789012.5 shows 123,456,789,012; -123456789012.5 shows −123,456,789,012; 0.1234567890125 shows 0.123456789012; 999999999999.5 shows 1ᴇ12 (carry into the even neighbour). Caveat: the history echo already rounds the typed literal to 12 digits, so the rounding may happen at entry, not at display.", how: "Home, Standard format, default settings; each value pasted as a literal and Enter; home.yaml ids rnd-tie-*, rnd-carry", unsure: true, source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { n: 9, answer: "An error: the result position shows an 'Error: Invalid input' text, no 2*i.", how: "Home, default settings (the complex setting is the default a+b*i), typed sqrt(-4), Enter", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { n: 10, answer: "An error as well: 'Error: Invalid input' in the result position, no complex branch.", how: "Home, default settings, typed asin(2), Enter", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { n: 11, answer: "-2 (same as item 4): (-8)^(1/3) gives −2 in Home.", how: "Home, default settings, typed (-8)^(1/3), Enter", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { n: 12, answer: "x^3-3x+1=0 with guess 0 gives 0.347296355335 (message Zero); tan(x)=0 with guess 1.4 gives 0 (message Zero), the root 0 (the nearest root to 1.4 is 0 at distance 1.4; π is 1.74 away).", how: "Solve app: equation put into E1 in the Symbolic view, guess put into the unknown's field in the Numeric view, then the Solve soft key; radians. Details in solve.yaml header", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { n: 13, answer: "It returns x = 0 (the guess, at the minimum of x²+1) and the message line says 'Error: Extremum found'; no 'no root' text.", how: "Solve app, E1 x^2+1=0, guess 0, Solve soft key, Info soft key shows the message", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { n: 14, answer: "No pole message. Solve returns a huge value, 1.45989166621ᴇ499, with the message Zero.", how: "Solve app, E1 1/x=0, guess 1, Solve soft key, Info soft key shows the message", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { n: 15, answer: "Six formats: Standard, Fixed, Scientific, Engineering, Floating, Rounded. For 12345.6789 and 0.000123: Standard 12,345.6789 and 0.000123; Fixed(8) 12,345.6789000 and 0.00012300; Scientific(8) 1.23456789ᴇ4 and 1.23000000ᴇ-4; Engineering(8) 12.3456789ᴇ3 and 123.000000ᴇ-6; Floating(8) and Rounded(8) 12,345.6789 and 0.000123. The digits box is 8 for every format except Standard.", how: "Home Settings, Number Format list; each format selected, then the two numbers entered in Home. See settings.yaml. The digits box default of 8 was left unchanged", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { n: 17, answer: "1/3+1/6 shows as a stacked fraction 1/2 (clipboard text 1/2); √8 shows as 2 then a star then a root sign over 2 (clipboard text 2*√2). Typed with the keys the entry line itself showed the stacked fractions 1/3 + 1/6 and the root of 8.", how: "CAS view, Textbook entry, default CAS settings, typed with keys: 1 ÷ 3 → + 1 ÷ 6 → Enter; and Shift+x² (root sign) 8 Enter", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { n: 18, answer: "Three entry modes in Home Settings: Textbook (the default), Algebraic and RPN.", how: "Home Settings > Entry list; Algebraic was tried and put back to Textbook (RPN was only listed, not used)", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { n: 32, answer: "Shift+6 does not insert EQ directly: it opens a palette of 12 cells (3 rows x 4): row 1 <, ≤, >, ≥; row 2 ==, ≠, AND, OR; row 3 NOT, XOR, EQ, one empty cell. Choosing EQ (third cell of the bottom row; also reachable by pressing the key 3) puts the text EQ() in the entry line, with empty parentheses.", how: "Home, Textbook entry, empty entry line; Shift then 6, then key 3; entry line read via Edit>Copy (clipboard text EQ())", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-13" }
- { n: 36, answer: "After typing 2 and picking the mixed-number cell (row 3, column 2 of the template palette, a pair of tall brackets around box + stacked box over box), the entry line shows the 2 to the left, then a tall bracket group containing a plus sign and a stacked fraction with two empty slots. No separate whole-part slot appears inside the brackets: the typed 2 stays outside, in front. Clipboard text of the entry line is 2(+(()/())), i.e. 2 followed by a bracketed plus and an empty fraction.", how: "Home, Textbook entry; keys 2, Tmpl (Units-icon key, primary), down, down, right, Enter; entry line read by screen and by Edit>Copy", unsure: true, note: "which slot holds the cursor after the pick was not checked", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-13" }
- { n: 38, answer: "Both commands exist (Tools tab of Shift+Units lists CONVERT, MKSA, UFACTOR, UPART, USIMPLIFY, UVAL). UPART(5_km) shows 1_km (clipboard text 1_(km)): the unit part with coefficient 1. UVAL(5_km) shows 5: the bare number.", how: "Home, Textbook entry, radians; pasted UPART(5_km) and UVAL(5_km), Enter", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-13" }

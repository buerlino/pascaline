# Section H: app inventory of the Virtual Calculator, software 2.4.2 rev 15751. Inventory only: view names, setup screens, setting names.
# 18 apps, in the order of the Application Library grid (4 per row, scrolls). The same 18 apps appear in the Toolbox > App tab (see menus.yaml).
# Method per app: Apps key, pick the app, Start; then the Symb, Plot and Num keys, and Shift+Symb / Shift+Plot / Shift+Num (the Setup screens;
# multi-page screens were paged through with the Page soft keys, down arrow = next page). Nothing was changed in any app.
# Common to the apps that have a Symbolic Setup: it holds three settings, Angle Measure, Number Format and Complex, each showing "System" (= follow the system setting),
# except where noted. "empty screen" = a blank screen titled with the app name, with an entry line and soft keys Sto▸ and Save (the app has no such view).
# Numbers in `defaults` are what the screens showed on first visit.

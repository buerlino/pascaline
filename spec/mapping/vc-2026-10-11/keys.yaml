# ---- Textbook entry behaviour (G2 items 3 and 6), typed with the keys in the Function app Home view ----
- { id: textbook-exponent, finding: "After x^y, a following + or * stays INSIDE the exponent until Right (or Down) is pressed. Same for the fraction denominator, the root sign, function brackets (SIN(3+1), Right, then +1 gives SIN(3)+1), e^x and ABS.", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { id: textbook-fraction-arrows, finding: "In a stacked fraction Up moves from the denominator to the numerator; Right (or Down) leaves the fraction. Del removes one character at a time inside it.", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { id: textbook-nth-root, finding: "The nth-root template starts with the cursor in the index box; Right moves to the radicand; typing 3, Right, 8 reads as the cube root of 8.", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { id: textbook-implicit-multiplication, finding: "2X, X(X+1), 2(3+1) and (1)(2) are all read as multiplication; the history echo inserts a *. Typed as 1, ÷, 2, X without pressing Right, the X lands in the denominator (1/(2X)); with Right pressed first it is (1/2)X. Pasted one-line text 1/2X evaluates as (1/2)X (with X=0 the result is 0), 1/2(3) gives 1.5, 1/2pi gives 1.5708, 6/2(1+2) gives 9, -2^2 gives -4: implicit multiplication binds like an ordinary * taken left to right.", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { id: textbook-vs-one-line, finding: "Only these keys put different text into the entry line in the two modes: x^y (textbook Ans^() ; one-line Ans^), nth root (template ; ' NTHROOT '), root sign (template ; the sign), ÷ (Ans/() ; Ans/), x⁻¹ (Ans^(-1) ; Ans plus a special glyph). All other keys insert the same text.", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { id: letters-layers, finding: "Alpha gives capital letters A..Z; Shift then Alpha (lower-case layer) gives a..z. Exceptions: Alpha on the 3 key gives #, on − gives :, on 0 gives a pair of double quote marks, on + gives ;. Keys with no letter fall back to their primary function under Alpha.", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { id: empty-line-ans, finding: "On an empty entry line the operator keys x^y, x², ÷, ×, −, + and x⁻¹ insert Ans first, so the old result becomes the left operand.", source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }

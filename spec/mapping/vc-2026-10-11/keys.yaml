- { id: r1c2, primary: { label: "Symb", effect: "opens the app's Symbolic view" }, shift: { label: "↳Setup", effect: "opens the Symbolic Setup screen (Angle Measure, Number Format, Complex)" }, alpha: { effect: "same as primary" }, shift_alpha: { effect: "same as shift" }, source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }
- { id: r2c2, primary: { label: "Plot", effect: "opens the Plot view; with no function ticked a notice 'No functions checked.' with an OK soft key" }, shift: { label: "↳Setup", effect: "opens Plot Setup, page 1 of 3 (X Rng, Y Rng, X Tick, Y Tick)" }, alpha: { effect: "same as primary" }, shift_alpha: { effect: "same as shift" }, source: virtual-calc, fw: "2.4.2.15751", date: "2026-10-11" }

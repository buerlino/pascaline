# Key map of the HP Prime Virtual Calculator (G2 item 2 and section B). Facts only, in our words.
# Setup: Function app, Home view, Textbook entry (default), Radians, Standard. Entry text was read back with the window's Edit > Copy.
# Key ids r<row>c<col>: rows count down the keypad starting at the Apps/Home cluster (r1-r3 = upper cluster of 3 rows), then
#   r4 (Vars row) .. r10 (On row). Columns count left to right. Upper cluster: left column Apps/Home, 2nd column Symb/Plot/Num,
#   round pad in the middle (ids up/down/left/right), 4th column Help/View/Menu, right column Esc/CAS (r1c5 Esc, r3c5 CAS; r3c1 Home).
#   Rows r4-r6 have 6 keys except r6 (5 keys, Enter is wide, r6c5); rows r7-r10 have 5 keys (r7c1..r7c5 etc).
# Layers: primary; shift (blue label above key); alpha (orange letter); shift_alpha (lower-case letter, or the Shift function).
# "labels" = text printed on or above the key, in plain text. Icons are described in words, never copied.
# On an empty entry line the operator keys first insert Ans (shown below as "Ans..."), as the old result is the left operand.
# "Home view" below means the Function app's Home view. Doubts are marked unsure: true.


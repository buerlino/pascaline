# Section E: Solve app (Software 2.4.2 rev 15751; user accepted this instead of 2.4.15515). Radians, default settings.
# Method for every case: Solve app, Symbolic view: the equation was put into E1 (text inserted with the emulator's Edit>Paste, then Enter);
# Numeric view: the guess was put into the unknown's field (also pasted, then Enter), then the Solve soft key; the root is the value left in
# that field; `message` is what the Info soft key shows afterwards (the solver's own result line, not a help page).
# Digits were read from enlarged screenshots; field and Info box agreed in every case.
# The very first time a new unknown (x) is used, a dialog asks whether to create the undefined variable in the current app or in Home (soft keys Cancel / Home / App); App was chosen.
# The calculator's exponent mark is a small-capital E (U+1D07); negative values start with a raised minus (written - here).
# `n` is the number of the G2 checklist item the case answers.

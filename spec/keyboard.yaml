# SPDX-License-Identifier: GPL-3.0-or-later
# Logical key layout: the single source for the on-screen keyboard (app/src/keyboard/), validated by
# app/src/keyboard/keyboard.test.ts. Visual design (colours, shapes, legends' look) lives in the app, not here.
#
# Layout (P4, accepted 2026-10-11): the reference's logical grid, from black-box observation of the official
# Virtual Calculator (spec/mapping/vc-2026-10-11/keys.yaml; ids r<row>c<col> in the comments). Our rows 0-2 are
# its upper cluster (r1-r3: two key columns, the round pad in the middle as a cross, two key columns), rows 3-9
# its rows r4-r10. A row has `columns` cells unless `row_columns` says otherwise (the reference's lower rows have
# 5 wider keys); `span` makes a key wider (Enter). Cells without a key are gaps.
#
# Each key has up to three layers: primary, shift, alpha. A layer is an action, one of
#   { type: "7" }                  type characters as a physical keyboard would (smart fences apply)
#   { insert: "\\frac{#@}{#?}", sample: [latex, giac] }
#                                  insert a LaTeX template: #? is a placeholder, #@ the selection or
#                                  what is before the cursor, #0 the selection or a placeholder. Every
#                                  template needs a `sample`: the template filled in, and the Giac text it
#                                  must mean. The round-trip test runs all samples through our parser and Giac,
#                                  with Ans = 7 (SAMPLE_CHIPS in app/src/input/chips.ts).
#                                  Any action may carry `line: <action>`, used instead of it when the
#                                  one-line entry mode is on (a linear form of the same key).
#   { cmd: "moveToNextChar" }      a MathLive editing command
#   { special: shift|alpha|enter|clear|cancel|esc|app|cas|settings|apps|symb|plot|num|menu|none }   handled by the app
# Missing layer: the key does nothing in that layer, except that alpha falls back to primary.
# Empty line (docs/04 2.8, app/src/entry/ans.ts): in Home and CAS, + − × ÷ xʸ x² and x⁻¹ on an empty entry line
# insert Ans (the \ans chip) first, as on the reference; (−) stays negation. Only when the view has a result.
# Letters: Alpha types the capital in the alpha layer, Shift + Alpha its lower case (as on the reference).
# `label` entries starting with "$" are i18n keys (app/src/i18n), anything else is shown as is.
#
# Gestures (docs/decisions.md P7; app/src/keyboard/gestures.ts and Keypad.svelte; tests app/test/gestures.spec.ts):
#   Trackpad (K1): the arrow keys `up`, `down`, `left`, `right` are the tap zones of one trackpad surface. A drag
#     steps in two dimensions, one step per 12 px with a haptic tick, through the same actions as the arrow keys
#     (entry line, Plot, Num, Symb lists). A touch that makes no full step is a tap on its zone: one step, in the
#     current Shift state (shift ◀ = |◀). Steps fire while dragging, a tap when the finger lifts.
#   Hold and drag (K2, P7 revised): every other key fires when the finger lifts, not on touch. A finger held still
#     (10 px slop) for 350 ms anywhere on the keypad, gaps included, turns the keypad into the trackpad: the keys
#     dim, a haptic tick marks the start, a drag steps exactly as the trackpad does (12 px per step, a tick per
#     step; the first step uses up a one-shot Shift), and lifting the finger ends it without firing the held key.
#     A finger that slides before the hold stays a tap. A second finger, or the browser taking the touch
#     (pointercancel), ends the cursor mode; a second finger during the hold fires the first key, so two-thumb
#     typing keeps its order. Exception: `bksp` fires on touch and auto-repeats while held (after 400 ms, then
#     every 60 ms, in the layer of the first press), never the cursor.
# `source`: `virtual-calc` = position and function seen on the official simulator (row id in the comment);
# `device` = seen on a G2; `assumed` = our choice (tests/golden/G2-CHECKLIST.md).
schema: 1
columns: 6
row_columns: { 6: 5, 7: 5, 8: 5, 9: 5 }

keys:
  # ---- rows 0-2: the upper cluster. Symb / Plot / Num open the views of the current app (from Home or CAS: the
  # last app used). Help (r1c4) is a gap until built (context help). View (r2c4) has only its shift layer so far: shift View = Copy,
  # shift Menu = Paste; its primary layer is the compact keypad (K4) (docs/04-architecture.md section 5.1).
  - { id: apps, row: 0, col: 0, cls: nav, label: { primary: "$key.apps" }, primary: { special: apps }, source: virtual-calc }  # r1c1 (shift Info: not ours)
  - { id: symb, row: 0, col: 1, cls: nav, label: { primary: "$key.symb" }, primary: { special: symb }, source: virtual-calc }  # r1c2 (shift Setup: not ours)
  - { id: up, row: 0, col: 2, span: 2, cls: ctl, label: { primary: "▲" }, primary: { cmd: moveUp }, source: virtual-calc }  # pad up; on an empty entry line it selects the last history row (App.svelte)
  - { id: esc, row: 0, col: 5, cls: nav, label: { primary: "$key.esc", shift: "$key.clear" },
      primary: { special: esc }, shift: { special: clear }, source: virtual-calc }  # r1c5 (Esc clears the line / closes a list; shift Clear wipes the history)
  - { id: plot, row: 1, col: 1, cls: nav, label: { primary: "$key.plot" }, primary: { special: plot }, source: virtual-calc }  # r2c2
  - { id: left, row: 1, col: 2, cls: ctl, label: { primary: "◀", shift: "|◀" },
      primary: { cmd: moveToPreviousChar }, shift: { cmd: moveToMathfieldStart }, source: virtual-calc }  # pad left; shift is ours (not checked on the reference)
  - { id: right, row: 1, col: 3, cls: ctl, label: { primary: "▶", shift: "▶|" },
      primary: { cmd: moveToNextChar }, shift: { cmd: moveToMathfieldEnd }, source: virtual-calc }  # pad right; shift is ours (not checked on the reference)
  # View (r2c4): the compact keypad toggle comes with K4, so only the shift layer is built (shift View = Copy, docs/04 2.6, 5.1).
  - { id: view, row: 1, col: 4, cls: nav, label: { primary: "$key.view", shift: "$key.copy" },
      primary: { special: none }, shift: { special: copy }, source: virtual-calc }  # r2c4
  - { id: cancel, row: 1, col: 5, cls: ctl, label: { primary: "$key.cancel" }, primary: { special: cancel }, source: assumed }  # ours (P4 item 6): stops a running job, closes a list, else clears the line; in a gap under Esc (r2c5)
  - { id: app, row: 2, col: 0, cls: nav, label: { primary: "$key.app", shift: "$key.settings" },
      primary: { special: app }, shift: { special: settings }, source: assumed }  # at the reference's Home key (r3c1, shift Settings); ours toggles Home/CAS and leaves an app (P4 item 6)
  - { id: num, row: 2, col: 1, cls: nav, label: { primary: "$key.num" }, primary: { special: num }, source: virtual-calc }  # r3c2
  - { id: down, row: 2, col: 2, span: 2, cls: ctl, label: { primary: "▼" }, primary: { cmd: moveDown }, source: virtual-calc }  # pad down
  - { id: menu, row: 2, col: 4, cls: nav, label: { primary: "$key.menu", shift: "$key.paste" },
      primary: { special: menu }, shift: { special: paste }, source: assumed }  # at r3c4; our Menu opens the current view's menu (P4 item 6); shift Paste reads one number from the clipboard (docs/04 2.6)
  - { id: cas, row: 2, col: 5, cls: nav, label: { primary: "$key.cas", shift: "$key.settings" },
      primary: { special: cas }, shift: { special: settings }, source: virtual-calc }  # r3c5 (CAS; shift CAS Settings, ours is the one Settings sheet)

  # ---- row 3 (r4). Planned (P8, docs/04 section 5.1): Vars = Find on variables, Math = Find, shift Math = Memory,
  # Tmpl = templates, shift Tmpl = the Units app. Not built yet, so `special: none`; the Alpha letters stay.
  - { id: vars, row: 3, col: 0, cls: fn, label: { primary: "$key.vars", alpha: A }, primary: { special: none }, alpha: { type: A }, source: virtual-calc }  # r4c1 (menu not ours yet)
  - { id: math, row: 3, col: 1, cls: fn, label: { primary: "$key.math", alpha: B }, primary: { special: none }, alpha: { type: B }, source: virtual-calc }  # r4c2 (menu not ours yet)
  - { id: tmpl, row: 3, col: 2, cls: fn, label: { primary: "$key.tmpl", alpha: C }, primary: { special: none }, alpha: { type: C }, source: virtual-calc }  # r4c3 (palette not ours yet)
  # The variable key types x (the reference types the current app's variable, X in its Function app); shift y is
  # ours (the reference's shift is a Define dialog).
  - { id: x, row: 3, col: 3, cls: fn, label: { primary: x, shift: y, alpha: D }, primary: { type: x }, shift: { type: y }, alpha: { type: D }, source: virtual-calc }  # r4c4; shift y assumed
  # a b/c: as built in L2 (docs/decisions.md "Mixed numbers", assumed); the stock reference behaviour is G2 item 29.
  - id: frac
    row: 3
    col: 4
    cls: fn
    label: { primary: "a/b", alpha: E }
    primary:
      insert: "\\frac{#@}{#?}"
      sample: ["\\frac{1}{3}", "1/3"]
      line: { insert: "\\div", sample: ["1\\div3", "1/3"] }
    alpha: { type: E }
    source: assumed  # position r4c5 (virtual-calc); function ours (L2); shift (degrees-minutes-seconds) not ours
  - { id: bksp, row: 3, col: 5, cls: ctl, label: { primary: "⌫", shift: "$key.del" },
      primary: { cmd: deleteBackward }, shift: { cmd: deleteForward }, source: virtual-calc }  # r4c6; shift Del (forward) is assumed, not checked on the reference

  # ---- row 4 (r5): powers, trigonometry, logarithms
  - id: pow
    row: 4
    col: 0
    cls: fn
    label: { primary: "xʸ", shift: "ⁿ√", alpha: F }
    primary:
      insert: "#@^{#?}"
      sample: ["3^{2}", "3^2"]
      line: { insert: "\\char\"5E ", sample: ["3\\char\"5E 2", "3^2"] }
    shift: { insert: "\\sqrt[#?]{#0}", sample: ["\\sqrt[3]{8}", "surd(8,3)"] }
    alpha: { type: F }
    source: virtual-calc  # r5c1 (x^y; shift nth root, index first)
  - id: sin
    row: 4
    col: 1
    cls: fn
    label: { primary: sin, shift: "sin⁻¹", alpha: G }
    primary: { insert: "\\sin\\left(#?\\right)", sample: ["\\sin\\left(2\\right)", "sin(2)"] }
    shift: { insert: "\\arcsin\\left(#?\\right)", sample: ["\\arcsin\\left(0.5\\right)", "asin(1/2)"] }
    alpha: { type: G }
    source: virtual-calc  # r5c2
  - id: cos
    row: 4
    col: 2
    cls: fn
    label: { primary: cos, shift: "cos⁻¹", alpha: H }
    primary: { insert: "\\cos\\left(#?\\right)", sample: ["\\cos\\left(2\\right)", "cos(2)"] }
    shift: { insert: "\\arccos\\left(#?\\right)", sample: ["\\arccos\\left(0.5\\right)", "acos(1/2)"] }
    alpha: { type: H }
    source: virtual-calc  # r5c3
  - id: tan
    row: 4
    col: 3
    cls: fn
    label: { primary: tan, shift: "tan⁻¹", alpha: I }
    primary: { insert: "\\tan\\left(#?\\right)", sample: ["\\tan\\left(2\\right)", "tan(2)"] }
    shift: { insert: "\\arctan\\left(#?\\right)", sample: ["\\arctan\\left(2\\right)", "atan(2)"] }
    alpha: { type: I }
    source: virtual-calc  # r5c4
  - id: ln
    row: 4
    col: 4
    cls: fn
    label: { primary: ln, shift: "eˣ", alpha: J }
    primary: { insert: "\\ln\\left(#?\\right)", sample: ["\\ln\\left(2\\right)", "ln(2)"] }
    shift: { insert: "\\exponentialE^{#?}", sample: ["\\exponentialE^{2}", "exp(2)"] }
    alpha: { type: J }
    source: virtual-calc  # r5c5
  - id: log
    row: 4
    col: 5
    cls: fn
    label: { primary: log, shift: "10ˣ", alpha: K }
    primary: { insert: "\\log\\left(#?\\right)", sample: ["\\log\\left(100\\right)", "log10(100)"] }
    shift: { insert: "10^{#?}", sample: ["10^{2}", "10^2"] }
    alpha: { type: K }
    source: virtual-calc  # r5c6 (shift 10^x)

  # ---- row 5 (r6): square, negation, brackets, comma, Enter (two cells wide)
  - id: sq
    row: 5
    col: 0
    cls: fn
    label: { primary: "x²", shift: "√", alpha: L }
    primary:
      insert: "#@^{2}"
      sample: ["3^{2}", "3^2"]
      line: { insert: "\\char\"5E 2", sample: ["3\\char\"5E 2", "3^2"] }
    shift:
      insert: "\\sqrt{#0}"
      sample: ["\\sqrt{8}", "sqrt(8)"]
      line: { insert: "\\operatorname{sqrt}\\left(#?\\right)", sample: ["\\operatorname{sqrt}\\left(8\\right)", "sqrt(8)"] }
    alpha: { type: L }
    source: virtual-calc  # r6c1 (x²; shift root template)
  - id: neg
    row: 5
    col: 1
    cls: fn
    label: { primary: "(−)", shift: "|x|", alpha: M }
    primary: { type: "-" }
    shift: { insert: "\\left|#?\\right|", sample: ["\\left|-3\\right|", "abs(-3)"] }
    alpha: { type: M }
    source: virtual-calc  # r6c2 (negation; shift absolute value)
  - id: paren
    row: 5
    col: 2
    cls: op
    label: { primary: "( )", alpha: N }
    primary: { insert: "\\left(#0\\right)", sample: ["\\left(1+2\\right)\\times3", "(1+2)*3"] }
    alpha: { type: N }
    source: virtual-calc  # r6c3 (a matched pair; shift tick marks not ours)
  - { id: comma, row: 5, col: 3, cls: op, label: { primary: ",", alpha: O }, primary: { type: "," }, alpha: { type: O }, source: virtual-calc }  # r6c4 (shift Eval not ours)
  - { id: enter, row: 5, col: 4, span: 2, cls: enter, label: { primary: "$key.enter", shift: "≈" },
      primary: { special: enter },
      shift: { insert: "\\operatorname{approx}\\left(#?\\right)", sample: ["\\operatorname{approx}\\left(\\frac{1}{3}\\right)", "approx(1/3)"] },
      source: virtual-calc }  # r6c5 (wide; shift inserts approx())

  # ---- rows 6-9 (r7-r10): five keys per row. The ÷ key makes a stacked fraction (seen on a G2, 2026-10-11).
  - id: eex
    row: 6
    col: 0
    cls: fn
    label: { primary: "×10ⁿ", shift: "$key.sto", alpha: P }
    primary: { insert: "\\times10^{#?}", sample: ["1.5\\times10^{3}", "1.5*10^3"] }
    shift: { insert: "\\blacktriangleright", sample: ["5\\blacktriangleright A", "A:=5"] }
    alpha: { type: P }
    source: virtual-calc  # r7c1 (exponent mark, drawn as ×10^; shift store ▶: value, ▶, name)
  - { id: d7, row: 6, col: 1, cls: num, label: { primary: "7", alpha: Q }, primary: { type: "7" }, alpha: { type: Q }, source: virtual-calc }  # r7c2 (shift List not ours)
  - { id: d8, row: 6, col: 2, cls: num, label: { primary: "8", alpha: R }, primary: { type: "8" }, alpha: { type: R }, source: virtual-calc }  # r7c3 (shift { } not ours yet)
  - id: d9
    row: 6
    col: 3
    cls: num
    label: { primary: "9", shift: "∞", alpha: S }
    primary: { type: "9" }
    shift: { insert: "\\infty", sample: ["\\infty", "inf"] }
    alpha: { type: S }
    source: virtual-calc  # r7c4; shift ∞ is assumed (the reference's shift opens a symbol palette that starts with !, ∞)
  - id: div
    row: 6
    col: 4
    cls: op
    label: { primary: "÷", shift: "x⁻¹", alpha: T }
    primary:
      insert: "\\frac{#@}{#?}"
      sample: ["\\frac{5}{5}", "5/5"]
      line: { insert: "\\div", sample: ["5\\div5", "5/5"] }
    shift:
      insert: "#@^{-1}"
      sample: ["3^{-1}", "3^(-1)"]
      line: { insert: "\\left(#@\\right)^{-1}", sample: ["\\left(3\\right)^{-1}", "3^(-1)"] }
    alpha: { type: T }
    source: device  # stacked fraction seen on a G2; r7c5 (virtual-calc) for the position and shift x⁻¹

  - { id: alpha, row: 7, col: 0, cls: ctl, label: { primary: "$key.alpha" }, primary: { special: alpha }, source: virtual-calc }  # r8c1 (twice locks it, L3: ours)
  - { id: d4, row: 7, col: 1, cls: num, label: { primary: "4", alpha: U }, primary: { type: "4" }, alpha: { type: U }, source: virtual-calc }  # r8c2 (shift Matrix not ours)
  - { id: d5, row: 7, col: 2, cls: num, label: { primary: "5", alpha: V }, primary: { type: "5" }, alpha: { type: V }, source: virtual-calc }  # r8c3 (shift [ ] not ours yet)
  - { id: d6, row: 7, col: 3, cls: num, label: { primary: "6", alpha: W }, primary: { type: "6" }, alpha: { type: W }, source: virtual-calc }  # r8c4 (shift palette not ours)
  - id: mul
    row: 7
    col: 4
    cls: op
    label: { primary: "×", shift: "∡", alpha: X }
    primary: { insert: "\\times", sample: ["3\\times4", "3*4"] }
    shift: { insert: "\\mathbin{\\measuredangle}", sample: ["2\\mathbin{\\measuredangle}\\frac{\\pi}{6}", "2*(cos(pi/6)+i*sin(pi/6))"] }  # \mathbin: a following ÷ must not take the sign into its numerator
    alpha: { type: X }
    source: virtual-calc  # r8c5 (shift angle sign: polar entry r∡θ, the angle in the current angle mode; its effect is assumed, user 2026-10-11)

  - { id: shift, row: 8, col: 0, cls: ctl, label: { primary: "$key.shift" }, primary: { special: shift }, source: virtual-calc }  # r9c1
  - { id: d1, row: 8, col: 1, cls: num, label: { primary: "1", alpha: Y }, primary: { type: "1" }, alpha: { type: Y }, source: virtual-calc }  # r9c2 (shift Program not ours)
  - id: d2
    row: 8
    col: 2
    cls: num
    label: { primary: "2", shift: i, alpha: Z }
    primary: { type: "2" }
    shift: { insert: "\\imaginaryI", sample: ["2\\imaginaryI", "2*i"] }
    alpha: { type: Z }
    source: virtual-calc  # r9c3 (shift i)
  - id: d3
    row: 8
    col: 3
    cls: num
    label: { primary: "3", shift: "π", alpha: "#" }
    primary: { type: "3" }
    shift: { insert: "\\pi", sample: ["2\\pi", "2*pi"] }
    alpha: { type: "#" }
    source: virtual-calc  # r9c4 (shift π; alpha #)
  - { id: sub, row: 8, col: 4, cls: op, label: { primary: "−", alpha: ":" }, primary: { type: "-" }, alpha: { type: ":" }, source: virtual-calc }  # r9c5 (alpha :; shift Base not ours)

  - { id: fmt, row: 9, col: 0, cls: ctl, label: { primary: "$key.fmt" }, primary: { special: fmt }, source: assumed }  # at the reference's On key (r10c1); ours cycles the display format of the last result (Settings: Format key cycle)
  - { id: d0, row: 9, col: 1, cls: num, label: { primary: "0", alpha: "\"" }, primary: { type: "0" }, alpha: { type: "\"" }, source: virtual-calc }  # r10c2 (alpha: the reference inserts a pair of quotes, ours one; shift Notes not ours)
  - { id: dot, row: 9, col: 2, cls: num, label: { primary: ".", shift: "=" }, primary: { type: "." }, shift: { type: "=" }, source: virtual-calc }  # r10c3 (shift =)
  - { id: space, row: 9, col: 3, cls: num, label: { primary: "␣", shift: "_" }, primary: { type: " " }, shift: { type: "_" }, source: virtual-calc }  # r10c4 (space; shift _)
  - { id: add, row: 9, col: 4, cls: op, label: { primary: "+", shift: "Ans", alpha: ";" }, primary: { type: "+" },
      shift: { insert: "\\ans", sample: ["\\ans", "7"] }, alpha: { type: ";" }, source: virtual-calc }  # r10c5 (shift Ans, docs/04 2.8: the view's last result, read at Enter; alpha ;)

# ---- Template palette (the Tmpl key, r4c3; planned: docs/04 section 5.1, EN5 in docs/backlog.md). Layout record only:
# keyboard.ts does not read this section yet, so nothing here is shown or tested. A 6 x 3 grid in the order the
# reference shows it (seen on a G2, 2026-10-13: its Function app, Tmpl menu open, the first cell selected), listed
# row by row. `desc` is our own wording. `status: built` = the template exists on a key (`key`/`layer` say where);
# `status: planned` = not built. When EN5 builds a planned one it gets `insert` + `sample` (see the top of this
# file) and a parser rule + round-trip case in the same commit; `parser` names what parse.ts already handles.
# Uncertain readings of the photo are marked `check: true` (to confirm on the device or Virtual Calculator).
templates:
  columns: 6
  items:
    # row 1
    - { id: frac,    row: 0, col: 0, desc: "fraction",                          status: built,   key: frac, layer: primary }
    - { id: power,   row: 0, col: 1, desc: "power □^□",                         status: built,   key: pow,  layer: primary }
    - { id: evalat,  row: 0, col: 2, desc: "evaluate at: expression | variable = value", status: planned, check: true }
    - { id: deriv,   row: 0, col: 3, desc: "derivative ∂□/∂□",                  status: planned }
    - { id: cases,   row: 0, col: 4, desc: "piecewise, two lines □ if □",       status: planned }
    - { id: matrix22, row: 0, col: 5, desc: "2×2 matrix",                       status: planned, parser: "pmatrix, bmatrix" }
    # row 2
    - { id: sqrt,    row: 1, col: 0, desc: "square root",                       status: built,   key: sq,   layer: shift }
    - { id: nthroot, row: 1, col: 1, desc: "nth root",                          status: built,   key: pow,  layer: shift }
    - { id: limit,   row: 1, col: 2, desc: "limit, lim □ as □ → □",             status: planned, parser: "lim" }
    - { id: integral, row: 1, col: 3, desc: "definite integral, ∫ from □ to □ of □ ∂□", status: planned, parser: "int" }
    - { id: rowvec,  row: 1, col: 4, desc: "row matrix/vector, 1×2",            status: planned, check: true, parser: "pmatrix, bmatrix" }
    - { id: colvec,  row: 1, col: 5, desc: "column matrix/vector, 2×1",         status: planned, parser: "pmatrix, bmatrix" }
    # row 3
    - { id: abs,     row: 2, col: 0, desc: "absolute value |□|",                status: built,   key: neg,  layer: shift }
    - { id: mixed,   row: 2, col: 1, desc: "mixed number □ + □/□",              status: built,   key: frac, layer: primary, check: true }  # ours: a/b pressed twice (L2)
    - { id: sum,     row: 2, col: 2, desc: "sum Σ, □ = □ to □ of □",            status: planned, parser: "sum" }
    - { id: product, row: 2, col: 3, desc: "product Π, □ = □ to □ of □",        status: planned, parser: "prod" }
    - { id: logbase, row: 2, col: 4, desc: "logarithm with base, log_□ □",      status: planned }
    - { id: dms,     row: 2, col: 5, desc: "degrees, minutes, seconds □°□'□\"", status: planned }
  source: device

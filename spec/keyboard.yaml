# SPDX-License-Identifier: GPL-3.0-or-later
# Logical key layout: the single source for the on-screen keyboard (app/src/keyboard/), validated by
# app/src/keyboard/keyboard.test.ts. Visual design (colours, shapes) lives in the app, not here.
#
# Each key has up to three layers: primary, shift, alpha. A layer is an action, one of
#   { type: "7" }                  type characters as a physical keyboard would (smart fences apply)
#   { insert: "\\frac{#@}{#?}", sample: [latex, giac] }
#                                  insert a LaTeX template: #? is a placeholder, #@ the selection or
#                                  what is before the cursor. Every template needs a `sample`: the
#                                  template filled in, and the Giac text it must mean. The round-trip
#                                  test runs all samples through our parser and Giac.
#                                  Any action may carry `line: <action>`, used instead of it when the
#                                  one-line entry mode is on (a linear form of the same key).
#   { cmd: "moveToNextChar" }      a MathLive editing command
#   { special: shift|alpha|enter|clear|cancel|app|settings|apps|symb|plot|num|menu }   handled by the app
# Missing layer: the key does nothing in that layer, except that alpha falls back to primary. Shift + alpha
# types capital letters.
# `label` entries starting with "$" are i18n keys (app/src/i18n), anything else is shown as is.
# `source` says where the position/function came from: `assumed` = our choice, to be checked on a real
# calculator (docs: tests/golden/G2-CHECKLIST.md item 2); `device` = seen on a G2.
schema: 1
columns: 5

keys:
  # ---- row 0: apps and their views. Symb / Plot / Num open the views of the current app (from Home or CAS:
  # the last app used). Menu opens the current view's menu. Our own arrangement of the reference's logical keys.
  - { id: apps, row: 0, col: 0, cls: nav, label: { primary: "$key.apps" }, primary: { special: apps }, source: assumed }
  - { id: symb, row: 0, col: 1, cls: nav, label: { primary: "$key.symb" }, primary: { special: symb }, source: assumed }
  - { id: plot, row: 0, col: 2, cls: nav, label: { primary: "$key.plot" }, primary: { special: plot }, source: assumed }
  - { id: num, row: 0, col: 3, cls: nav, label: { primary: "$key.num" }, primary: { special: num }, source: assumed }
  - { id: menu, row: 0, col: 4, cls: nav, label: { primary: "$key.menu" }, primary: { special: menu }, source: assumed }

  # ---- row 1: modifiers, cancel, view switch, delete
  - { id: shift, row: 1, col: 0, cls: ctl, label: { primary: "$key.shift" }, primary: { special: shift }, source: assumed }
  - { id: alpha, row: 1, col: 1, cls: ctl, label: { primary: "$key.alpha" }, primary: { special: alpha }, source: assumed }
  - { id: cancel, row: 1, col: 2, cls: ctl, label: { primary: "$key.cancel" }, primary: { special: cancel }, source: assumed }
  - { id: app, row: 1, col: 3, cls: ctl, label: { primary: "$key.app", shift: "$key.settings" },
      primary: { special: app }, shift: { special: settings }, source: assumed }
  - { id: bksp, row: 1, col: 4, cls: ctl, label: { primary: "⌫", shift: "$key.clear" },
      primary: { cmd: deleteBackward }, shift: { special: clear }, source: assumed }

  # ---- row 2: cursor
  - { id: left, row: 2, col: 0, cls: ctl, label: { primary: "◀", shift: "|◀" },
      primary: { cmd: moveToPreviousChar }, shift: { cmd: moveToMathfieldStart }, source: assumed }
  - { id: up, row: 2, col: 1, cls: ctl, label: { primary: "▲" }, primary: { cmd: moveUp }, source: assumed }
  - { id: down, row: 2, col: 2, cls: ctl, label: { primary: "▼" }, primary: { cmd: moveDown }, source: assumed }
  - { id: right, row: 2, col: 3, cls: ctl, label: { primary: "▶", shift: "▶|" },
      primary: { cmd: moveToNextChar }, shift: { cmd: moveToMathfieldEnd }, source: assumed }
  - { id: abs, row: 2, col: 4, cls: fn, label: { primary: "|x|" },
      primary: { insert: "\\left|#?\\right|", sample: ["\\left|-3\\right|", "abs(-3)"] }, source: assumed }

  # ---- row 3: trigonometry and brackets
  - id: sin
    row: 3
    col: 0
    cls: fn
    label: { primary: sin, shift: "sin⁻¹", alpha: a }
    primary: { insert: "\\sin\\left(#?\\right)", sample: ["\\sin\\left(2\\right)", "sin(2)"] }
    shift: { insert: "\\arcsin\\left(#?\\right)", sample: ["\\arcsin\\left(0.5\\right)", "asin(1/2)"] }
    alpha: { type: a }
    source: assumed
  - id: cos
    row: 3
    col: 1
    cls: fn
    label: { primary: cos, shift: "cos⁻¹", alpha: b }
    primary: { insert: "\\cos\\left(#?\\right)", sample: ["\\cos\\left(2\\right)", "cos(2)"] }
    shift: { insert: "\\arccos\\left(#?\\right)", sample: ["\\arccos\\left(0.5\\right)", "acos(1/2)"] }
    alpha: { type: b }
    source: assumed
  - id: tan
    row: 3
    col: 2
    cls: fn
    label: { primary: tan, shift: "tan⁻¹", alpha: c }
    primary: { insert: "\\tan\\left(#?\\right)", sample: ["\\tan\\left(2\\right)", "tan(2)"] }
    shift: { insert: "\\arctan\\left(#?\\right)", sample: ["\\arctan\\left(2\\right)", "atan(2)"] }
    alpha: { type: c }
    source: assumed
  - { id: lpar, row: 3, col: 3, cls: op, label: { primary: "(", alpha: d }, primary: { type: "(" }, alpha: { type: d }, source: assumed }
  - { id: rpar, row: 3, col: 4, cls: op, label: { primary: ")", alpha: e }, primary: { type: ")" }, alpha: { type: e }, source: assumed }

  # ---- row 4: powers, roots, fractions, constants, comma
  - id: pow
    row: 4
    col: 0
    cls: fn
    label: { primary: "xʸ", shift: "x²", alpha: f }
    primary:
      insert: "#@^{#?}"
      sample: ["3^{2}", "3^2"]
      line: { insert: "\\char\"5E ", sample: ["3\\char\"5E 2", "3^2"] }
    shift:
      insert: "#@^{2}"
      sample: ["3^{2}", "3^2"]
      line: { insert: "\\char\"5E 2", sample: ["3\\char\"5E 2", "3^2"] }
    alpha: { type: f }
    source: assumed
  - id: sqrt
    row: 4
    col: 1
    cls: fn
    label: { primary: "√", shift: "ⁿ√", alpha: g }
    primary:
      insert: "\\sqrt{#0}"
      sample: ["\\sqrt{8}", "sqrt(8)"]
      line: { insert: "\\operatorname{sqrt}\\left(#?\\right)", sample: ["\\operatorname{sqrt}\\left(8\\right)", "sqrt(8)"] }
    shift: { insert: "\\sqrt[#?]{#0}", sample: ["\\sqrt[3]{8}", "surd(8,3)"] }
    alpha: { type: g }
    source: assumed
  - id: frac
    row: 4
    col: 2
    cls: fn
    label: { primary: "a/b", shift: "1/x", alpha: h }
    primary:
      insert: "\\frac{#@}{#?}"
      sample: ["\\frac{1}{3}", "1/3"]
      line: { insert: "\\div", sample: ["1\\div3", "1/3"] }
    shift:
      insert: "\\frac{1}{#@}"
      sample: ["\\frac{1}{3}", "1/3"]
      line: { insert: "\\left(#@\\right)^{-1}", sample: ["\\left(3\\right)^{-1}", "3^(-1)"] }
    alpha: { type: h }
    source: assumed
  - id: pi
    row: 4
    col: 3
    cls: fn
    label: { primary: "π", shift: e, alpha: i }
    primary: { insert: "\\pi", sample: ["2\\pi", "2*pi"] }
    shift: { insert: "\\exponentialE", sample: ["2\\exponentialE", "2*e"] }
    alpha: { type: i }
    source: assumed
  # shift + comma stores into a variable: it types `:=` (name first, then the value; our parser maps it to Giac assignment)
  - { id: comma, row: 4, col: 4, cls: op, label: { primary: ",", shift: "$key.sto", alpha: j },
      primary: { type: "," }, shift: { type: ":=" }, alpha: { type: j }, source: assumed }

  # ---- rows 5-8: digits and operators. The ÷ key makes a stacked fraction (seen on a G2, 2026-10-11).
  - { id: d7, row: 5, col: 0, cls: num, label: { primary: "7", alpha: k }, primary: { type: "7" }, alpha: { type: k }, source: assumed }
  - { id: d8, row: 5, col: 1, cls: num, label: { primary: "8", alpha: l }, primary: { type: "8" }, alpha: { type: l }, source: assumed }
  - { id: d9, row: 5, col: 2, cls: num, label: { primary: "9", alpha: m }, primary: { type: "9" }, alpha: { type: m }, source: assumed }
  - id: div
    row: 5
    col: 3
    cls: op
    label: { primary: "÷", alpha: n }
    primary:
      insert: "\\frac{#@}{#?}"
      sample: ["\\frac{5}{5}", "5/5"]
      line: { insert: "\\div", sample: ["5\\div5", "5/5"] }
    alpha: { type: n }
    source: device
  - id: ln
    row: 5
    col: 4
    cls: fn
    label: { primary: ln, shift: "eˣ", alpha: o }
    primary: { insert: "\\ln\\left(#?\\right)", sample: ["\\ln\\left(2\\right)", "ln(2)"] }
    shift: { insert: "\\exponentialE^{#?}", sample: ["\\exponentialE^{2}", "exp(2)"] }
    alpha: { type: o }
    source: assumed

  - { id: d4, row: 6, col: 0, cls: num, label: { primary: "4", alpha: p }, primary: { type: "4" }, alpha: { type: p }, source: assumed }
  - { id: d5, row: 6, col: 1, cls: num, label: { primary: "5", alpha: q }, primary: { type: "5" }, alpha: { type: q }, source: assumed }
  - { id: d6, row: 6, col: 2, cls: num, label: { primary: "6", alpha: r }, primary: { type: "6" }, alpha: { type: r }, source: assumed }
  - id: mul
    row: 6
    col: 3
    cls: op
    label: { primary: "×", alpha: s }
    primary: { insert: "\\times", sample: ["3\\times4", "3*4"] }
    alpha: { type: s }
    source: assumed
  - id: log
    row: 6
    col: 4
    cls: fn
    label: { primary: log, shift: "10ˣ", alpha: t }
    primary: { insert: "\\log\\left(#?\\right)", sample: ["\\log\\left(100\\right)", "log10(100)"] }
    shift: { insert: "10^{#?}", sample: ["10^{2}", "10^2"] }
    alpha: { type: t }
    source: assumed

  - { id: d1, row: 7, col: 0, cls: num, label: { primary: "1", alpha: u }, primary: { type: "1" }, alpha: { type: u }, source: assumed }
  - { id: d2, row: 7, col: 1, cls: num, label: { primary: "2", alpha: v }, primary: { type: "2" }, alpha: { type: v }, source: assumed }
  - { id: d3, row: 7, col: 2, cls: num, label: { primary: "3", alpha: w }, primary: { type: "3" }, alpha: { type: w }, source: assumed }
  - { id: sub, row: 7, col: 3, cls: op, label: { primary: "−", alpha: x }, primary: { type: "-" }, alpha: { type: x }, source: assumed }
  - id: i
    row: 7
    col: 4
    cls: fn
    label: { primary: i, shift: "∞", alpha: y }
    primary: { insert: "\\imaginaryI", sample: ["2\\imaginaryI", "2*i"] }
    shift: { insert: "\\infty", sample: ["\\infty", "inf"] }
    alpha: { type: y }
    source: assumed

  - { id: d0, row: 8, col: 0, cls: num, label: { primary: "0", alpha: z }, primary: { type: "0" }, alpha: { type: z }, source: assumed }
  - id: dot
    row: 8
    col: 1
    cls: num
    label: { primary: ".", shift: "×10ˣ" }
    primary: { type: "." }
    shift: { insert: "\\times10^{#?}", sample: ["1.5\\times10^{3}", "1.5*10^3"] }
    source: assumed
  - { id: x, row: 8, col: 2, cls: fn, label: { primary: x, shift: y }, primary: { type: x }, shift: { type: y }, source: assumed }
  - { id: add, row: 8, col: 3, cls: op, label: { primary: "+" }, primary: { type: "+" }, source: assumed }
  - { id: enter, row: 8, col: 4, cls: enter, label: { primary: "$key.enter", shift: "=" },
      primary: { special: enter }, shift: { type: "=" }, source: assumed }

# ---- Python layer (milestone 3). In the Python app's editor and shell, these keys type Python text instead of
# their normal action; keys not listed keep it (digits, letters with alpha, cursor, Enter, Cancel). A key whose
# normal action is a LaTeX template and is not listed here does nothing in Python. `label` overrides the legend
# (default: the text). All positions are our own choice (`assumed`); Python keywords are in the Menu.
python:
  - { key: abs, primary: "abs(", source: assumed }
  - { key: sin, primary: "sin(", shift: "asin(", source: assumed }
  - { key: cos, primary: "cos(", shift: "acos(", source: assumed }
  - { key: tan, primary: "tan(", shift: "atan(", source: assumed }
  - { key: lpar, primary: "(", shift: "[", source: assumed }
  - { key: rpar, primary: ")", shift: "]", source: assumed }
  - { key: pow, primary: "**", shift: "**2", source: assumed }
  - { key: sqrt, primary: "sqrt(", source: assumed }
  - { key: frac, primary: "/", shift: "//", source: assumed }
  - { key: pi, primary: "pi", shift: "e", source: assumed }
  - { key: comma, primary: ",", shift: "=", source: assumed }
  - { key: d7, primary: "7", shift: ":", source: assumed }
  - { key: d8, primary: "8", shift: "\"", source: assumed }
  - { key: d9, primary: "9", shift: "'", source: assumed }
  - { key: div, primary: "/", shift: "%", source: assumed }
  - { key: ln, primary: "log(", shift: "exp(", label: { primary: "ln" }, source: assumed }
  - { key: d4, primary: "4", shift: "{", source: assumed }
  - { key: d5, primary: "5", shift: "}", source: assumed }
  - { key: d6, primary: "6", shift: "_", source: assumed }
  - { key: mul, primary: "*", source: assumed }
  - { key: log, primary: "log10(", shift: "10**", label: { primary: "log" }, source: assumed }
  - { key: d1, primary: "1", shift: "<", source: assumed }
  - { key: d2, primary: "2", shift: ">", source: assumed }
  - { key: d3, primary: "3", shift: "!", source: assumed }
  - { key: i, primary: " ", shift: "1j", label: { primary: "␣", shift: "j" }, source: assumed }
  - { key: d0, primary: "0", shift: "    ", label: { shift: "⇥" }, source: assumed }
  - { key: dot, primary: ".", shift: "e", label: { shift: "E" }, source: assumed }
  - { key: enter, shift: "==", source: assumed }

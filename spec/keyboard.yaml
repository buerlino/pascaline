# SPDX-License-Identifier: GPL-3.0-or-later
# Logical key layout: the single source for the on-screen keyboard (app/src/keyboard/), validated by
# app/src/keyboard/keyboard.test.ts. Visual design (colours, shapes, legends' look) lives in the app, not here.
#
# Layout (P4, accepted 2026-10-11): the reference's logical grid, from black-box observation of the official
# Virtual Calculator (spec/mapping/vc-2026-10-11/keys.yaml; ids r<row>c<col> in the comments). Our rows 0-2 are
# its upper cluster (r1-r3: two key columns, the round pad in the middle as a cross, two key columns), rows 3-9
# its rows r4-r10. A row has `columns` cells unless `row_columns` says otherwise (the reference's lower rows have
# 5 wider keys); `span` makes a key wider (Enter). Cells without a key are gaps.
#
# Each key has up to three layers: primary, shift, alpha. A layer is an action, one of
#   { type: "7" }                  type characters as a physical keyboard would (smart fences apply)
#   { insert: "\\frac{#@}{#?}", sample: [latex, giac] }
#                                  insert a LaTeX template: #? is a placeholder (always empty: a selection is
#                                  discarded), #@ the selection or what is before the cursor, #0 the selection
#                                  or a placeholder. A SELECTION IS THE ARGUMENT OF THE KEY (R17): the main
#                                  argument slot of a template must be #0 (or #@ for a prefix argument such as
#                                  the numerator of a fraction or the base of a power), never #?; #? is only for
#                                  slots that are not the main argument (the index of an nth root, a denominator,
#                                  the second operand). Keys with no argument slot (constants, operators, the
#                                  exponent mark, store) replace the selection, as typing does; they are listed
#                                  with a reason in NO_ARGUMENT in app/src/keyboard/keyboard.test.ts. A power key
#                                  (#@^ or the one-line caret) brackets a selection that is not one plain term
#                                  (EntryController.run). With nothing selected every key is unchanged.
#                                  Tests: keyboard.test.ts (every template) and app/test/selection.spec.ts
#                                  (every key and layer pressed with 1+2 selected). Every
#                                  template needs a `sample`: the template filled in, and the Giac text it
#                                  must mean. The round-trip test runs all samples through our parser and Giac,
#                                  with Ans = 7 (SAMPLE_CHIPS in app/src/input/chips.ts).
#                                  Any action may carry `line: <action>`, used instead of it when the
#                                  one-line entry mode is on (a linear form of the same key).
#   { cmd: "moveToNextChar" }      a MathLive editing command
#   { special: shift|alpha|enter|clear|esc|home|cas|switch|settings|mode|apps|symb|plot|num|menu|copy|paste|tmpl|relations|symbols|none }
#                                  handled by the app (home, cas: go to that view, from an app too; switch: Home <-> CAS,
#                                  or back to Home/CAS from an app; apps, symb, plot, num, menu: the status line's
#                                  controls, R15c1, and what a user key may hold)
# User keys (R15b, R15c): a key with `user: true` is a free key (U1-U6). Its layers here are only its defaults: the
# user's own action for a layer (Settings > User keys, from Find, R4b) replaces the default, stored with a stamp in
# IndexedDB (app/src/keyboard/userKeys.svelte.ts). A user key has three slots, tap, Shift and Alpha (R15c3), all empty
# here; the Alpha slot is the user's own text, exempt from the letter-case rule below, and has no letter line in the cluster.
# Missing layer: the key does nothing in that layer, except that alpha falls back to primary.
# Empty line (docs/04 2.8, app/src/entry/ans.ts): in Home and CAS, + − × ÷ xʸ x², x⁻¹ and Store ▶ (Shift + ᴇ) on an empty
# entry line insert Ans (the \ans chip) first, as on the reference; (−) stays negation. Only when the view has a result.
# Letters: Alpha types the capital in the alpha layer, Shift + Alpha its lower case (as on the reference); in the CAS
# view the case is swapped (R58): Alpha alone is lower case, Shift + Alpha the capital.
# `label` entries starting with "$" are i18n keys (app/src/i18n), anything else is shown as is.
#
# Gestures (docs/decisions.md P7, P11; app/src/keyboard/gestures.ts and Keypad.svelte; tests app/test/gestures.spec.ts
# and app/test/flicks.spec.ts):
#   Trackpad (K1): the arrow keys `up`, `down`, `left`, `right` are the tap zones of one trackpad surface. A drag
#     steps in two dimensions, one step per 12 px with a haptic tick, through the same actions as the arrow keys
#     (entry line, Plot, Num, Symb lists). A touch that makes no full step is a tap on its zone: one step, in the
#     current Shift state. Steps fire while dragging, a tap when the finger lifts. The surface is drawn round (R15c),
#     with a dashed hub ring at its centre: a drag may start there; a tap on it does nothing.
#   Flicks (R9, P7 points 2 and 3): every other key fires when the finger lifts. A slide of 20 px up or down from
#     the touch point (mostly vertical) arms a flick: up = the key's `shift` layer, down = its `alpha` layer (the
#     capital; in the CAS view the lower case, R58), whatever Shift and Alpha are set to. Distance alone decides: no hold time and no dwell, so one fast
#     press-slide-lift is a flick. While armed, a bubble above the key shows what the lift fires (✕ = nothing) and a
#     haptic tick marks the threshold; sliding back within 12 px of the touch point cancels (nothing fires). A
#     sideways slip or a long hold is still a tap. No left/right flicks; the trackpad and `bksp` have none.
#     Legends: the shift layer at the top left of the key, the letter at the bottom left.
#     Lock flicks: up on `shift` = shift lock; down on `alpha` = capitals lock, up on `alpha` = lower-case lock; the
#     same flick again, or a tap on that key, unlocks. Taps on Shift and Alpha stay one-shot (Alpha twice locks).
#     In a sheet a flick down types the key's letter into the filter on any key; a flick up does nothing there.
#   A second finger fires the first key at once, so two-thumb typing keeps its order; the browser taking the touch
#     (pointercancel) types nothing. There is no hold-and-drag cursor (removed by P11). Exception: `bksp` fires on
#     touch and auto-repeats while held (after 400 ms, then every 60 ms, in the layer of the first press).
# `source`: `virtual-calc` = position and function seen on the official simulator (row id in the comment);
# `device` = seen on a G2; `assumed` = our choice (tests/golden/G2-CHECKLIST.md).
schema: 1
columns: 6
row_columns: { 6: 5, 7: 5, 8: 5, 9: 5 }

keys:
  # ---- rows 0-2: the upper cluster, R3 (decisions.md "R15c", chosen by the owner 2026-10-17; built in R15c2). Three bands
  # of two columns: the free keys U1-U6 (`user: true`, all empty, set from Find, R4b), the round pad (one drag surface with
  # a dashed hub, no OK; Keypad.svelte) and the editing wing, read in pairs level with the pad: View | Esc, Undo | Copy,
  # ⇤ | ⇥. Apps, Menu and the views are on the status line (R15c1); Mode is on its chips. There is no Cancel key: Esc
  # stops a running job, closes Settings, goes back one sheet level, drops a picked row, else clears the line. Only Esc
  # (r1c5) and the pad keep their G2 cells; every other key here is ours (`assumed`). After R15c the cluster is fixed
  # like the maths keys (docs/03 rule 8).
  - { id: u1, row: 0, col: 0, cls: nav, user: true, label: { primary: "$key.user" }, primary: { special: none }, source: assumed }
  - { id: u2, row: 0, col: 1, cls: nav, user: true, label: { primary: "$key.user" }, primary: { special: none }, source: assumed }
  - { id: up, row: 0, col: 2, span: 2, cls: ctl, label: { primary: "▲" }, primary: { cmd: moveUp }, source: virtual-calc }  # pad up; on an empty entry line it selects the last history row (App.svelte)
  # View: results mode (P16, R53) on the tap, Help (milestone 6) on Shift; neither is built, so the key is drawn dimmed.
  - { id: view, row: 0, col: 4, cls: nav, label: { primary: "$key.view", shift: "$key.help" },
      primary: { special: none }, shift: { special: none }, source: assumed }
  - { id: esc, row: 0, col: 5, cls: nav, label: { primary: "$key.esc", shift: "$key.clear" },
      primary: { special: esc }, shift: { special: clear }, source: virtual-calc }  # r1c5; Esc also takes the old Cancel key's jobs (R15c point 3); shift Clear wipes the history on an empty line
  - { id: u3, row: 1, col: 0, cls: nav, user: true, label: { primary: "$key.user" }, primary: { special: none }, source: assumed }
  - { id: u4, row: 1, col: 1, cls: nav, user: true, label: { primary: "$key.user" }, primary: { special: none }, source: assumed }
  - { id: left, row: 1, col: 2, cls: ctl, label: { primary: "◀" },
      primary: { cmd: moveToPreviousChar }, source: virtual-calc }  # pad left; no shift layer (P12 point 7)
  - { id: right, row: 1, col: 3, cls: ctl, label: { primary: "▶" },
      primary: { cmd: moveToNextChar }, source: virtual-calc }  # pad right; no shift layer (P12 point 7)
  # Undo | Redo: the entry line's own history (P13, R16; a chip comes back with its own value).
  - { id: undo, row: 1, col: 4, cls: nav, label: { primary: "$key.undo", shift: "$key.redo" },
      primary: { cmd: undo }, shift: { cmd: redo }, source: assumed }
  # Copy | Paste (docs/04 2.6): the last result's full value, or the picked row's; Paste reads one number.
  - { id: copy, row: 1, col: 5, cls: nav, label: { primary: "$key.copy", shift: "$key.paste" },
      primary: { special: copy }, shift: { special: paste }, source: assumed }
  - { id: u5, row: 2, col: 0, cls: nav, user: true, label: { primary: "$key.user" }, primary: { special: none }, source: assumed }
  - { id: u6, row: 2, col: 1, cls: nav, user: true, label: { primary: "$key.user" }, primary: { special: none }, source: assumed }
  - { id: down, row: 2, col: 2, span: 2, cls: ctl, label: { primary: "▼" }, primary: { cmd: moveDown }, source: virtual-calc }  # pad down
  # ⇤ | ⇥: the start and end of the line; Shift: the start and end of the box the cursor is in (a numerator, an exponent).
  - { id: lstart, row: 2, col: 4, cls: nav, label: { primary: "⇤", shift: "⇤□" },
      primary: { cmd: moveToMathfieldStart }, shift: { cmd: moveToGroupStart }, source: assumed }
  - { id: lend, row: 2, col: 5, cls: nav, label: { primary: "⇥", shift: "□⇥" },
      primary: { cmd: moveToMathfieldEnd }, shift: { cmd: moveToGroupEnd }, source: assumed }

  # ---- row 3 (r4). P8, docs/04 section 5.1: Vars = Find on variables (R4b), Math = Find (R4a), shift Math = Memory
  # (R4b); shift Tmpl = the unit view (not built yet). The Alpha letters stay. Tmpl opens the template palette (R10,
  # `templates:` below).
  - { id: vars, row: 3, col: 0, cls: fn, label: { primary: "$key.vars", alpha: A }, primary: { special: vars }, alpha: { type: A }, source: virtual-calc }  # r4c1; Find on the user's variables and functions (R4b, docs/04 5.1)
  - { id: math, row: 3, col: 1, cls: fn, label: { primary: "$key.math", shift: "$key.memory", alpha: B }, primary: { special: find }, shift: { special: memory }, alpha: { type: B }, source: virtual-calc }  # r4c2; Find, everything (R4a); Shift = Memory, the reference's Mem (R4b, docs/04 5.1)
  - { id: tmpl, row: 3, col: 2, cls: fn, label: { primary: "$key.tmpl", alpha: C }, primary: { special: tmpl }, alpha: { type: C }, source: virtual-calc }  # r4c3 (the palette: seen on a G2, 2026-10-13)
  # The variable key types x (the reference types the current app's variable, X in its Function app); shift y is
  # ours (the reference's shift is a Define dialog).
  - { id: x, row: 3, col: 3, cls: fn, label: { primary: x, shift: y, alpha: D }, primary: { type: x }, shift: { type: y }, alpha: { type: D }, source: virtual-calc }  # r4c4; shift y assumed
  # a b/c (R10, P11): on an empty Home or CAS line it switches the last result between its forms (decimal ↔ fraction,
  # as on the owner's G2, 2026-10-13, G2 item 29; a+bi ↔ polar is ours; no setting, app/src/state/
  # displayMode.ts). While typing it inserts the stacked fraction (ours: the G2 does nothing there). The mixed number
  # is in the Tmpl palette.
  - id: frac
    row: 3
    col: 4
    cls: fn
    label: { primary: "a b/c", alpha: E }
    primary:
      insert: "\\frac{#@}{#?}"
      sample: ["\\frac{1}{3}", "1/3"]
      line: { insert: "\\div", sample: ["1\\div3", "1/3"] }
    alpha: { type: E }
    source: device  # position r4c5 (virtual-calc); the empty-line cycle seen on a G2; the insert while typing is ours; shift (degrees-minutes-seconds) not ours
  - { id: bksp, row: 3, col: 5, cls: ctl, label: { primary: "⌫", shift: "$key.del" },
      primary: { cmd: deleteBackward }, shift: { cmd: deleteForward }, source: virtual-calc }  # r4c6; shift Del (forward) is assumed, not checked on the reference

  # ---- row 4 (r5): powers, trigonometry, logarithms
  - id: pow
    row: 4
    col: 0
    cls: fn
    label: { primary: "xʸ", shift: "ⁿ√", alpha: F }
    primary:
      insert: "#@^{#?}"
      sample: ["3^{2}", "3^2"]
      line: { insert: "\\char\"5E ", sample: ["3\\char\"5E 2", "3^2"] }
    shift: { insert: "\\sqrt[#?]{#0}", sample: ["\\sqrt[3]{8}", "surd(8,3)"] }
    alpha: { type: F }
    source: virtual-calc  # r5c1 (x^y; shift nth root, index first)
  - id: sin
    row: 4
    col: 1
    cls: fn
    label: { primary: sin, shift: "sin⁻¹", alpha: G }
    primary: { insert: "\\sin\\left(#0\\right)", sample: ["\\sin\\left(2\\right)", "sin(2)"] }
    shift: { insert: "\\arcsin\\left(#0\\right)", sample: ["\\arcsin\\left(0.5\\right)", "asin(1/2)"] }
    alpha: { type: G }
    source: virtual-calc  # r5c2
  - id: cos
    row: 4
    col: 2
    cls: fn
    label: { primary: cos, shift: "cos⁻¹", alpha: H }
    primary: { insert: "\\cos\\left(#0\\right)", sample: ["\\cos\\left(2\\right)", "cos(2)"] }
    shift: { insert: "\\arccos\\left(#0\\right)", sample: ["\\arccos\\left(0.5\\right)", "acos(1/2)"] }
    alpha: { type: H }
    source: virtual-calc  # r5c3
  - id: tan
    row: 4
    col: 3
    cls: fn
    label: { primary: tan, shift: "tan⁻¹", alpha: I }
    primary: { insert: "\\tan\\left(#0\\right)", sample: ["\\tan\\left(2\\right)", "tan(2)"] }
    shift: { insert: "\\arctan\\left(#0\\right)", sample: ["\\arctan\\left(2\\right)", "atan(2)"] }
    alpha: { type: I }
    source: virtual-calc  # r5c4
  - id: ln
    row: 4
    col: 4
    cls: fn
    label: { primary: ln, shift: "eˣ", alpha: J }
    primary: { insert: "\\ln\\left(#0\\right)", sample: ["\\ln\\left(2\\right)", "ln(2)"] }
    shift: { insert: "\\exponentialE^{#0}", sample: ["\\exponentialE^{2}", "exp(2)"] }
    alpha: { type: J }
    source: virtual-calc  # r5c5
  - id: log
    row: 4
    col: 5
    cls: fn
    label: { primary: log, shift: "10ˣ", alpha: K }
    primary: { insert: "\\log\\left(#0\\right)", sample: ["\\log\\left(100\\right)", "log10(100)"] }
    shift: { insert: "10^{#0}", sample: ["10^{2}", "10^2"] }
    alpha: { type: K }
    source: virtual-calc  # r5c6 (shift 10^x)

  # ---- row 5 (r6): square, negation, brackets, comma, Enter (two cells wide)
  - id: sq
    row: 5
    col: 0
    cls: fn
    label: { primary: "x²", shift: "√", alpha: L }
    primary:
      insert: "#@^{2}"
      sample: ["3^{2}", "3^2"]
      line: { insert: "\\char\"5E 2", sample: ["3\\char\"5E 2", "3^2"] }
    shift:
      insert: "\\sqrt{#0}"
      sample: ["\\sqrt{8}", "sqrt(8)"]
      line: { insert: "\\operatorname{sqrt}\\left(#0\\right)", sample: ["\\operatorname{sqrt}\\left(8\\right)", "sqrt(8)"] }
    alpha: { type: L }
    source: virtual-calc  # r6c1 (x²; shift root template)
  - id: neg
    row: 5
    col: 1
    cls: fn
    label: { primary: "(−)", shift: "|x|", alpha: M }
    primary: { type: "-" }
    shift: { insert: "\\left|#0\\right|", sample: ["\\left|-3\\right|", "abs(-3)"] }
    alpha: { type: M }
    source: virtual-calc  # r6c2 (negation; shift absolute value)
  - id: paren
    row: 5
    col: 2
    cls: op
    label: { primary: "( )", alpha: N }
    primary: { insert: "\\left(#0\\right)", sample: ["\\left(1+2\\right)\\times3", "(1+2)*3"] }
    alpha: { type: N }
    source: virtual-calc  # r6c3 (a matched pair; shift tick marks not ours)
  - { id: comma, row: 5, col: 3, cls: op, label: { primary: ",", alpha: O }, primary: { type: "," }, alpha: { type: O }, source: virtual-calc }  # r6c4 (shift Eval not ours)
  - { id: enter, row: 5, col: 4, span: 2, cls: enter, label: { primary: "$key.enter", shift: "≈" },
      primary: { special: enter },
      shift: { insert: "\\operatorname{approx}\\left(#0\\right)", sample: ["\\operatorname{approx}\\left(\\frac{1}{3}\\right)", "approx(1/3)"] },
      source: virtual-calc }  # r6c5 (wide; shift inserts approx())

  # ---- rows 6-9 (r7-r10): five keys per row. The ÷ key makes a stacked fraction (seen on a G2, 2026-10-11).
  - id: emark
    row: 6
    col: 0
    cls: fn
    label: { primary: "$key.emark", shift: "$key.sto", alpha: P }
    # the exponent mark ᴇ as one token (R14, P12 point 4): 1.5ᴇ-3 = 1.5·10⁻³; on an empty line it starts with 1 (1ᴇ)
    primary: { insert: "\\emark", sample: ["1.5\\emark-3", "1.5*10^(-3)"] }
    shift: { insert: "\\blacktriangleright", sample: ["5\\blacktriangleright A", "A:=5"] }
    alpha: { type: P }
    source: virtual-calc  # r7c1 (exponent mark ᴇ, a leading 1 on an empty line; shift store ▶: value, ▶, name)
  - { id: d7, row: 6, col: 1, cls: num, label: { primary: "7", alpha: Q }, primary: { type: "7" }, alpha: { type: Q }, source: virtual-calc }  # r7c2 (shift List not ours)
  # Shift + 8: the list braces { } (R54; docs/04 5.1), a template whose body is a comma-separated list
  - id: d8
    row: 6
    col: 2
    cls: num
    label: { primary: "8", shift: "{ }", alpha: R }
    primary: { type: "8" }
    shift:
      insert: "\\left\\{#0\\right\\}"
      sample: ["\\left\\{1,2,3\\right\\}", "list[1,2,3]"]
      line: { insert: "\\left\\{#0\\right\\}", sample: ["\\left\\{1,2,3\\right\\}", "list[1,2,3]"] }
    alpha: { type: R }
    source: virtual-calc  # r7c3 (shift { }, the list template)
  - { id: d9, row: 6, col: 3, cls: num, label: { primary: "9", shift: "α∞", alpha: S }, primary: { type: "9" },
      shift: { special: symbols }, alpha: { type: S }, source: device }  # r7c4; shift opens the symbol and Greek palette (`symbols:` below; the owner's G2, 2026-10-13, R18)
  - id: div
    row: 6
    col: 4
    cls: op
    label: { primary: "÷", shift: "x⁻¹", alpha: T }
    primary:
      insert: "\\frac{#@}{#?}"
      sample: ["\\frac{5}{5}", "5/5"]
      line: { insert: "\\div", sample: ["5\\div5", "5/5"] }
    shift:
      insert: "#@^{-1}"
      sample: ["3^{-1}", "3^(-1)"]
      line: { insert: "\\left(#@\\right)^{-1}", sample: ["\\left(3\\right)^{-1}", "3^(-1)"] }
    alpha: { type: T }
    source: device  # stacked fraction seen on a G2; r7c5 (virtual-calc) for the position and shift x⁻¹

  - { id: alpha, row: 7, col: 0, cls: ctl, label: { primary: "$key.alpha" }, primary: { special: alpha }, source: virtual-calc }  # r8c1 (twice locks it, L3: ours)
  - { id: d4, row: 7, col: 1, cls: num, label: { primary: "4", alpha: U }, primary: { type: "4" }, alpha: { type: U }, source: virtual-calc }  # r8c2 (shift Matrix not ours)
  - { id: d5, row: 7, col: 2, cls: num, label: { primary: "5", alpha: V }, primary: { type: "5" }, alpha: { type: V }, source: virtual-calc }  # r8c3 (shift [ ] not ours yet)
  - { id: d6, row: 7, col: 3, cls: num, label: { primary: "6", shift: "≤≠", alpha: W }, primary: { type: "6" },
      shift: { special: relations }, alpha: { type: W }, source: device }  # r8c4; shift opens the relations and logic palette (`relations:` below; the owner's G2, 2026-10-13, R18)
  - id: mul
    row: 7
    col: 4
    cls: op
    label: { primary: "×", shift: "∡", alpha: X }
    primary: { insert: "\\times", sample: ["3\\times4", "3*4"] }
    shift: { insert: "\\mathbin{\\measuredangle}", sample: ["2\\mathbin{\\measuredangle}\\frac{\\pi}{6}", "2*(cos(pi/6)+i*sin(pi/6))"] }  # \mathbin: a following ÷ must not take the sign into its numerator
    alpha: { type: X }
    source: virtual-calc  # r8c5 (shift angle sign: polar entry r∡θ, the angle in the current angle mode; its effect is assumed, user 2026-10-11)

  - { id: shift, row: 8, col: 0, cls: ctl, label: { primary: "$key.shift" }, primary: { special: shift }, source: virtual-calc }  # r9c1
  - { id: d1, row: 8, col: 1, cls: num, label: { primary: "1", alpha: Y }, primary: { type: "1" }, alpha: { type: Y }, source: virtual-calc }  # r9c2 (shift Program not ours)
  - id: d2
    row: 8
    col: 2
    cls: num
    label: { primary: "2", shift: i, alpha: Z }
    primary: { type: "2" }
    shift: { insert: "\\imaginaryI", sample: ["2\\imaginaryI", "2*i"] }
    alpha: { type: Z }
    source: virtual-calc  # r9c3 (shift i)
  - id: d3
    row: 8
    col: 3
    cls: num
    label: { primary: "3", shift: "π", alpha: "#" }
    primary: { type: "3" }
    shift: { insert: "\\pi", sample: ["2\\pi", "2*pi"] }
    alpha: { type: "#" }
    source: virtual-calc  # r9c4 (shift π; alpha #)
  - { id: sub, row: 8, col: 4, cls: op, label: { primary: "−", alpha: ":" }, primary: { type: "-" }, alpha: { type: ":" }, source: virtual-calc }  # r9c5 (alpha :; shift Base not ours)

  - { id: fmt, row: 9, col: 0, cls: ctl, label: { primary: "$key.fmt", shift: "$key.mode" }, primary: { special: fmt }, shift: { special: mode }, source: assumed }  # at the reference's On key (r10c1); ours cycles the display format of the last result (Settings: Format key cycle); Shift opens Mode on Angle (R85, assumed: a free Shift cell, docs/04 5.1)
  - { id: d0, row: 9, col: 1, cls: num, label: { primary: "0" }, primary: { type: "0" }, alpha: { special: none }, source: virtual-calc }  # r10c2 (no quote mark, P12 point 8; alpha is dead, not 0; shift Notes not ours)
  - { id: dot, row: 9, col: 2, cls: num, label: { primary: ".", shift: "=" }, primary: { type: "." }, shift: { type: "=" }, source: virtual-calc }  # r10c3 (shift =)
  - { id: space, row: 9, col: 3, cls: num, label: { primary: "␣", shift: "_" }, primary: { type: " " }, shift: { type: "_" }, source: virtual-calc }  # r10c4 (space; shift _)
  - { id: add, row: 9, col: 4, cls: op, label: { primary: "+", shift: "Ans", alpha: ";" }, primary: { type: "+" },
      shift: { insert: "\\ans", sample: ["\\ans", "7"] }, alpha: { type: ";" }, source: virtual-calc }  # r10c5 (shift Ans, docs/04 2.8: the view's last result, read at Enter; alpha ;)

# ---- Unit slot (P11 "units after the formula", milestone 5; docs/archive/r7-unit-slots.md). Layout record only:
# keyboard.ts does not read this section yet; tools/probes/unit-presses.mjs reads it to count presses. The app bundles
# this file whole, so the reasons live in these comments, not in strings.
# The units key (Shift + Tmpl, or a flick up on Tmpl) on an entry line or a picked history row shows the same
# formula with an empty unit slot after every number, and an optional end slot "→ should be" (empty = no check).
# On an empty line it opens a single slot with the quantity 1, and the end slot (a unit check: `kg·m²/s³ → W`).
# A quick conversion types the number first (`72`, units key, `km/h`).
# Nothing on the keypad moves (docs/03 rule 8): inside a slot only the layers listed here change what they do. A
# key not listed does nothing in a slot (sin, ln, Vars, the variable key, …).
#   letters   the alpha letter of every key (A on Vars … Z on 2), at its fixed position; case is part of the symbol.
#             Outside a slot a flick down types the capital and a flick up is the shift function (P11); inside, a
#             flick down types the lower case and a flick up the capital. The G2 sequences keep working (docs/03
#             rule 6): Alpha, key = capital; Shift, Alpha, key = lower case; the Alpha lock works as outside.
#   symbols   fixed cells, a tap types the symbol (these keys' taps mean nothing in a unit):
#             µ on (−): µ is the Greek m, and the key carries M. Inside an exponent (−) stays minus.
#             Ω on the comma: Ω is the Greek O, and the key carries O.
#             ° on a b/c: the reference's shift a b/c enters degrees, minutes, seconds. ° alone is the angle
#             degree; °C and °F take the letter after it.
#   ops       keys that keep their meaning, read as unit algebra. × = product, needed between units (`ms` is the
#             millisecond; m·s needs ×, as the SI Brochure 5.2 asks). ÷ = per: the rest of the slot is the
#             denominator (J/(kg·K) = J ÷ k g × K); on an empty slot it means 1/…. x² and xʸ: the power of the unit
#             before. Shift ÷ (x⁻¹): its inverse. Shift x² (√): a root (nV/√Hz).
#   exponent_leave: auto  an exponent holds digits, (−) and . only; any other key leaves it first (no ▶ needed).
#   digits    only in an exponent (a number belongs in the formula, before the slot).
#   nav       ◀ the previous slot, ▶ the next one and after the last the end slot (never through the formula; a
#             tap on the formula still puts the cursor there). Enter evaluates from any slot. Esc leaves the unit
#             view and keeps the slots with the line. Math opens Find on units, for what letters cannot type
#             (Å, ′, ″, %, mmH₂O).
#   reading   (the units-mode parser, milestone 5; shown live under the slot) a factor is one symbol: an exact
#             symbol from Find's unit list first (min, Pa, ft, cd, kWh), then prefix + symbol (km, µF). A prefixed
#             unit outside Find's list (Mm, Ms, MA, mPa) is read but its reading is marked. Anything else is an
#             error that names the factor and offers the near symbols (kw: kW?). A prefix alone (k, M, G) is an
#             error, never a constant (qalc reads G as the gravitational constant).
# `source: assumed`: ours (P11, 2026-10-13); the units key position is the reference's (G2 item 30).
# P14 (decided 2026-10-14, docs/archive/r9-unit-pad.md) replaces letters, symbols and ops with the unit pad in
# spec/unit-pad.yaml; package R24c removes them here.
unit_slot:
  letters: { flick_down: lower, flick_up: upper }
  symbols:
    - { key: neg, tap: "µ" }
    - { key: comma, tap: "Ω" }
    - { key: frac, tap: "°" }
  ops:
    - { text: "·", keys: [mul] }
    - { text: "/", keys: [div] }
    - { text: "²", keys: [sq] }
    - { text: "^", keys: [pow] }
    - { text: "⁻¹", keys: [shift, div] }
    - { text: "√", keys: [shift, sq] }
  exponent_leave: auto
  find: math
  source: assumed

# ---- Template palette (the Tmpl key, r4c3; R10). A 6 x 3 grid in the order the reference shows it (seen on a G2,
# 2026-10-13: its Function app, Tmpl menu open, the first cell selected), listed row by row. keyboard.ts reads this
# section (`palette`); Tmpl opens it on the sheet (app/src/views/sheet.svelte.ts, grid variant): ▲ ▼ ◀ ▶ move in two
# dimensions, Enter or a tap inserts, the last pick is remembered (Tmpl, Enter repeats it), Esc and Cancel close.
# `desc` is our own wording, shown through i18n (`tmpl.<id>`). An item is either the template of a key (`key` and
# `layer`: the same action, its one-line form included) or its own `insert` + `sample` (as for keys, see the top of
# this file). Every `insert` has its parser rule (app/src/input/parse.ts), its round trip (the keyboard test runs
# every sample) and a case in tests/golden/parser.yaml. `check: true` = our reading of the photo, to confirm on the
# device (G2 checklist). In a template, ▶ goes to the next empty box (EntryController), as the arrows walk the boxes
# on the reference.
# Our forms: the boxes of lim, Σ and Π are bracketed, so a body like x+1 stays in its box; evaluate-at brackets the
# expression with a sized bar; the piecewise lines read "value if condition"; DMS uses °, ′ and ″ on the line (not
# raised, so typing after the seconds stays on the line), and means degrees in every angle mode.
templates:
  columns: 6
  items:
    # row 1
    - { id: frac,     row: 0, col: 0, desc: "fraction", key: frac, layer: primary }
    - { id: power,    row: 0, col: 1, desc: "power □^□", key: pow, layer: primary }
    - id: evalat
      row: 0
      col: 2
      desc: "evaluate at: expression | variable = value"
      insert: "\\left.#0\\right|_{#?=#?}"
      sample: ["\\left.x^2\\right|_{x=3}", "subst(x^2,x=3)"]
    - id: deriv
      row: 0
      col: 3
      desc: "derivative ∂□/∂□"
      insert: "\\frac{\\partial#0}{\\partial#?}"
      sample: ["\\frac{\\partial x^2}{\\partial x}", "diff(x^2,x)"]
    - id: cases
      row: 0
      col: 4
      desc: "piecewise, two lines □ if □"
      insert: "\\begin{cases}#? & \\text{if }#?\\\\ #? & \\text{if }#?\\end{cases}"
      sample: ["\\begin{cases}x & \\text{if }x=0\\\\ 1 & \\text{if }x=1\\end{cases}", "piecewise(x==0,x,x==1,1)"]
    - id: matrix22
      row: 0
      col: 5
      desc: "2×2 matrix"
      insert: "\\begin{pmatrix}#? & #?\\\\ #? & #?\\end{pmatrix}"
      sample: ["\\begin{pmatrix}1 & 2\\\\ 3 & 4\\end{pmatrix}", "[[1,2],[3,4]]"]
    # row 2
    - { id: sqrt,     row: 1, col: 0, desc: "square root", key: sq, layer: shift }
    - { id: nthroot,  row: 1, col: 1, desc: "nth root", key: pow, layer: shift }
    - id: limit
      row: 1
      col: 2
      desc: "limit, lim □ as □ → □"
      insert: "\\lim_{#?\\to#?}\\left(#0\\right)"
      sample: ["\\lim_{x\\to0}\\left(\\frac{\\sin\\left(x\\right)}{x}\\right)", "limit(sin(x)/x,x,0)"]
    - id: integral
      row: 1
      col: 3
      desc: "definite integral, ∫ from □ to □ of □ ∂□"
      insert: "\\int_{#?}^{#?}#0\\,\\mathrm{d}#?"
      sample: ["\\int_{-1}^{10}x^2\\,\\mathrm{d}x", "integrate(x^2,x,-1,10)"]
    - id: rowvec
      row: 1
      col: 4
      desc: "row matrix/vector, 1×2"
      insert: "\\begin{pmatrix}#? & #?\\end{pmatrix}"
      sample: ["\\begin{pmatrix}1 & 2\\end{pmatrix}", "[[1,2]]"]
    - id: colvec
      row: 1
      col: 5
      desc: "column matrix/vector, 2×1"
      insert: "\\begin{pmatrix}#?\\\\ #?\\end{pmatrix}"
      sample: ["\\begin{pmatrix}1\\\\ 2\\end{pmatrix}", "[[1],[2]]"]
    # row 3
    - { id: abs,      row: 2, col: 0, desc: "absolute value |□|", key: neg, layer: shift }
    - id: mixed
      row: 2
      col: 1
      desc: "mixed number □ + □/□"
      insert: "#@\\tfrac{#?}{#?}"
      sample: ["2\\tfrac{11}{13}", "2+11/13"]
      # G2 item 36: the G2's cell leaves a typed 2 outside its brackets (2(+□/□), a product); ours takes it as the
      # whole part (docs/06 section 2)
    - id: sum
      row: 2
      col: 2
      desc: "sum Σ, □ = □ to □ of □"
      insert: "\\sum_{#?=#?}^{#?}\\left(#0\\right)"
      sample: ["\\sum_{k=1}^{10}\\left(k^2\\right)", "sum(k^2,k,1,10)"]
    - id: product
      row: 2
      col: 3
      desc: "product Π, □ = □ to □ of □"
      insert: "\\prod_{#?=#?}^{#?}\\left(#0\\right)"
      sample: ["\\prod_{k=1}^{10}\\left(k\\right)", "product(k,k,1,10)"]
    - id: logbase
      row: 2
      col: 4
      desc: "logarithm with base, log_□ □"
      insert: "\\log_{#?}\\left(#0\\right)"
      sample: ["\\log_{16}\\left(256\\right)", "ln(256)/ln(16)"]
    - id: dms
      row: 2
      col: 5
      desc: "degrees, minutes, seconds □°□′□″"
      insert: "#@\\degree#?\\prime#?\\doubleprime"
      sample: ["30\\degree15\\prime36\\doubleprime", "(30+15/60+36/3600)*pi/180"]
      # R27a (F22): a number typed before the cell is its degrees (5 DMS → 5°□′□″, the cursor in the minutes), as the
      # mixed number takes its whole part; a typed digit would otherwise join the degrees with no edge between them
  source: device

# ---- The Shift palettes (R18; the owner's G2, photos and screenshots of 2026-10-13, cell for cell). Same schema and
# grid sheet as the Tmpl palette above: ▲ ▼ ◀ ▶ move, Enter or a tap inserts, the last pick is remembered (Shift + 6,
# Enter repeats it), Esc goes back (closes), Cancel closes. The digit keys pick inside them, so Shift + 6 and Shift + 9
# cannot close their own palette (S2 rule M5). Every cell has its parser rule (app/src/input/parse.ts), its round trip
# (`sample`, run by the keyboard and round-trip tests) and a case in tests/golden/parser.yaml (group "palettes").
# `pick`: the key at the cell's place, shown on the cell, that picks it (the G2 labels this palette so; S2 rule M1).
# `refused: true`: the parser refuses the sample with a message (a meaning not settled yet; G2 checklist).
#
# Shift + 6, relations and logic, 4 × 3. == is a test (true/false), = makes an equation. AND, OR, XOR sit between
# their operands; AND binds tighter than OR and XOR, and each operand is bracketed for Giac. XOR goes to Giac as
# (a or b) and not(a and b): Giac's own xor gives 0 when a side is symbolic, a silent wrong answer. NOT(□) and EQ(□,□) are
# calls; EQ is the G2's list command (G2 item 32), read as == of the two whole objects (Giac has no EQ).
relations:
  columns: 4
  items:
    - { id: lt,   row: 0, col: 0, pick: d7, desc: "less than", insert: "<", sample: ["1<2", "1<2"] }
    - { id: le,   row: 0, col: 1, pick: d8, desc: "less than or equal", insert: "\\le", sample: ["1\\le2", "1<=2"] }
    - { id: gt,   row: 0, col: 2, pick: d9, desc: "greater than", insert: ">", sample: ["2>1", "2>1"] }
    - { id: ge,   row: 0, col: 3, pick: div, desc: "greater than or equal", insert: "\\ge", sample: ["2\\ge1", "2>=1"] }
    - { id: eqeq, row: 1, col: 0, pick: d4, desc: "equal (a test)", insert: "==", sample: ["2==2", "2==2"] }
    - { id: ne,   row: 1, col: 1, pick: d5, desc: "not equal", insert: "\\ne", sample: ["1\\ne2", "1!=2"] }
    - { id: and,  row: 1, col: 2, pick: d6, desc: "and", insert: "\\operatorname{AND}", sample: ["x>0\\operatorname{AND}x<1", "(x>0) and (x<1)"] }
    - { id: or,   row: 1, col: 3, pick: mul, desc: "or", insert: "\\operatorname{OR}", sample: ["x<0\\operatorname{OR}x>1", "(x<0) or (x>1)"] }
    - { id: not,  row: 2, col: 0, pick: d1, desc: "not", insert: "\\operatorname{NOT}\\left(#0\\right)", sample: ["\\operatorname{NOT}\\left(x>0\\right)", "not(x>0)"] }
    - { id: xor,  row: 2, col: 1, pick: d2, desc: "exclusive or", insert: "\\operatorname{XOR}", sample: ["x>0\\operatorname{XOR}x<1", "((x>0) or (x<1)) and not((x>0) and (x<1))"] }
    - { id: eq,   row: 2, col: 2, pick: d3, desc: "EQ, equality of two objects", insert: "\\operatorname{EQ}\\left(#0,#?\\right)", sample: ["\\operatorname{EQ}\\left(2,2\\right)", "2==2"] }
  source: device

# Shift + 9, symbols and Greek, 8 × 3; the G2 shows no keys on these cells (G2 item 37), so arrows, Enter or a tap.
# ! is factorial. → makes a function, Giac's -> (x → x² is the function that squares; assumed: the G2's use of → is to
# check). ∞ came from this key's Shift layer before R18. ° is R10's degree sign (degrees in every angle mode, the DMS
# rule), so 30° means one thing; ′ and ″ follow it as minutes and seconds. & and Å are refused for now: what & does on
# the G2 is not known, and Å is the ångström, a unit (units come with the unit view, milestone 5). Greek letters are
# variable names, never units (μ, Ω) and never Giac's own names (parse.ts GREEK maps β, γ, ε to free names); ε and φ
# insert \varepsilon and \varphi, the shapes the G2 draws.
symbols:
  columns: 8
  items:
    # row 1
    - { id: fact,    row: 0, col: 0, desc: "factorial", insert: "!", sample: ["5!", "factorial(5)"] }
    - { id: arrow,   row: 0, col: 1, desc: "function arrow", insert: "\\rightarrow", sample: ["x\\rightarrow x^2", "(x)->x^2"] }
    - { id: inf,     row: 0, col: 2, desc: "infinity", insert: "\\infty", sample: ["\\infty", "inf"] }
    - { id: deg,     row: 0, col: 3, desc: "degree", insert: "\\degree", sample: ["30\\degree", "30*pi/180"] }
    - { id: minute,  row: 0, col: 4, desc: "minute ′", insert: "\\prime", sample: ["30\\degree15\\prime", "(30+15/60)*pi/180"] }
    - { id: second,  row: 0, col: 5, desc: "second ″", insert: "\\doubleprime", sample: ["30\\degree36\\doubleprime", "(30+36/3600)*pi/180"] }
    - { id: amp,     row: 0, col: 6, desc: "ampersand", insert: "\\&", sample: ["1\\&2", ""], refused: true }
    - { id: aring,   row: 0, col: 7, desc: "ångström sign", insert: "\\AA", sample: ["5\\AA", ""], refused: true }
    # row 2
    - { id: alpha,   row: 1, col: 0, desc: "alpha", insert: "\\alpha", sample: ["2\\alpha", "2*alpha"] }
    - { id: beta,    row: 1, col: 1, desc: "beta", insert: "\\beta", sample: ["2\\beta", "2*beta_"] }
    - { id: gamma,   row: 1, col: 2, desc: "gamma", insert: "\\gamma", sample: ["2\\gamma", "2*gamma_"] }
    - { id: Delta,   row: 1, col: 3, desc: "capital delta", insert: "\\Delta", sample: ["2\\Delta", "2*Delta"] }
    - { id: delta,   row: 1, col: 4, desc: "delta", insert: "\\delta", sample: ["2\\delta", "2*delta"] }
    - { id: epsilon, row: 1, col: 5, desc: "epsilon", insert: "\\varepsilon", sample: ["2\\varepsilon", "2*epsilon_"] }
    - { id: theta,   row: 1, col: 6, desc: "theta", insert: "\\theta", sample: ["2\\theta", "2*theta"] }
    - { id: lambda,  row: 1, col: 7, desc: "lambda", insert: "\\lambda", sample: ["2\\lambda", "2*lambda"] }
    # row 3
    - { id: mu,      row: 2, col: 0, desc: "mu", insert: "\\mu", sample: ["2\\mu", "2*mu"] }
    - { id: rho,     row: 2, col: 1, desc: "rho", insert: "\\rho", sample: ["2\\rho", "2*rho"] }
    - { id: Sigma,   row: 2, col: 2, desc: "capital sigma", insert: "\\Sigma", sample: ["2\\Sigma", "2*Sigma"] }
    - { id: sigma,   row: 2, col: 3, desc: "sigma", insert: "\\sigma", sample: ["2\\sigma", "2*sigma"] }
    - { id: tau,     row: 2, col: 4, desc: "tau", insert: "\\tau", sample: ["2\\tau", "2*tau"] }
    - { id: phi,     row: 2, col: 5, desc: "phi", insert: "\\varphi", sample: ["2\\varphi", "2*phi"] }
    - { id: chi,     row: 2, col: 6, desc: "chi", insert: "\\chi", sample: ["2\\chi", "2*chi"] }
    - { id: Omega,   row: 2, col: 7, desc: "capital omega", insert: "\\Omega", sample: ["2\\Omega", "2*Omega"] }
  source: device

name: Idea
description: Suggest a feature, or tell us what you miss.
title: "Idea: "
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What you want to do
      description: The job, not the button. For example "convert a pressure range and keep its uncertainty".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: With N62, another calculator or a program. Optional.
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Optional.
